<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Candy's Math">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/apple-touch-icon.png">
<title>Candy's Math</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --paper:#F7F7F2; --grid:#E2E5DC; --ink:#23282B; --ink-soft:#6B7278;
    --line:#D8DBD2; --wrong:#DE3B2F; --again:#E8931C; --known:#2E9E5B; --done:#161A1D; --act:#2F5FD0;
    --case:#213551; --pink:#FF8CB7; --card:#FFFFFF; --radius:14px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color:var(--ink);background-color:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(40px + var(--safe-b))}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .hidden{display:none !important}

  .head{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .head .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(#213551,#1B2A41);
    color:var(--pink);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
  .head h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-0.02em}
  .head p{margin:1px 0 0;font-size:12px;color:var(--ink-soft)}

  .signal{display:flex;gap:6px;background:var(--case);border-radius:22px;padding:9px;margin-bottom:14px}
  .lamp{flex:1;border-radius:15px;padding:13px 3px 10px;text-align:center;color:#fff;min-width:0;
    background:rgba(255,255,255,.07);transition:background .18s,box-shadow .18s}
  .lamp b{display:block;font-size:23px;font-weight:700;line-height:1.05;letter-spacing:-0.03em}
  .lamp span{display:block;font-size:10px;margin-top:3px;opacity:.85;line-height:1.25;word-break:keep-all}
  .lamp.lit-red{background:var(--wrong)} .lamp.lit-again{background:var(--again)} .lamp.lit-green{background:var(--known)} .lamp.lit-done{background:var(--done);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
  .lamp.off{color:rgba(255,255,255,.4)}
  .lamp[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--case)}
  .w{color:var(--wrong)} .ag{color:var(--again)} .kn{color:var(--known)} .bk{color:var(--done)}

  .big{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--ink);color:#fff;
    border-radius:var(--radius);padding:18px;font-size:17px;font-weight:600;margin-bottom:10px}
  .big.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .big .cnt{font-size:14px;font-weight:500;opacity:.75}
  .big:disabled{opacity:.4}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px}
  .chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  .listhead{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 10px}
  .listhead .lt{font-weight:700;font-size:15px}
  .listhead button{font-size:14px;color:var(--act);font-weight:600}

  .item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:8px}
  .item .dot{flex:none;width:20px;height:20px;border-radius:50%}
  .item.l-red .dot{background:var(--wrong)} .item.l-again .dot{background:var(--again)} .item.l-green .dot{background:var(--known)} .item.l-done .dot{background:var(--done)}
  .item .meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
  .item .top{display:flex;align-items:center;gap:6px}
  .unit{font-size:13px;font-weight:600}
  .item .note{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .date{font-size:11px;color:var(--ink-soft)}
  .badge{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid currentColor;flex:none}
  .empty{padding:40px 12px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.7}
  .more{width:100%;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink-soft);font-size:14px}

  .screen{position:fixed;inset:0;background:var(--paper);z-index:20;overflow-y:auto;padding:14px 16px calc(20px + var(--safe-b))}
  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .bar .t{font-weight:700}
  .bar .pos{font-size:13px;color:var(--ink-soft);min-width:52px;text-align:right}
  .bar button{font-size:15px;color:var(--act);font-weight:600;padding:6px 2px}
  label.f2{display:block;font-size:13px;color:var(--ink-soft);margin:16px 0 6px}
  input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    font-family:inherit;font-size:16px;color:var(--ink)}

  .progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
  .progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
  .qwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 15px;margin-bottom:14px}
  .qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:10px}
  .nav{display:flex;gap:8px;margin:12px 0 10px}
  .nav button{flex:1;padding:13px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card);
    font-weight:600;font-size:14px;color:var(--ink-soft)}
  .nav button:disabled{opacity:.35}
  .judge{display:flex;gap:10px;position:sticky;bottom:calc(10px + var(--safe-b))}
  .judge button{flex:1;padding:16px 4px;border-radius:var(--radius);font-size:14.5px;font-weight:700;color:#fff;line-height:1.3;word-break:keep-all}
  .judge .again{background:var(--again)} .judge .got{background:var(--known)} .judge .perfect{background:var(--done)}
  .done{text-align:center;padding:60px 10px}
  .done .big-n{font-size:44px;font-weight:700;letter-spacing:-0.03em}

  .q{font-size:17px;line-height:1.75}
  .q svg{display:block;margin:14px auto;width:100%;max-width:240px;height:auto;color:var(--ink)}
  .f{display:inline-flex;flex-direction:column;vertical-align:-0.5em;text-align:center;line-height:1.1;margin:0 3px;font-size:.85em}
  .f i{font-style:normal;display:block;padding:0 3px}
  .f i:first-child{border-bottom:1.5px solid currentColor}
  pre.v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;line-height:1.5;margin:10px 0;white-space:pre}
  .bx{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px;background:var(--paper)}
  .fg{margin:10px 0;padding:9px 12px;border-left:3px solid var(--act);background:var(--paper);font-size:14px;color:var(--ink-soft);line-height:1.6}

  .reveal{display:flex;gap:8px;margin-top:14px}
  .reveal button{flex:1;padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:600;font-size:15px}
  .reveal button[aria-expanded="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .box-h,.box-a{margin-top:10px;padding:13px 15px;border-radius:12px;font-size:15px;line-height:1.7}
  .box-h{background:#FDF4E2;border:1px solid #EEDCB4}
  .box-a{background:#E9F5EE;border:1px solid #BFE0CC;font-weight:600}
  .box-h b,.box-a b{display:block;font-size:12px;font-weight:600;opacity:.6;margin-bottom:4px}

  .row{display:flex;gap:8px;margin-top:14px}
  .row button{flex:1;padding:13px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
  .row button.on-w{background:var(--wrong);color:#fff;border-color:var(--wrong)}
  .row button.on-ag{background:var(--again);color:#fff;border-color:var(--again)}
  .row button.on-k{background:var(--known);color:#fff;border-color:var(--known)}
  .row button.on-bk{background:var(--done);color:#fff;border-color:var(--done)}
  .row.solo button{font-size:14px;padding:14px 8px}
  .hist{font-size:12px;color:var(--ink-soft);margin-top:14px;line-height:1.8}
  .note{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-top:10px}
  .danger{color:var(--wrong);font-weight:600;padding:12px 0;width:100%;text-align:center;margin-top:18px}


  /* 인쇄 고르기 */
  .pick{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:7px}
  .pick .chk{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .pick[aria-pressed="true"] .chk{background:var(--act);border-color:var(--act)}
  .pick .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .pick .unit{font-size:13px;font-weight:600}
  .pick .note{font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick .dot{flex:none;width:12px;height:12px;border-radius:50%}
  .pick.l-red .dot{background:var(--wrong)} .pick.l-again .dot{background:var(--again)} .pick.l-green .dot{background:var(--known)}
  .stick{position:sticky;bottom:calc(10px + var(--safe-b));padding-top:10px}
  .stick button{width:100%;padding:17px;border-radius:var(--radius);background:var(--act);color:#fff;font-weight:700;font-size:17px}
  .stick button:disabled{opacity:.4}

  /* 인쇄물 */
  #printArea{display:none}
  @media print{
    body{background:none !important}
    .wrap,.screen,.toast{display:none !important}
    #printArea{display:block !important}
    @page{size:A4;margin:15mm 14mm}
  }
  #printArea .p-head{border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:baseline;font-size:12pt}
  #printArea .p-head b{font-size:13pt}
  #printArea .p-item{break-inside:avoid;page-break-inside:avoid;padding:9px 0;border-bottom:1px dashed #B9BDB4}
  #printArea .p-no{font-weight:700;margin-right:6px}
  #printArea .p-tag{font-size:9pt;color:#555}
  #printArea .q{font-size:11.5pt;line-height:1.6}
  #printArea .fg{border-left:2px solid #999;background:none;color:#333}
  #printArea .p-ans{page-break-before:always;break-before:page}
  #printArea .p-ans li{font-size:10.5pt;margin-bottom:5px;line-height:1.5}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-b));background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="wrap" id="home">
  <div class="head">
    <span class="mark">C</span>
    <div><h1>Candy's Math</h1><p>틀린 문제만 골라 다시 풀기</p></div>
  </div>

  <div class="signal">
    <button class="lamp" id="lampRed" data-f="red" aria-pressed="false"><b id="cw">0</b><span>틀렸어요</span></button>
    <button class="lamp" id="lampAgain" data-f="again" aria-pressed="false"><b id="ca">0</b><span>아직 모르겠어요</span></button>
    <button class="lamp" id="lampGreen" data-f="green" aria-pressed="false"><b id="ck">0</b><span>이제는 알아요</span></button>
    <button class="lamp" id="lampDone" data-f="done" aria-pressed="false"><b id="cd">0</b><span>틀릴 리 없어요</span></button>
  </div>

  <button class="big" id="btnReview">다시 풀기 시작 <span class="cnt" id="revCnt"></span></button>
  <button class="big ghost" id="btnPrint">문제 뽑아 인쇄 <span class="cnt" id="printCnt"></span></button>
  <button class="big ghost" id="btnSettings">설정 <span class="cnt" id="syncBadge">동기화 · 백업</span></button>

  <div class="listhead"><span class="lt" id="listTitle">틀렸어요</span><button id="allBtn">전체 보기</button></div>
  <div class="chips" id="semFilter" style="margin-bottom:8px"></div>
  <div class="chips" id="unitFilter" style="margin-bottom:12px"></div>
  <div id="list"></div>
  <button class="more hidden" id="btnMore">더 보기</button>
</div>

<input type="file" id="jsonPick" accept="application/json,.json" class="hidden">
<div class="toast" id="toast"></div>

<div class="screen hidden" id="scReview">
  <div class="bar"><button id="revQuit">그만하기</button><span class="t" id="revPos"></span><span style="width:56px"></span></div>
  <div class="progress"><i id="revBar"></i></div>
  <div id="revBody"></div>
</div>

<div class="screen hidden" id="scDetail">
  <div class="bar"><button id="detClose">닫기</button><span class="t" id="detTitle">문제</span><span class="pos" id="detPos"></span></div>
  <div id="detBody"></div>
</div>

<div class="screen hidden" id="scPrint">
  <div class="bar"><button id="prClose">닫기</button><span class="t">문제 뽑아 인쇄</span><span style="width:40px"></span></div>
  <div class="chips" id="prQuick" style="margin-bottom:8px"></div>
  <label class="f2">한 장에 넣을 문제 수</label>
  <div class="chips" id="prPer"></div>
  <label class="f2">답지</label>
  <div class="chips" id="prAns"></div>
  <label class="f2" id="prPool"></label>
  <div id="prList"></div>
  <div class="stick"><button id="prGo">인쇄하기</button></div>
</div>

<div id="printArea"></div>

<div class="screen hidden" id="scSet">
  <div class="bar"><button id="setClose">닫기</button><span class="t">설정</span><span style="width:40px"></span></div>

  <label class="f2">기기 동기화</label>
  <div class="chips" id="syncToggle"></div>
  <label class="f2">동기화 코드 <span style="opacity:.7">(두 기기에 같은 코드를 넣습니다)</span></label>
  <input type="text" id="syncCode" placeholder="예: candy-2026" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button class="big ghost" id="syncNow" style="margin-top:10px">지금 동기화 <span class="cnt" id="syncWhen"></span></button>
  <p class="note" id="syncMsg">동기화를 켜면 푼 기록이 같은 코드를 쓰는 기기끼리 자동으로 맞춰집니다. 끄면 이 기기 안에만 저장됩니다.</p>

  <label class="f2">다시 풀기 순서</label>
  <div class="chips" id="orderPick"></div>

  <label class="f2">백업</label>
  <button class="big ghost" id="doExport">파일로 내보내기 <span class="cnt">.json</span></button>
  <button class="big ghost" id="doImport">파일에서 불러오기 <span class="cnt">합치기</span></button>
  <p class="note" id="statTxt"></p>

  <button class="danger" id="wipe">푼 기록 전체 지우기</button>
</div>

<script>
(function(){
"use strict";
function fr(a,b){return '<span class="f"><i>'+a+'</i><i>'+b+'</i></span>'}
function mx(w,a,b){return w+fr(a,b)}

var SEED=[
{n:1,u:'곱셈',t:'0의 개수와 곱의 관계',s:'5번 (1)',q:`□ 안에 알맞은 수를 써넣으세요.<br>5 × □ = 350<br>5 × □ = 3500<br>50 × □ = 3500`},
{n:2,u:'곱셈',t:'곱하는 수를 쪼개어 계산하기',s:'10번',q:`□ 안에 알맞은 수를 써넣으세요.<br>16 × 15 = 16 × □ × 3<br>= □ × 3<br>= □`},
{n:3,u:'곱셈',t:'(두 자리 수) × (두 자리 수)',s:'(2)번',q:`□ 안에 알맞은 수를 써넣으세요.<br>54 × 38 = 54 × 30 + 54 × □<br>= □ + □<br>= □`},
{n:4,u:'곱셈',t:'세로셈 빈칸 채우기',s:'5번',q:`□ 안에 알맞은 수를 써넣으세요.<pre class="v">   2 □ 6
×      3
─────────
   7 3 8</pre>`},
{n:5,u:'곱셈',t:'자릿값으로 나타낸 수의 곱',s:'23번',q:`다음이 나타내는 수와 39의 곱을 구하세요.<div class="bx">10이 6개, 1이 2개인 수</div>`},
{n:6,u:'곱셈',t:'부등식에 들어갈 수의 개수',s:'2번 (서술형)',q:`1부터 9까지의 수 중에서 □ 안에 들어갈 수 있는 수는 모두 몇 개인지 풀이 과정을 쓰고 답을 구해 보세요.<div class="bx">146 × □ &lt; 600</div>`},
{n:7,u:'곱셈',t:'□ 안에 들어갈 수 구하기',s:'15번',q:`1부터 9까지의 수 중에서 □ 안에 들어갈 수 있는 가장 작은 수를 구해 보세요.<div class="bx">78 × □0 &gt; 5000</div>`},
{n:8,u:'곱셈',t:'가장 큰 수와 가장 작은 수의 곱',s:'22번',q:`가장 큰 수와 가장 작은 수의 곱을 구하세요.<div class="bx">81　　27　　42</div>`},
{n:9,u:'곱셈',t:'곱이 가장 큰 곱셈식 만들기',s:'17번',q:`수 카드 3장을 □ 안에 한 번씩만 써넣어 곱이 가장 큰 곱셈식을 만들고, 계산해 보세요.<div class="bx">5　2　7</div><pre class="v">     □
×  □ □</pre>`},
{n:10,u:'곱셈',t:'곱이 가장 큰 곱셈식 만들기',s:'9번',q:`4장의 수 카드를 한 번씩만 사용하여 계산 결과가 가장 큰 곱셈식을 만들고 곱을 구해 보세요.<div class="bx">8　4　6　3</div>□□ × □□ = □`},
{n:11,u:'곱셈',t:'자리가 정해진 곱셈식에서 곱이 가장 클 때',s:'진도책 7번',q:`3장의 수 카드 3, 5, 7을 한 번씩만 사용하여 아래와 같은 곱셈식을 만들려고 합니다. 계산 결과가 가장 클 때의 곱을 구하세요.<div class="bx">□□ × 4□</div>`},
{n:12,u:'곱셈',t:'곱이 가장 작은 곱셈식 만들기',s:'18번',q:`수 카드 3장을 □ 안에 한 번씩만 써넣어 곱이 가장 <b>작은</b> 곱셈식을 만들고, 계산해 보세요.<div class="bx">9　3　5</div><pre class="v">     □

{n:76,u:'원',t:'지름과 반지름의 성질',s:'6번',q:`원에 대한 설명으로 <b>틀린 것</b>을 모두 고르세요.<div class="bx">① 한 원에서 지름의 길이는 모두 같습니다.<br>② 한 원에서 반지름은 지름의 2배입니다.<br>③ 원의 지름은 원을 둘로 똑같이 나눕니다.<br>④ 한 원에서 지름은 셀 수 없이 많이 그을 수 있습니다.<br>⑤ 원의 반지름은 원 안에 그을 수 있는 가장 긴 선분입니다.</div>`},

{n:86,u:'원',t:'겹쳐 그린 원에서 반지름 구하기',s:'16번',g:1,q:`크기가 같은 원 5개를 서로 원의 중심을 지나도록 겹치게 그렸습니다. 선분 ㄱㄴ의 길이가 42 cm일 때 원의 반지름은 몇 cm인가요?<div class="fg">그림: 같은 원 5개가 옆 원의 중심을 지나도록 겹쳐 한 줄로 그려져 있고, ㄱㄴ은 전체의 왼쪽 끝에서 오른쪽 끝까지</div>`},

{n:137,u:'원',t:'큰 원과 작은 원의 반지름 관계',s:'6-2',g:1,q:`오른쪽 그림에서 큰 원의 반지름은 작은 원의 반지름의 2배입니다. 색칠한 사각형의 둘레가 42 cm일 때 큰 원의 지름은 몇 cm인지 풀이 과정을 쓰고 답을 구해 보세요.<div class="fg">그림: 교재의 그림을 함께 보세요.</div>`},
{n:138,u:'원',t:'세 원의 중심을 이은 삼각형에서 반지름의 합',s:'7-3',g:1,q:`오른쪽 그림은 세 원을 그리고 원의 중심을 이어 삼각형을 만든 것입니다. 삼각형 ㄱㄴㄷ의 둘레가 34 cm일 때 세 원의 반지름의 합은 몇 cm일까요?<div class="fg">그림: 교재의 그림을 함께 보세요.</div>`},
{n:139,u:'원',t:'중심을 지나도록 그린 원의 개수',s:'8-3',q:`지름이 8 cm인 원들을 서로 원의 중심을 지나도록 그린 것입니다. 선분 ㄱㄴ이 76 cm일 때 원을 몇 개 그렸을까요?`},
{n:140,u:'원',t:'직사각형 둘레에서 원의 지름 구하기',s:'8-4',g:1,q:`직사각형 안에 크기가 같은 원 12개를 서로 원의 중심을 지나도록 그린 것입니다. 직사각형의 둘레가 90 cm일 때 원의 지름은 몇 cm일까요?<div class="fg">그림: 교재의 그림을 함께 보세요.</div>`},
{n:141,u:'원',t:'겹쳐 그린 두 원에서 선분의 길이',s:'80쪽 4번',g:1,q:`오른쪽 그림은 지름이 각각 14 cm, 18 cm인 두 원을 서로 겹치게 그린 것입니다. 선분 ㄴㄷ이 4 cm일 때 선분 ㄱㄹ은 몇 cm인지 풀이 과정을 쓰고 답을 구해 보세요.<div class="fg">그림: 교재의 그림을 함께 보세요.</div>`},
{n:142,u:'원',t:'직사각형 안 큰 원과 작은 원 2개',s:'81쪽 6번',g:1,q:`오른쪽 그림은 직사각형 안에 큰 원과 크기가 같은 작은 원 2개를 서로 맞닿게 그린 것입니다. 작은 원의 반지름은 몇 cm일까요? (단, 세 원의 중심들은 한 직선 위에 있습니다.)<div class="fg">그림: 교재의 그림을 함께 보세요.</div>`},
{n:143,u:'원',t:'세 원의 중심과 마름모에서 선분 구하기',s:'6-4',g:1,q:`오른쪽 그림에서 작은 두 원의 크기는 같고 세 원의 중심들은 한 직선 위에 있습니다. 삼각형 ㄱㄴㄷ의 둘레는 102 cm, 색칠한 사각형의 둘레는 56 cm입니다. 선분 ㄱㄴ과 선분 ㄱㄷ의 길이가 같을 때 선분 ㄱㄴ은 몇 cm일까요? (단, 작은 원의 반지름은 가장 가까운 자연수로 어림한 값입니다.)<div class="fg">그림: 교재의 그림을 함께 보세요.</div>`},
{n:144,u:'원',t:'네 원의 중심을 이은 두 삼각형',s:'7-4',g:1,q:`오른쪽 그림은 네 원을 그리고 원의 중심을 이어 각각 삼각형을 만든 것입니다. 삼각형 ㄱㄴㄹ의 둘레는 45 cm이고 삼각형 ㄴㄷㄹ의 둘레는 35 cm입니다. 점 ㄱ을 원의 중심으로 하는 원과 점 ㄷ을 원의 중심으로 하는 원의 반지름의 차는 몇 cm일까요?<div class="fg">그림: 교재의 그림을 함께 보세요.</div>`},
{n:145,u:'원',t:'그림에서 원의 중심 개수 세기',s:'80쪽 2번 대체',q:`그림에서 찾을 수 있는 원의 중심은 모두 몇 개일까요?<svg viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="120" cy="75" r="60"/><circle cx="90" cy="75" r="30"/><circle cx="150" cy="75" r="30"/><circle cx="75" cy="75" r="15"/><circle cx="165" cy="75" r="15"/></svg>`},
{n:146,u:'원',t:'중심을 지나는 세 원과 삼각형의 둘레',s:'81쪽 9번 대체',q:`크기가 같은 세 원을 서로 원의 중심을 지나도록 그리고, 세 원의 중심을 이어 삼각형을 만들었습니다. 이 삼각형의 둘레가 36 cm일 때 원의 반지름은 몇 cm일까요?<svg viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="110" cy="72" r="60"/><circle cx="80" cy="124" r="60"/><circle cx="140" cy="124" r="60"/><path d="M110 72 L80 124 L140 124 Z" stroke-width="2.2"/><circle cx="110" cy="72" r="3" fill="currentColor"/><circle cx="80" cy="124" r="3" fill="currentColor"/><circle cx="140" cy="124" r="3" fill="currentColor"/></svg>`},
{n:147,u:'원',t:'정사각형 안의 원과 사분원',s:'81쪽 11번 대체',q:`정사각형의 네 꼭짓점을 각각 원의 중심으로 하여 크기가 같은 사분원 4개를 겹치지 않게 그렸습니다. 점선으로 그린 원은 정사각형 안에 꼭 맞는 가장 큰 원이고 지름이 36 cm입니다. 사분원 한 개의 반지름은 몇 cm일까요?<svg viewBox="0 0 210 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="40" y="40" width="120" height="120"/><circle cx="100" cy="100" r="60" stroke-dasharray="4 3"/><path d="M100 40 A60 60 0 0 1 40 100"/><path d="M160 100 A60 60 0 0 1 100 40"/><path d="M40 100 A60 60 0 0 1 100 160"/><path d="M100 160 A60 60 0 0 1 160 100"/><path d="M40 176 L160 176" stroke-dasharray="3 3"/><text x="100" y="194" font-size="12" fill="currentColor" stroke="none" text-anchor="middle">36 cm</text></svg>`},
{n:148,u:'분수',t:'시간을 분으로 바꿔 몇 번 쉬는지 구하기',s:'89쪽 1-3',q:`현수가 ${fr("37","12")}시간 동안 공부를 하는데 30분씩 공부한 후 한 번씩 쉬려고 합니다. 현수는 공부하는 동안 모두 몇 번 쉴까요? (단, ${fr("37","12")}시간에는 쉬는 시간이 포함되지 않습니다.)`},
{n:149,u:'분수',t:'대분수를 단위로 끊어 값 구하기',s:'89쪽 1-4',q:`상자를 묶는 데 끈 ${fr("195","8")} m가 필요합니다. 끈이 5 m에 160원일 때 상자를 묶는 끈을 사는 데 필요한 돈은 적어도 얼마일까요? (단, 끈은 5 m 단위로만 팝니다.)`},

{n:156,u:'분수',t:'규칙을 찾아 대분수로 나타내기',s:'93쪽 6-3',q:`다음과 같은 규칙으로 분수를 늘어놓을 때, 43째에 놓을 분수를 대분수로 나타내려고 합니다. 풀이 과정을 쓰고 답을 구해 보세요.<div class="bx">${fr("1","3")}, ${fr("4","4")}, ${fr("7","5")}, ${fr("10","6")}, ${fr("13","7")}, …</div>`},

{n:158,u:'분수',t:'튀어 오르는 공의 높이',s:'94쪽 7-1',q:`떨어진 높이의 ${fr("3","7")}만큼 튀어 오르는 공이 있습니다. 이 공을 147 cm의 높이에서 떨어뜨린다면 둘째로 튀어 오르는 공의 높이는 몇 cm일까요?`},
{n:159,u:'분수',t:'공이 움직인 거리의 합',s:'94쪽 7-4',q:`현지가 공을 81 m의 높이에서 떨어뜨렸더니 첫째는 떨어뜨린 높이의 ${fr("5","9")}만큼 튀어 올랐고, 둘째는 첫째에 튀어 오른 높이의 ${fr("3","5")}만큼 튀어 올랐습니다. 이 공을 처음 떨어뜨린 후 둘째로 튀어 올랐다가 다시 땅에 닿을 때까지 움직인 거리는 모두 몇 m일까요? (단, 공은 위아래로만 움직입니다.)`},
{n:160,u:'들이와 무게',t:'물건의 무게 사이의 관계',s:'113쪽 6번',q:`수박 1통의 무게는 멜론 3통의 무게와 같고, 멜론 1통의 무게는 참외 4개의 무게와 같습니다. 수박 1통의 무게는 참외 몇 개의 무게와 같을까요? (단, 같은 과일끼리는 무게가 같습니다.)`},
{n:161,u:'분수',t:'조건에 맞는 가분수의 개수',s:'48쪽 8-1 대체',q:`분모가 8인 가분수를 대분수로 나타냈더니 자연수 부분이 4이고, 가분수의 분자는 두 자리 수였습니다. 이런 가분수는 모두 몇 개일까요?`},
{n:162,u:'분수',t:'분자를 분모로 나누어 대분수로 바꾸기',s:'48쪽 9번 대체',q:`가분수 ${fr("■","9")}의 분자를 분모로 나누었더니 몫이 60이고 나머지가 5였습니다. 이 가분수를 대분수로 나타내 보세요.`},
{n:163,u:'분수',t:'합과 차로 진분수 구하기',s:'48쪽 10번 대체',q:`분모와 분자의 합이 91이고 차가 21인 진분수를 구해 보세요.`},
{n:164,u:'분수',t:'대분수를 가분수로 바꿔 범위 찾기',s:'48쪽 11번 대체',q:`대분수 ㉠${fr("8","13")}을 가분수로 나타내면 분자가 100보다 크고 130보다 작습니다. ㉠에 알맞은 자연수를 모두 구해 보세요.`},
{n:165,u:'분수',t:'일정하게 타는 양초',s:'50쪽 12번 대체',q:`일정한 빠르기로 타는 양초에 불을 붙이고 12분이 지난 뒤 길이를 재어 보니 처음 길이의 ${fr("5","8")}이 남았습니다. 남은 양초가 모두 타는 데 걸리는 시간은 몇 분일까요?`},
{n:166,u:'분수',t:'두 수 사이의 대분수 개수',s:'50쪽 13번 대체',q:`${mx("1","3","9")}보다 크고 ${mx("2","5","9")}보다 작은 분수 중에서 분모가 9인 대분수는 모두 몇 개일까요?`},
{n:167,u:'분수',t:'조건을 모두 만족시키는 분수',s:'50쪽 14번 대체',q:`조건을 모두 만족시키는 분수를 구해 보세요.<div class="bx">· 분모가 12인 진분수입니다.<br>· 분자는 5보다 큽니다.<br>· 분모와 분자의 차는 4입니다.</div>`},

{n:169,u:'분수',t:'하루를 나누어 쓰는 시간',s:'MATH MASTER 1번 대체',q:`세윤이는 하루의 ${fr("1","3")}은 잠을 자고, ${fr("1","8")}은 밥을 먹고, ${fr("1","4")}은 학교에서 보냅니다. 나머지 시간은 몇 시간일까요?`},
{n:170,u:'분수',t:'전체의 분수만큼 비교하기',s:'MATH MASTER 2번 대체',q:`연필 1타는 12자루입니다. 연필 7타 중에서 수영이는 전체의 ${fr("1","4")}만큼을, 우현이는 전체의 ${fr("1","3")}만큼을 가졌습니다. 누가 연필을 몇 자루 더 많이 가지게 될까요?`},
{n:171,u:'분수',t:'나머지 인원 구하기',s:'MATH MASTER 3번 대체',q:`재민이네 반 학생은 28명입니다. 이 중에서 안경을 쓴 남학생은 전체의 ${fr("1","4")}이고, 안경을 쓴 여학생은 전체의 ${fr("1","7")}입니다. 안경을 쓰지 않은 학생은 몇 명인지 풀이 과정을 쓰고 답을 구해 보세요.`},
{n:172,u:'분수',t:'걸린 시간의 분수만큼',s:'49쪽 5번 대체',q:`지혜는 오후 12시 50분에 집에서 출발하여 오후 2시 5분에 도서관에 도착했습니다. 걸린 시간 중 전체의 ${fr("2","5")}는 버스를 탔고 나머지는 걸었습니다. 걸은 시간은 몇 분일까요?`},
{n:173,u:'분수',t:'거꾸로 전체 구하기',s:'MATH MASTER 8번 대체',q:`A 가게에서 판매한 당근 수의 ${fr("8","11")}은 40개입니다. B 가게에서 판매한 당근 수의 ${fr("5","8")}은 A 가게에서 판매한 당근 수와 같습니다. B 가게에서 판매한 당근은 몇 개일까요?`},

var EXTRA={"1":{"h":"곱하는 수에 0이 하나 붙으면 곱에도 0이 하나 더 붙습니다. 5×7=35를 기준으로 0의 개수만 맞춰 보세요.","a":"70, 700, 70"},"2":{"h":"곱하는 수를 두 수의 곱으로 쪼개면(15=5×3) 쉬운 곱셈 두 번으로 바뀝니다.","a":"5, 80, 240"},"3":{"h":"두 자리 수를 몇십과 몇으로 쪼개(38=30+8) 각각 곱한 뒤 더합니다.","a":"8 / 1620 + 432 / 2052"},"4":{"h":"일의 자리부터 거꾸로 맞춰 봅니다. 또는 738÷3을 계산하면 곱해지는 수가 바로 나옵니다.","a":"□=4 (246×3=738)"},"5":{"h":"10이 6개는 60, 1이 2개는 2이므로 62입니다. 자릿값을 먼저 수로 바꾸세요.","a":"2418 (62×39)"},"6":{"h":"□에 1부터 차례로 넣어 600을 넘기 직전까지 세어 봅니다. 146×4=584, 146×5=730.","a":"4개 (1, 2, 3, 4)"},"7":{"h":"□0은 몇십을 뜻합니다. 78×60=4680, 78×70=5460이므로 5000을 넘는 첫 수를 찾습니다.","a":"7"},"8":{"h":"먼저 세 수의 크기를 비교해 가장 큰 수와 가장 작은 수를 고른 뒤 곱합니다.","a":"2187 (81×27)"},"9":{"h":"곱을 크게 하려면 가장 큰 숫자를 곱하는 수(한 자리) 자리에 놓습니다.","a":"52×7=364"},"10":{"h":"큰 수 두 개를 각각 십의 자리에 놓고, 남은 두 수를 엇갈리게 넣어 두 경우를 비교합니다.","a":"83×64=5312"},"11":{"h":"빈칸의 자리가 정해져 있으므로 가능한 배치를 몇 개만 만들어 곱을 비교합니다.","a":"73×45=3285"},"12":{"h":"곱을 작게 하려면 가장 작은 숫자를 곱하는 수(한 자리) 자리에 놓습니다.","a":"59×3=177"},"13":{"h":"곱을 작게 하려면 작은 수 두 개를 각각 십의 자리에 놓고 두 경우를 비교합니다.","a":"25×47=1175"},"14":{"h":"자리가 정해진 곱셈식은 가능한 배치를 만들어 곱을 직접 비교하는 것이 빠릅니다.","a":"26×39=1014"},"15":{"h":"잘못한 식으로 어떤 수를 먼저 구합니다. □−4=102 → □=106.","a":"424 (106×4)"},"16":{"h":"약속한 기호는 순서를 바꿔 계산하라는 뜻입니다. 가♣나=나×가이므로 뒤 수를 앞에 놓습니다.","a":"1656 (72×23)"},"17":{"h":"하루에 읽는 시간 × 날수. 곱셈 문장제는 단위를 확인하고 식을 세웁니다.","a":"675분"},"18":{"h":"주를 날수로 먼저 바꿉니다. 3주=21일.","a":"945쪽"},"19":{"h":"두 곱을 각각 계산해 비교합니다. 눈으로 어림만 하면 틀리기 쉽습니다.","a":"㉡ (105 < 108)"},"20":{"h":"각각의 전체 개수를 곱셈으로 구한 뒤 빼서 차를 구합니다.","a":"귤이 14개 더 많다 (162, 176)"},"21":{"h":"담은 개수를 곱셈으로 구한 뒤 전체에서 뺍니다.","a":"28개 (210−182)"},"22":{"h":"이어 붙이면 겹친 곳은 (장수−1)군데입니다. 전체 길이 − 겹친 길이.","a":"428 cm (464−36)"},"23":{"h":"30장을 이으면 겹친 곳은 29군데입니다.","a":"906 cm (1080−174)"},"24":{"h":"같은 수를 곱하는 두 식은 (□+□)×같은 수로 묶을 수 있습니다.","a":"49 / 200 / 600"},"25":{"h":"2000÷90을 어림해 몇십인지 먼저 잡고, 그 근처를 하나씩 확인합니다.","a":"(1) 2  (2) 23"},"26":{"h":"양끝을 먼저 계산해 400 < □×72 < 567로 바꾼 뒤 □를 넣어 봅니다.","a":"6, 7"},"27":{"h":"잘못한 식으로 어떤 수를 구하고(□+17=22 → 5), 바른 값과 잘못된 a":"6"},"55":{"h":"같은 모양은 같은 수입니다. 먼저 ●를 구한 뒤 두 번째 식에 넣습니다.","a":"3 (●=6, 87÷6=14…3)"},"56":{"h":"두 식을 각각 계산해 ●와 ◆를 구한 뒤 큰 수에서 작은 수를 뺍니다.","a":"17 (21−4)"},"57":{"h":"몇 접시가 필요한지 먼저 나눗셈으로 구합니다. 56÷4=14.","a":"20개입 — 14접시가 필요해서 10개입으로는 모자랍니다"},"58":{"h":"몫을 크게 하려면 나누는 수를 가장 작게, 나누어지는 수를 가장 크게 만듭니다.","a":"754÷3 → 몫 251, 나머지 1"},"59":{"h":"잘못한 식으로 어떤 수를 먼저 구합니다. 6×15+3=93.","a":"몫 11, 나머지 5"},"60":{"h":"나머지를 빼고 나누면 사람 수가 나옵니다((66−3)÷9=7명). 그다음 30개를 7명에게 나눕니다.","a":"5개"},"61":{"h":"철사 전체 길이를 모양의 둘레 칸 수로 나누면 한 칸의 길이가 나옵니다.","a":"27 (■=13, ▲=14)"},"62":{"h":"정사각형의 한 변을 먼저 구하고(528÷4=132), 나눈 칸 수로 다시 나눕니다.","a":"44 cm"},"63":{"h":"가로와 세로 각각 몇 조각이 나오는지 따로 구한 뒤 곱합니다.","a":"357조각 (17×21)"},"64":{"h":"겹치지 않았을 때의 길이에서 실제 길이를 뺀 것이 겹친 길이의 합입니다. 겹친 곳은 9군데.","a":"10 cm"},"65":{"h":"먼저 노란 구슬 한 개의 무게를 구하고(39÷3), 전체에서 노란 구슬 몫을 뺍니다.","a":"15 g"},"66":{"h":"두 기계가 1분에 몇 개씩 만드는지 구해 차를 냅니다. 15−12=3.","a":"30분"},"67":{"h":"주를 날수로 바꾸고(5주=35일), 두 사람 몫을 나눈 뒤 한 사람 몫으로 다시 나눕니다.","a":"14개"},"68":{"h":"원 모양 둘레에서는 간격 수와 개수가 같습니다.","a":"16개"},"69":{"h":"먼저 둘레를 구합니다((18+12)×2=60). 둘레를 도는 경우 말뚝 수 = 간격 수.","a":"20개"},"70":{"h":"곧은 길 한쪽은 (간격 수)+1개가 필요합니다.","a":"14개"},"71":{"h":"한쪽을 먼저 구하고(39+1=40) 양쪽이므로 2배 합니다.","a":"80개"},"72":{"h":"양쪽에 20개면 한쪽은 10개, 간격은 9군데입니다.","a":"30 m"},"73":{"h":"나무 사이 간격 5군데를 먼저 구하고, 한 구간마다 말뚝 수를 구해 곱합니다.","a":"95개"},"74":{"h":"반지름은 지름의 절반입니다. 모두 지름으로 바꿔 비교하세요.","a":"㉢ (지름 12 cm)"},"75":{"h":"설명을 모두 지름으로 바꿔 비교합니다. 중심을 지나는 선분이 지름입니다.","a":"민주, 성환, 유라"},"76":{"h":"한 원에서 지름 = 반지름의 2배이고, 원 안에서 가장 긴 선분은 지름입니다.","a":"②, ⑤"},"77":{"h":"먼저 반지름을 찾습니다(4 cm). 지름은 그 2배이고, 중심을 지나지 않는 선분은 지름보다 짧습니다.","a":"㉠, ㉡ (반지름 4 cm, 지름 8 cm)"},"78":{"h":"정사각형 안에 꼭 맞는 원은 지름이 정사각형의 한 변과 같습니다.","a":"8 cm"},"79":{"h":"작은 원의 지름이 큰 원의 반지름과 같습니다.","a":"6 cm"},"80":{"h":"큰 원의 지름 안에 작은 원의 지름 2개가 들어갑니다.","a":"4 cm"},"81":{"h":"반지름이 2, 4, 6 … 으로 늘어납니다. 여섯째 원의 반지름을 구해 2배 합니다.","a":"24 cm"},"82":{"h":"조건이 참이 될 때까지 명령을 반복합니다. 8 → 13이 되어 10보다 길어집니다.","a":"26 cm"},"83":{"h":"맞닿은 두 원은 지름을 이어 붙인 것과 같습니다.","a":"26 cm (10+16)"},"84":{"h":"반지름 1 cm면 지름은 2 cm, 원 3개가 나란히 맞닿아 있습니다.","a":"6 cm"},"85":{"h":"이웃한 두 원의 중심 사이 거리는 두 반지름의 합입니다.","a":"26 cm (10+16)"},"86":{"h":"중심을 지나도록 겹치면 반지름이 하나씩 늘어납니다. 반지름 6개가 42 cm.","a":"7 cm"},"87":{"h":"큰 원의 지름에서 작은 원들의 반지름을 차례로 더하거나 빼며 따라갑니다.","a":"9 cm"},"88":{"h":"맞닿은 두 원의 중심 사이 거리는 두 반지름의 합입니다. 세 변을 각각 구해 더합니다.","a":"24 cm (9+7+8)"},"89":{"h":"겹친 부분만큼 짧아집니다. 두 반지름의 합에서 겹친 길이를 뺍니다.","a":"29 cm"},"90":{"h":"삼각형 한 변은 24÷3=8 cm이고, 그 안에 지름이 2개 들어갑니다.","a":"지름 4 cm"},"91":{"h":"가로는 지름 3개, 세로는 지름 1개입니다.","a":"48 cm (가로 18, 세로 6)"},"92":{"h":"둘레로 가로를 먼저 구한 뒤, 사분원의 반지름만큼 빼서 남은 길이를 구합니다.","a":"4 cm"},"93":{"h":"삼각형의 두 변이 반지름과 반지름 2개로 이루어집니다. 3×반지름+10=37.","a":"9 cm"},"95":{"h":"직사각형의 두 변을 먼저 구하고(6, 8), 선분 ㄱㅇ이 원의 반지름임을 이용합니다.","a":"40 cm (반지름 5, 지름 10)"},"96":{"h":"컴퍼스 침은 원의 중심마다 한 번씩 꽂습니다. 큰 원과 안쪽 곡선들을 따로 세어 보세요.","a":"5군데 (큰 원 1 + 안쪽 곡선 4)"},"97":{"h":"전체를 똑같이 4묶음으로 나누면 한 묶음이 1/4입니다. 24÷4=6.","a":"(1) 6  (2) 12  (3) 18"},"98":{"h":"전체가 몇 도막인지 먼저 구합니다(48÷8=6도막). 40 cm는 5도막.","a":"5/6"},"99":{"h":"단위를 먼저 바꿉니다. 1 m=100 cm, 1시간=60분.","a":"(1) 60 cm  (2) 50분"},"100":{"h":"1/4이 8이면 그런 묶음이 4개이므로 8×4입니다.","a":"(1) 32  (2) 63"},"101":{"h":"단위분수를 이용해 전체를 먼저 구합니다. 1/6이 5면 전체는 30.","a":"10"},"102":{"h":"3/7이 27이면 1/7은 9, 전체는 63입니다. 그다음 2/9를 구합니다.","a":"14"},"103":{"h":"사용한 길이를 먼저 구한 뒤 전체에서 뺍니다. 또는 남은 몫 4/6로 바로 구합니다.","a":"36 cm"},"104":{"h":"남은 쪽수를 먼저 구합니다(90−10=80). 오늘 읽은 양은 남은 쪽수의 분수만큼입니다.","a":"50쪽"},"105":{"h":"대분수를 가분수로 바꾸면 분자만 비교하면 됩니다.","a":"17/7"},"106":{"h":"모두 분모가 6인 가분수로 바꿔 분자를 비교합니다.","a":"시은, 건우, 민호"},"107":{"h":"대분수는 자연수 부분이 클수록 큽니다. 자연수에 가장 큰 수를 넣습니다.","a":"9와 4/5 = 49/5"},"108":{"h":"자연수 자리를 가장 크게 만든 뒤(86), 남은 두 수로 진분수를 만듭니다.","a":"86과 1/5"},"109":{"h":"가분수는 분자가 분모와 같거나 더 큰 분수입니다.","a":"8개 (1~8)"},"110":{"h":"모두 분모가 11인 가분수로 바꾸면 20/11 < □/11 < 29/11입니다.","a":"8개 (21~28)"},"111":{"h":"합이 11, 차가 3인 두 수를 찾습니다. 7과 4.","a":"4/7"},"112":{"h":"한 번 튀어 오를 때마다 3/4을 곱합니다. 32 → 24 → 18.","a":"18 m"},"113":{"h":"첫 번째와 두 번째 높이를 각각 구한 뒤 뺍니다. 64 → 40 → 25.","a":"15 m"},"114":{"h":"mL끼리 뺄 수 없으면 1 L를 1000 mL로 바꿔 받아내림합니다.","a":"4 L 300 mL"},"115":{"h":"일의 자리(g)부터 거꾸로 맞춥니다. 받아내림이 있었는지 확인하세요.","a":"300 / 4 (7 kg 300 g − 4 kg 400 g)"},"116":{"h":"g끼리 더해 1000이 넘으면 1 kg으로 받아올림합니다.","a":"서준 — 바르게 계산하면 6 kg 50 g"},"117":{"h":"모두 계산해 같은 단위로 만든 뒤 비교합니다.","a":"㉢ (6 kg 300 g)"},"118":{"h":"단위를 하나로 맞춰(mL) 비교합니다.","a":"1900 mL"},"119":{"h":"민주가 마신 양을 먼저 구한 뒤(3 L 800 mL) 두 사람 것을 더합니다.","a":"9 L 100 mL"},"120":{"h":"들이를 비교하려면 크기가 같은 컵으로 옮겨 담아야 합니다.","a":"없습니다 — 컵의 크기가 서로 다르기 때문"},"121":{"h":"단위로 쓰려면 개수마다 크기와 무게가 거의 같아야 합니다.","a":"마늘"},"122":{"h":"개수가 같아도 한 개의 무게가 다르면 전체 무게도 다릅니다.","a":"× — 동전의 종류가 달라 한 개의 무게가 다르기 때문"},"123":{"h":"먼저 당근 한 개의 무게를 구합니다(120÷2=60).","a":"180 g"},"124":{"h":"키위 4개의 무게를 먼저 구해 전체에서 뺍니다.","a":"780 g"},"125":{"h":"합에서 차를 뺀 뒤 반으로 나누면 가벼운 쪽이 나옵니다.","a":"7 kg"},"126":{"h":"표에서 한 말과 한 되를 찾아 그대로 더합니다.","a":"19 L 800 mL"},"127":{"h":"1 L는 1000 mL입니다. 1000÷200.","a":"5번"},"128":{"h":"두 그릇을 더하기만 하지 말고 덜어내는 방법도 생각해 봅니다.","a":"가 2번 부은 뒤 나 1번 덜어내기 (5000−1500=3500)"},"129":{"h":"반복 명령은 그 횟수만큼 더하는 것입니다. 1 L 900 mL를 2번.","a":"아니요 (3 L 800 mL로 넘치지 않음)"},"130":{"h":"상자까지 포함한 전체 무게를 먼저 구한 뒤 표의 구간을 봅니다.","a":"5000원 (2 kg 700 g → 3 kg까지)"},"131":{"h":"큰 그림은 10, 작은 그림은 1입니다. 종류별로 세어 모두 더합니다.","a":"167잔"},"132":{"h":"반별 학생 수를 모두 더한 뒤 4를 곱합니다.","a":"472개 (118명)"},"133":{"h":"가장 많은 사람과 가장 적은 사람을 먼저 찾아 각각 수로 바꿉니다.","a":"49회 (152−103)"},"134":{"h":"직사각형의 가로와 세로를 먼저 구합니다. 세로는 큰 원의 지름, 가로는 두 원의 지름의 합입니다.","a":"12개 (가로 18 cm에 4개, 세로 12 cm에 3줄)"},"135":{"h":"25개는 5줄씩 5개입니다. 한 줄에 들어간 원의 지름을 모두 더하면 정사각형의 한 변이 됩니다.","a":"30 cm (한 변 5×6=30)"},"136":{"h":"삼각형의 한 변에 반지름 2개가 들어갑니다. 한 변의 길이가 곧 원의 지름입니다.","a":"23 cm (69÷3)"},"137":{"h":"작은 원의 반지름을 □로 두면 사각형의 네 변이 모두 □ 몇 개인지로 나타납니다. 큰 원의 반지름은 □의 2배.","a":"28 cm (□=7, 지름=□×4)"},"138":{"h":"이웃한 두 원의 중심 사이 거리는 두 반지름의 합입니다. 그래서 삼각형의 둘레는 반지름 합의 2배가 됩니다.","a":"17 cm (34÷2)"},"139":{"h":"중심을 지나도록 겹치면 원 하나가 늘 때마다 반지름만큼 길어집니다. 전체 길이는 반지름 (원의 수 + 1)개입니다.","a":"18개 (76÷4=19, 19−1)"},"140":{"h":"가로는 반지름 13개, 세로는 반지름 2개입니다. 둘레를 반지름 몇 개로 나타내 보세요.","a":"6 cm (반지름 30개=90, 반지름 3)"},"141":{"h":"두 반지름을 더한 뒤, 겹친 부분만큼 빼 줍니다.","a":"12 cm (7+9−4)"},"142":{"h":"직사각형의 가로는 큰 원의 지름과 작은 원의 지름 2개를 더한 길이입니다.","a":"2 cm (작은 원 지름 4, 14=6+4+4)"},"143":{"h":"색칠한 사각형의 네 변은 모두 작은 원의 반지름입니다. 반지름을 먼저 구하면 선분 ㄴㄷ의 길이가 나옵니다.","a":"30 cm (반지름 14, ㄴㄷ=42, (102−42)÷2)"},"144":{"h":"두 삼각형은 변 ㄴㄹ을 함께 씁니다. 두 둘레의 차를 구하면 겹치는 부분이 지워지고 ㄱ원과 ㄷ원의 반지름만 남습니다.","a":"5 cm (둘레 차 10 = 반지름 차의 2배)"},"145":{"h":"그림에 그려진 원을 하나씩 세어 봅니다. 원 하나마다 중심이 하나씩 있습니다.","a":"5개 (큰 원 1 + 가운데 원 2 + 가장 작은 원 2)"},"146":{"h":"한 원이 다른 원의 중심을 지나면 두 중심 사이의 거리는 반지름과 같습니다. 삼각형의 세 변이 모두 반지름입니다.","a":"12 cm (36÷3)"},"147":{"h":"점선 원의 지름이 정사각형의 한 변과 같습니다. 사분원 2개가 한 변을 반씩 나누어 씁니다.","a":"18 cm (한 변 36, 36÷2)"},"148":{"h":"먼저 시간을 분으로 바꿉니다. 1시간은 60분입니다. 그다음 30분씩 몇 번 나누어지는지 봅니다.","a":"6번 (185분 = 30×6 + 5)"},"149":{"h":"가분수를 대분수로 바꿔 몇 m가 필요한지 봅니다. 5 m 단위로만 파니까 모자라지 않게 올려서 삽니다.","a":"800원 (24 3/8 m → 25 m → 5묶음)"},"150":{"h":"양쪽의 가분수를 대분수로 바꾸면 자연수 부분끼리 비교할 수 있습니다.","a":"5, 6, 7, 8 (4와 8/11 < □와 5/11 < 8과 10/11)"},"151":{"h":"먼저 ■를 구합니다. 2묶음이 14이면 1묶음은 7입니다.","a":"★ = 15 (■=21, 21의 5/7)"},"152":{"h":"11묶음이 22이면 1묶음은 2입니다. 어떤 수를 먼저 구한 뒤 대분수만큼 구합니다.","a":"35 (어떤 수 30, 30 + 5)"},"153":{"h":"세 분수 모두 1에서 얼마만큼 모자란지 생각합니다. 모자란 양이 작을수록 큰 수입니다.","a":"788/789, 539/540, 180/181"},"154":{"h":"두 개씩 짝을 지어 보면 자연수 부분이 하나씩 커집니다. 26째는 몇 번째 짝의 몇 번째인지 세어 보세요.","a":"12와 2/3 (13번째 짝의 둘째)"},"155":{"h":"분자와 분모가 각각 얼마씩 커지는지 따로 봅니다. 19째는 처음에서 18번 커진 것입니다.","a":"55/75 (분자 1+3×18, 분모 3+4×18)"},"156":{"h":"분자는 3씩, 분모는 1씩 커집니다. 43째의 가분수를 먼저 구한 뒤 대분수로 바꿉니다.","a":"2와 37/45 (127/45)"},"157":{"h":"묶음마다 분수의 개수가 1개, 2개, 3개…로 늘어납니다. 35째가 몇 번째 묶음의 몇 번째인지 세어 보세요.","a":"2 (8번째 묶음의 7째 = 7/9)"},"158":{"h":"한 번 튀어 오를 때마다 그 분수만큼 곱합니다. 두 번 반복하세요.","a":"27 cm (147 → 63 → 27)"},"159":{"h":"튀어 오른 높이는 올라갈 때와 내려올 때 두 번 셉니다. 처음 떨어진 거리는 한 번만 셉니다.","a":"225 m (81 + 45 + 45 + 27 + 27)"},"160":{"h":"가운데 있는 멜론을 기준으로 삼습니다. 멜론 3통이 참외 몇 개인지 먼저 구하세요.","a":"12개 (멜론 3통 = 참외 4×3)"},"161":{"h":"자연수 부분이 4이면 분자에서 8을 네 번 덜어냈다는 뜻입니다. 남는 수는 분모보다 작아야 합니다.","a":"7개 (33/8 ~ 39/8)"},"162":{"h":"몫이 자연수 부분, 나머지가 분자가 됩니다.","a":"60과 5/9 (분자 545)"},"163":{"h":"합에서 차를 빼고 반으로 나누면 작은 쪽(분자)이 나옵니다.","a":"35/56"},"164":{"h":"가분수의 분자는 (분모 × 자연수 부분) + 분자입니다. ㉠에 수를 하나씩 넣어 확인하세요.","a":"8, 9 (104/13, 117/13)"},"165":{"h":"12분 동안 탄 부분이 전체의 몇 분의 몇인지 먼저 구합니다. 그다음 1묶음이 몇 분인지 구하세요.","a":"20분 (3/8이 12분 → 1/8은 4분)"},"166":{"h":"자연수 부분이 1인 것과 2인 것으로 나누어 세어 봅니다. 양 끝의 수는 넣지 않습니다.","a":"9개 (1과 4/9~1과 8/9, 2과 1/9~2과 4/9)"},"167":{"h":"차가 4이므로 분자는 분모보다 4 작습니다. 나머지 조건에 맞는지 확인하세요.","a":"8/12"},"168":{"h":"㉠에 들어갈 수와 ㉡에 들어갈 수를 각각 먼저 정리한 뒤, 서로 같은 경우만 빼면 됩니다.","a":"20개 (㉠ 4가지 × ㉡ 5가지)"},"169":{"h":"하루는 24시간입니다. 각각 몇 시간인지 구한 뒤 24에서 빼세요.","a":"7시간 (8+3+6=17)"},"170":{"h":"먼저 연필이 모두 몇 자루인지 구합니다. 그다음 각자 가진 자루 수를 구해 비교하세요.","a":"우현이가 7자루 더 많다 (21자루, 28자루)"},"171":{"h":"안경을 쓴 학생 수를 각각 구해 더한 뒤, 전체에서 빼세요.","a":"17명 (7명 + 4명 = 11명)"},"172":{"h":"먼저 걸린 시간을 분으로 구합니다. 버스를 탄 시간을 구해 빼거나, 걸은 몫이 전체의 몇 분의 몇인지 생각하세요.","a":"45분 (75분의 3/5)"},"173":{"h":"8묶음이 40이면 1묶음은 5입니다. A를 먼저 구한 뒤 같은 방법을 한 번 더 쓰세요.","a":"88개 (A 55개)"},"174":{"h":"10000은 9000보다 1000, 9900보다 100 더 큰 수입니다. 얼마나 떨어져 있는지 세어 보세요.","a":"(1) 10000  (2) 200  (3) 500"},"175":{"h":"만의 자리 4는 40000을, 백의 자리 5는 500을 나타냅니다.","a":"40000, 500"},"176":{"h":"만 앞에 붙은 수가 곧 10000의 개수입니다.","a":"(1) 360  (2) 2968  (3) 8700"},"177":{"h":"자리마다 0의 개수가 다릅니다. 천만의 자리는 0이 7개입니다.","a":"30000000, 2000000, 800000, 40000"},"178":{"h":"억은 0이 8개입니다. 뒤에서 0을 8개 끊어 보세요.","a":"71490개"},"179":{"h":"조는 0이 12개입니다. 뒤에서 0을 12개 끊어 보세요.","a":"3528개"},"180":{"h":"두 사람의 돈을 먼저 더한 뒤 10000에서 빼세요.","a":"2000원"},"181":{"h":"십의 자리처럼 없는 자리는 0으로 채웁니다.","a":"45802 · 사만 오천팔백이"},"182":{"h":"어느 자리가 달라졌는지 찾아 그 자리의 값만큼 더합니다.","a":"4000, 700, 80"},"183":{"h":"큰 단위부터 차례로 채웁니다. 34200에서 만의 자리, 천의 자리, 백의 자리를 보세요.","a":"10000원 3장, 1000원 4장, 100원 2개"},"184":{"h":"자리를 맞춰 세로로 더합니다.","a":"170000원"},"185":{"h":"일의 자리부터 네 자리씩 끊고, 왼쪽부터 만의 단위를 붙여 읽습니다.","a":"삼천백육십오만 오천십칠"},"186":{"h":"네 수를 모두 숫자로 쓴 뒤, 뒤에서 열한 번째 자리를 봅니다.","a":"㉢ (백억의 자리 4)"},"187":{"h":"억 자리와 만 자리를 따로 채운 뒤 빈 자리는 0으로 메웁니다.","a":"360001070000 · 삼천육백억 백칠만"},"188":{"h":"10배 하면 0이 하나, 1000배 하면 0이 세 개 늘어납니다.","a":"(1) 4억 7000만  (2) 650억"},"189":{"h":"먼저 10배 한 수를 씁니다. 그다음 6이 어느 자리에 있는지 봅니다.","a":"600억 (181조 650억)"},"190":{"h":"자리 수가 다르면 자리 수가 많은 쪽이 더 큽니다.","a":"&gt; (9자리 &gt; 8자리)"},"191":{"h":"자리 수가 같으면 높은 자리부터 차례로 비교합니다. 다른 숫자가 처음 나오는 자리에서 판가름납니다.","a":"(1) &lt;  (2) &gt;"},"192":{"h":"0°보다 크고 직각보다 작으면 예각, 직각보다 크고 180°보다 작으면 둔각입니다.","a":"예각 45°·89° / 직각 90° / 둔각 120°·175°"},"193":{"h":"겹치지 않게 이어 붙이면 두 각의 크기를 더합니다.","a":"75° (45+30)"},"194":{"h":"겹쳐 놓으면 두 각의 크기를 뺍니다.","a":"15° (60−45)"},"195":{"h":"일직선이 이루는 각은 180°입니다. 180에서 나머지 두 각을 빼세요.","a":"115° (180−40−25)"},"196":{"h":"삼각형의 세 각의 크기의 합은 180°입니다.","a":"85° (180−95)"},"197":{"h":"직각은 90°입니다. 세 각의 합 180°에서 두 각을 빼세요.","a":"55° (180−90−35)"},"198":{"h":"180°에서 50°를 뺀 나머지를 똑같이 둘로 나눕니다.","a":"65° (130÷2)"},"199":{"h":"사각형의 네 각의 크기의 합은 360°입니다.","a":"65° (360−295)"},"200":{"h":"삼각형 하나의 세 각의 합이 180°입니다. 삼각형이 몇 개로 나뉘는지 세어 보세요.","a":"540° (180×3)"},"201":{"h":"먼저 다섯 각의 크기의 합을 구한 뒤 다섯으로 나눕니다.","a":"108° (540÷5)"},"202":{"h":"시계 한 바퀴는 360°이고 숫자 눈금 사이는 30°입니다. 두 바늘 사이에 눈금이 몇 칸 있는지 세어 보세요.","a":"90° (30×3)"},"203":{"h":"먼저 작은 쪽 각도를 구한 뒤 360°에서 뺍니다.","a":"210° (360−150)"},"204":{"h":"30분이면 짧은바늘도 숫자 사이의 한가운데에 있습니다. 눈금 반 칸은 15°입니다.","a":"75° (눈금 2칸 반)"},"205":{"h":"각도의 합과 차도 수의 덧셈·뺄셈과 같은 방법으로 계산합니다.","a":"합 185° · 차 45°"},"206":{"h":"두 각을 먼저 구해 더한 뒤, 360°에서 빼고 남은 것을 둘로 나눕니다.","a":"각각 95° (70+100=170, 360−170=190, 190÷2)"},"207":{"h":"몇십의 0을 잠시 떼고 계산한 뒤, 떼어 둔 0을 곱에 다시 붙입니다.","a":"14000 (35×4=140에 0을 두 개)"},"208":{"h":"436×7과 436×20을 따로 구한 뒤 더합니다.","a":"11772 (3052 + 8720)"},"209":{"h":"한 상자의 개수 × 상자 수로 식을 세웁니다.","a":"4250개"},"210":{"h":"덧셈·뺄셈과 곱셈이 섞여 있으면 곱셈을 먼저 계산합니다.","a":"14 (40−26)"},"211":{"h":"곱셈을 먼저 하고 그 결과를 더합니다.","a":"790 (250+540)"},"212":{"h":"곱해지는 수가 정해져 있으므로 두 자리 수를 가장 크게 만들면 됩니다.","a":"54730 (842×65)"},"213":{"h":"298은 300에, 42는 40에 가깝습니다. 어림한 수끼리 곱해 봅니다.","a":"약 12000 (300×40)"},"214":{"h":"곱해지는 수와 곱하는 수에 0이 하나씩 늘면 곱에는 0이 두 개 늘어납니다.","a":"7800"},"215":{"h":"24÷3을 먼저 생각하면 몫을 빠르게 찾을 수 있습니다.","a":"8"},"216":{"h":"40씩 몇 번 덜어낼 수 있는지 봅니다. 나머지는 나누는 수보다 작아야 합니다.","a":"몫 6, 나머지 10"},"217":{"h":"26을 20쯤으로 어림해 몫을 짐작한 뒤 맞는지 확인합니다.","a":"몫 7, 나머지 13"},"218":{"h":"앞의 두 자리부터 나누어 봅니다. 72÷24로 십의 자리 몫을 먼저 정하세요.","a":"몫 30, 나머지 8"},"219":{"h":"나누는 수 × 몫 + 나머지 = 나누어지는 수입니다.","a":"281 (23×12+5)"},"220":{"h":"검산식을 거꾸로 세워 봅니다.","a":"397 (26×15+7)"},"221":{"h":"잘못한 식으로 어떤 수를 먼저 구합니다.","a":"8192 (어떤 수 256)"},"222":{"h":"나눗셈의 몫이 봉지 수, 나머지가 남는 구슬 수입니다.","a":"22봉지, 12개 남음"},"223":{"h":"200을 14씩 덜어냅니다. 남는 장수는 14보다 작아야 합니다.","a":"14명, 4장 남음"},"224":{"h":"나머지가 있으면 그 학생들도 타야 하므로 버스가 한 대 더 필요합니다.","a":"6대 (5대와 25명)"},"225":{"h":"먼저 감자가 모두 몇 개인지 구한 뒤 30씩 나눕니다.","a":"15상자 (450÷30)"},"226":{"h":"각각 계산해 비교합니다. 눈으로 어림만 하면 틀리기 쉽습니다.","a":"㉠ (10400 &gt; 10000)"},"227":{"h":"나누어지는 수와 나누는 수에 0이 하나씩 늘어도 몫은 변하지 않습니다.","a":"8"},"228":{"h":"몫을 크게 하려면 나누어지는 수는 가장 크게, 나누는 수는 가장 작게 만듭니다.","a":"몫 81, 나머지 3 (975÷12)"},"229":{"h":"밀기는 도형을 그대로 옮기는 것입니다.","a":"위치만 달라지고 모양과 크기는 그대로입니다"},"230":{"h":"여러 번 밀어도 밀기는 밀기입니다.","a":"모양과 크기는 그대로이고 위치만 달라집니다"},"231":{"h":"뒤집는 방향의 반대쪽이 어떻게 되는지 생각해 보세요.","a":"왼쪽과 오른쪽이 서로 바뀝니다"},"232":{"h":"위아래로 뒤집으면 위와 아래가 서로 자리를 바꿉니다.","a":"위쪽과 아래쪽이 서로 바뀝니다"},"233":{"h":"글자의 왼쪽과 오른쪽이 똑같이 생겼는지 봅니다.","a":"ㅁ, ㅍ"},"234":{"h":"글자의 위쪽과 아래쪽이 똑같이 생겼는지 봅니다.","a":"B, E, H"},"235":{"h":"종이를 거꾸로 뒤집어 본다고 생각하세요.","a":"H, X, Z"},"236":{"h":"90°씩 네 번이면 한 바퀴입니다.","a":"처음 도형과 같아집니다 (360°)"},"237":{"h":"한 바퀴는 360°입니다. 360에서 빼 보세요.","a":"90°"},"238":{"h":"시계 방향 270°와 같습니다. 반대 방향으로는 얼마인지 생각하세요.","a":"1번"},"239":{"h":"각 숫자를 거꾸로 돌린 모양을 생각하고, 순서도 반대가 됩니다.","a":"8501"},"240":{"h":"같은 방향으로 두 번 뒤집으면 어떻게 되는지 종이로 해 보세요.","a":"처음 도형과 같아집니다"},"241":{"h":"전체 크기를 칸 수로 나눕니다.","a":"20 kg"},"242":{"h":"한 칸의 크기 × 칸 수로 구합니다.","a":"18명"},"243":{"h":"가장 큰 수를 먼저 찾고, 네 수를 모두 더합니다.","a":"농구 · 40명"},"244":{"h":"전체에서 나머지 세 항목을 모두 뺍니다.","a":"11명"},"245":{"h":"큰 수를 작은 수로 나눕니다.","a":"3배"},"246":{"h":"46을 5씩 담으면 몇 칸이 필요한지 생각합니다. 남는 인원도 한 칸이 필요합니다.","a":"10칸"},"247":{"h":"두 값의 차를 구합니다.","a":"150 mm"},"248":{"h":"표는 정확한 수를, 그래프는 크기를 보여 줍니다.","a":"막대그래프 — 막대의 길이로 많고 적음을 한눈에 비교할 수 있기 때문"},"249":{"h":"왼쪽으로 한 칸 가면 1이 작아지고, 위로 한 칸 가면 1000이 작아집니다.","a":"1001씩 작아집니다"},"250":{"h":"같은 줄에서 이웃한 두 수를 빼 보세요.","a":"오른쪽 1씩 · 아래쪽 1000씩"},"251":{"h":"나누어지는 수와 나누는 수를 똑같이 10으로 나누어도 몫은 변하지 않습니다.","a":"4"},"252":{"h":"1의 개수가 늘어날 때 곱이 어떤 모양이 되는지 보세요.","a":"1234321"},"253":{"h":"두 수가 각각 1씩 커지고 합은 2씩 커집니다.","a":"30 + 32 = 62"},"254":{"h":"늘어나는 개수가 2개, 3개, 4개…로 하나씩 커집니다.","a":"15개"},"255":{"h":"다섯째에서 5개를 더 놓습니다.","a":"21개"},"256":{"h":"이웃한 두 수의 차를 먼저 구합니다.","a":"7014"},"257":{"h":"곱하는 수에 0이 하나 늘면 곱에도 0이 하나 늘어납니다.","a":"650"},"258":{"h":"앞의 수에 2를 계속 더합니다.","a":"64, 66, 68, 70, 72"}};

var PROG="suah-math-prog-v1", SET="suah-math-set-v1";
var UNITS=["곱셈","나눗셈","원","분수","들이와 무게","그림그래프","큰 수","각도","곱셈과 나눗셈","평면도형의 이동","막대그래프","규칙 찾기"];
var SEMS=["3-1학기","3-2학기","4-1학기","4-2학기"];
var SEED_SEM="3-2학기", PAGE=25;

var prog=jload(PROG,{}), cfg=jload(SET,{order:"seq",sync:false,code:""});
var filter="red", semPick="", unitPick="", shown=PAGE;
var rev={queue:[],i:0,got:0,again:0,perfect:0,done:{}}, detailId=null, detailRing=[], pushTimer=null, pulling=false;

function jload(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v==null?d:v }catch(e){ return d } }
function saveProg(){ try{ localStorage.setItem(PROG,JSON.stringify(prog)) }catch(e){} }
function saveCfg(){ localStorage.setItem(SET,JSON.stringify(cfg)) }
function $(id){ return document.getElementById(id) }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}) }
var tmr; function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tmr); tmr=setTimeout(function(){t.classList.remove("show")},1900) }
function fmt(ts){ var d=new Date(ts); return (d.getMonth()+1)+"월 "+d.getDate()+"일" }
function clock(ts){ var d=new Date(ts); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2) }
function show(id){ $(id).classList.remove("hidden"); document.body.style.overflow="hidden" }
function hide(id){ $(id).classList.add("hidden"); document.body.style.overflow="" }

/* 데이터 */
function lampOf(st,ag){ return st==="done"?"done":(st==="known"?"green":(ag>0?"again":"red")) }
var LAMP={red:{n:"틀렸어요",c:"w"},again:{n:"아직 모르겠어요",c:"ag"},green:{n:"이제는 알아요",c:"kn"},done:{n:"틀릴 리 없어요",c:"bk"}};
function items(){
  return SEED.map(function(s){
    var id="s"+s.n, p=prog[id]||{}, X=EXTRA[s.n]||{}, st=p.status||"wrong", ag=p.again||0;
    return {id:id,n:s.n,sem:s.m||SEED_SEM,unit:s.u,title:s.t,src:s.s,q:s.q,fig:!!s.g,hint:X.h||"",ans:X.a||"",
      status:st,again:ag,lamp:lampOf(st,ag),wrongCount:p.wrongCount||1,last:p.last||0,
      order:(UNITS.indexOf(s.u)+1)*100000+s.n};
  }).sort(function(a,b){ return a.order-b.order });
}
function byId(id){ var a=items(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null }
function setState(it,patch){
  var p=prog[it.id]||{}; for(var k in patch) p[k]=patch[k];
  p.last=Date.now(); prog[it.id]=p; saveProg(); schedulePush();
}

/* 동기화 */
function syncOn(){ return !!(cfg.sync && cfg.code) }
function schedulePush(){
  if(!syncOn()) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushNow,1500);
}
function pushNow(cb){
  if(!syncOn()) return cb&&cb();
  fetch("/api/sync?code="+encodeURIComponent(cfg.code),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(prog)})
    .then(function(r){ if(!r.ok) throw 0; cfg.at=Date.now(); saveCfg(); if($("syncWhen")) $("syncWhen").textContent="방금 "+clock(cfg.at); cb&&cb() })
    .catch(function(){ if($("syncMsg")) $("syncMsg").textContent="서버에 저장하지 못했습니다. 잠시 뒤 다시 시도합니다."; cb&&cb() });
}
function pullNow(cb){
  if(!syncOn()||pulling) return cb&&cb();
  pulling=true;
  fetch("/api/sync?code="+encodeURIComponent(cfg.code))
    .then(function(r){ if(!r.ok) throw 0; return r.json() })
    .then(function(j){
      var got=0;
      if(j&&j.data) for(var id in j.data){
        var r=j.data[id]||{}, l=prog[id];
        if(!l||(r.last||0)>(l.last||0)){ prog[id]=r; got++ }
      }
      if(got) saveProg();
      cfg.at=Date.now(); saveCfg(); pulling=false;
      if($("syncWhen")) $("syncWhen").textContent="방금 "+clock(cfg.at);
      renderHome(); cb&&cb(got);
    })
    .catch(function(){ pulling=false; if($("syncMsg")) $("syncMsg").textContent="서버에 연결하지 못했습니다. 코드와 인터넷 연결을 확인해 주세요."; cb&&cb(0) });
}
document.addEventListener("visibilitychange",function(){ if(!document.hidden) pullNow() });

/* 홈 */
function renderHome(){
  var a=items(),c={red:0,again:0,green:0,done:0};
  a.forEach(function(it){ c[it.lamp]++ });
  $("cw").textContent=c.red; $("ca").textContent=c.again; $("ck").textContent=c.green; $("cd").textContent=c.done;
  [["lampRed","red","lit-red"],["lampAgain","again","lit-again"],["lampGreen","green","lit-green"],["lampDone","done","lit-done"]].forEach(function(p){
    var el=$(p[0]); el.className="lamp "+(c[p[1]]?p[2]:"off");
    el.setAttribute("aria-pressed",filter===p[1]?"true":"false");
  });
  $("listTitle").textContent=filter==="all"?"전체 문제":LAMP[filter].n;
  $("allBtn").textContent=filter==="all"?"신호등으로 고르기":"전체 보기";
  $("printCnt").textContent=visible().length+"문제 중 고르기";
  $("syncBadge").textContent=syncOn()?"동기화 켜짐 · "+cfg.code:"동기화 · 백업";
  var q=queue().length;
  $("revCnt").textContent=q?q+"문제":"없음";
  $("btnReview").disabled=!q;

  var semUsed={},unitUsed={};
  a.forEach(function(it){
    semUsed[it.sem]=(semUsed[it.sem]||0)+1;
    if(semPick&&it.sem===semPick) unitUsed[it.unit]=(unitUsed[it.unit]||0)+1;
  });
  var sf=$("semFilter"); sf.innerHTML="";
  sf.appendChild(chip("전체 학기","",semPick==="",pickSem));
  SEMS.forEach(function(s){ if(semUsed[s]) sf.appendChild(chip(s+" ("+semUsed[s]+")",s,semPick===s,pickSem)) });
  var uf=$("unitFilter"); uf.innerHTML="";
  if(semPick){
    uf.appendChild(chip("단원 전체","",unitPick==="",pickUnit));
    UNITS.forEach(function(u){ if(unitUsed[u]) uf.appendChild(chip(u+" ("+unitUsed[u]+")",u,unitPick===u,pickUnit)) });
  }
  renderList();
}
function pickSem(v){ semPick=v; unitPick=""; shown=PAGE; renderHome() }
function pickUnit(v){ unitPick=v; shown=PAGE; renderHome() }
function chip(label,val,on,fn){
  var b=document.createElement("button"); b.textContent=label; b.setAttribute("aria-pressed",on?"true":"false");
  b.onclick=function(){ fn(val) }; return b;
}
function visible(){
  return items().filter(function(it){
    if(filter!=="all"&&it.lamp!==filter) return false;
    if(semPick&&it.sem!==semPick) return false;
    if(unitPick&&it.unit!==unitPick) return false;
    return true;
  });
}
function renderList(){
  var v=visible(), el=$("list");
  if(!v.length){ el.innerHTML='<div class="empty">여기에 해당하는 문제가 없습니다.</div>'; $("btnMore").classList.add("hidden"); return }
  el.innerHTML=v.slice(0,shown).map(function(it){
    return '<button class="item l-'+it.lamp+'" data-id="'+it.id+'" aria-label="'+LAMP[it.lamp].n+'"><span class="dot"></span>'+
      '<span class="meta"><span class="unit">'+esc(it.unit)+'</span>'+
      '<span class="note">'+esc(it.title)+'</span>'+
      '<span class="date">틀린 횟수 '+it.wrongCount+'회</span></span></button>';
  }).join("");
  Array.prototype.forEach.call(el.querySelectorAll(".item"),function(b){ b.onclick=function(){ openDetail(b.dataset.id) } });
  var more=$("btnMore");
  if(v.length>shown){ more.classList.remove("hidden"); more.textContent="더 보기 ("+(v.length-shown)+"문제 남음)" }
  else more.classList.add("hidden");
}
$("btnMore").onclick=function(){ shown+=PAGE; renderList() };

/* 다시 풀기 */
function queue(){
  var q=items().filter(function(it){ return (it.lamp==="red"||it.lamp==="again") && (!semPick||it.sem===semPick) && (!unitPick||it.unit===unitPick) });
  if(cfg.order==="shuffle"){ for(var i=q.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=q[i]; q[i]=q[j]; q[j]=t } }
  else q.sort(function(a,b){ return (b.lamp==="again")-(a.lamp==="again") || a.order-b.order });
  return q;
}
$("btnReview").onclick=function(){
  var q=queue(); if(!q.length) return toast("다시 풀 문제가 없습니다.");
  rev={queue:q.map(function(i){return i.id}),i:0,got:0,again:0,perfect:0,done:{}}; show("scReview"); renderRev();
};
$("revQuit").onclick=function(){ hide("scReview"); renderHome() };
function renderRev(){
  var n=rev.queue.length;
  if(rev.i>=n){
    $("revPos").textContent=""; $("revBar").style.width="100%";
    $("revBody").innerHTML='<div class="done"><div class="big-n kn">'+rev.got+'</div><p>문제를 이제는 알게 됐습니다.</p>'+
      '<p class="note">아직 모르겠는 문제 '+rev.again+'개는 다음에 다시 나옵니다.'+(rev.perfect?'<br>틀릴 리 없어요로 뺀 문제 '+rev.perfect+'개':'')+'</p><button class="big" id="revEnd" style="margin-top:20px;justify-content:center">끝내기</button></div>';
    $("revEnd").onclick=function(){ hide("scReview"); renderHome() }; return;
  }
  var it=byId(rev.queue[rev.i]); if(!it){ rev.i++; return renderRev() }
  $("revPos").textContent=(rev.i+1)+" / "+n;
  $("revBar").style.width=(rev.i/n*100)+"%";
  $("revBody").innerHTML='<div class="qwrap"><div class="qmeta"><span>'+esc(it.unit)+'</span>'+
    '<span class="'+LAMP[it.lamp].c+'">'+LAMP[it.lamp].n+'</span></div><div class="q">'+it.q+'</div></div>'+
    '<div class="reveal"><button id="rHint" aria-expanded="false">힌트 보기</button>'+
    '<button id="rAns" aria-expanded="false">답 보기</button></div>'+
    '<div id="rBoxHint" class="box-h hidden"><b>힌트</b>'+esc(it.hint)+'</div>'+
    '<div id="rBoxAns" class="box-a hidden"><b>답</b>'+esc(it.ans)+'</div>'+
    '<div class="nav"><button id="rPrev"'+(rev.i===0?" disabled":"")+'>← 이전 문제</button>'+
    '<button id="rNext">다음 문제 →</button></div>'+
    '<div class="judge"><button class="again">아직<br>모르겠어요</button><button class="got">이제는<br>알아요</button><button class="perfect">틀릴 리<br>없어요</button></div>';
  $("rHint").onclick=function(){ toggleBox(this,"rBoxHint","힌트") };
  $("rAns").onclick=function(){ toggleBox(this,"rBoxAns","답") };
  $("rPrev").onclick=function(){ if(rev.i>0){ rev.i--; renderRev() } };
  $("rNext").onclick=function(){ rev.i++; renderRev() };
  $("revBody").querySelector(".again").onclick=function(){ judge(it,"again") };
  $("revBody").querySelector(".got").onclick=function(){ judge(it,"known") };
  $("revBody").querySelector(".perfect").onclick=function(){ judge(it,"done") };
  window.scrollTo(0,0);
}
function judge(it,kind){
  var first=!rev.done[it.id];
  rev.done[it.id]=true;
  if(kind==="again"){ setState(it,{status:"wrong",again:it.again+1,wrongCount:it.wrongCount+1}); if(first) rev.again++ }
  else{ setState(it,{status:kind}); if(first){ rev.got++; if(kind==="done") rev.perfect++ } }
  rev.i++; renderRev();
}

/* 문제 카드 */
function toggleBox(btn,id,label){
  var box=$(id), open=box.classList.contains("hidden");
  box.classList.toggle("hidden",!open);
  btn.setAttribute("aria-expanded",open?"true":"false");
  btn.textContent=label+(open?" 숨기기":" 보기");
}
function openDetail(id){
  detailRing=visible().map(function(x){ return x.id });
  if(detailRing.indexOf(id)<0) detailRing=[id];
  detailId=id; renderDetail(); show("scDetail");
}
function renderDetail(){
  var it=byId(detailId); if(!it) return hide("scDetail");
  $("detTitle").textContent=it.unit;
  $("detBody").innerHTML=
    '<div class="qwrap"><div class="q">'+it.q+'</div></div>'+
    '<div class="reveal"><button id="btnHint" aria-expanded="false">힌트 보기</button>'+
    '<button id="btnAns" aria-expanded="false">답 보기</button></div>'+
    '<div id="boxHint" class="box-h hidden"><b>힌트</b>'+esc(it.hint)+'</div>'+
    '<div id="boxAns" class="box-a hidden"><b>답</b>'+esc(it.ans)+'</div>'+
    '<div class="row"><button id="dW" class="'+(it.lamp==="red"?"on-w":"")+'">틀렸어요</button>'+
    '<button id="dA" class="'+(it.lamp==="again"?"on-ag":"")+'">아직 모르겠어요</button>'+
    '<button id="dK" class="'+(it.lamp==="green"?"on-k":"")+'">이제는 알아요</button></div>'+
    '<div class="row solo"><button id="dD" class="'+(it.lamp==="done"?"on-bk":"")+'">'+
    (it.lamp==="done"?"틀릴 리 없어요 · 눌러서 되돌리기":"틀릴 리 없어요 (오답노트에서 빼기)")+'</button></div>'+
    '<div class="nav"><button id="dPrev">← 이전 문제</button><button id="dNext">다음 문제 →</button></div>'+
    '<div class="hist">'+esc(it.sem)+' · '+esc(it.unit)+'<br>틀린 횟수 '+it.wrongCount+'회'+
    (it.last?' · 마지막으로 푼 날 '+fmt(it.last):'')+'</div>';
  var at=detailRing.indexOf(it.id);
  $("detPos").textContent=at>=0?(at+1)+" / "+detailRing.length:"";
  $("dPrev").disabled=(at<=0);
  $("dNext").disabled=(at<0||at>=detailRing.length-1);
  $("dPrev").onclick=function(){ detailId=detailRing[at-1]; renderDetail(); window.scrollTo(0,0) };
  $("dNext").onclick=function(){ detailId=detailRing[at+1]; renderDetail(); window.scrollTo(0,0) };
  $("btnHint").onclick=function(){ toggleBox(this,"boxHint","힌트") };
  $("btnAns").onclick=function(){ toggleBox(this,"boxAns","답") };
  $("dW").onclick=function(){ setState(it,{status:"wrong",again:0}); renderDetail() };
  $("dA").onclick=function(){ setState(it,{status:"wrong",again:it.again||1}); renderDetail() };
  $("dK").onclick=function(){ setState(it,{status:"known"}); renderDetail() };
  $("dD").onclick=function(){ setState(it,{status:(it.lamp==="done"?"known":"done")}); renderDetail() };
}
$("detClose").onclick=function(){ hide("scDetail"); renderHome() };

/* 설정 */
$("btnSettings").onclick=function(){ renderSet(); show("scSet") };
function renderSet(){
  var st=$("syncToggle"); st.innerHTML="";
  [[true,"켜기"],[false,"끄기"]].forEach(function(p){
    var b=document.createElement("button"); b.textContent=p[1];
    b.setAttribute("aria-pressed",(!!cfg.sync)===p[0]?"true":"false");
    b.onclick=function(){
      if(p[0]&&!$("syncCode").value.trim()) return toast("동기화 코드를 먼저 넣어 주세요.");
      cfg.sync=p[0]; cfg.code=$("syncCode").value.trim(); saveCfg(); renderSet(); renderHome();
      if(p[0]) pullNow(function(){ pushNow(); toast("동기화를 켰습니다.") }); else toast("동기화를 껐습니다.");
    };
    st.appendChild(b);
  });
  $("syncCode").value=cfg.code||"";
  $("syncWhen").textContent=cfg.at?clock(cfg.at):"";
  var o=$("orderPick"); o.innerHTML="";
  [["seq","번호 순서대로"],["shuffle","섞어서"]].forEach(function(p){
    var b=document.createElement("button"); b.textContent=p[1];
    b.setAttribute("aria-pressed",(cfg.order||"seq")===p[0]?"true":"false");
    b.onclick=function(){ cfg.order=p[0]; saveCfg(); renderSet() }; o.appendChild(b);
  });
  var g=0,d=0,cnt=0; items().forEach(function(it){ if(it.lamp==="green") g++; if(it.lamp==="done") d++; if(it.last) cnt++ });
  $("statTxt").textContent="문제 "+SEED.length+"개 · 푼 기록 "+cnt+"개 · 이제는 알아요 "+g+"개 · 틀릴 리 없어요 "+d+"개";
}
$("syncCode").onchange=function(){ if(cfg.sync){ cfg.code=this.value.trim(); saveCfg(); renderHome() } };
$("syncNow").onclick=function(){
  if(!syncOn()) return toast("먼저 동기화를 켜 주세요.");
  $("syncMsg").textContent="동기화하는 중…";
  pullNow(function(){ pushNow(function(){ $("syncMsg").textContent="맞췄습니다. 두 기기의 기록이 같아졌습니다."; renderSet() }) });
};
$("setClose").onclick=function(){ hide("scSet"); renderHome() };
$("doExport").onclick=function(){
  var blob=new Blob([JSON.stringify({v:3,prog:prog})],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="CandysMath_"+new Date().toISOString().slice(0,10)+".json"; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href) },2000);
};
$("doImport").onclick=function(){ $("jsonPick").click() };
$("jsonPick").onchange=function(e){
  var f=e.target.files[0]; e.target.value=""; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result), src=d.prog||{}, got=0;
      for(var id in src){ var l=prog[id]; if(!l||((src[id].last||0)>(l.last||0))){ prog[id]=src[id]; got++ } }
      saveProg(); schedulePush(); renderSet(); renderHome(); toast(got+"개 기록을 합쳤습니다.");
    }catch(err){ toast("파일을 읽지 못했습니다.") }
  };
  r.readAsText(f);
};
$("wipe").onclick=function(){
  if(!confirm("푼 기록을 모두 지웁니다. 되돌릴 수 없습니다.")) return;
  prog={}; saveProg(); schedulePush(); hide("scSet"); renderHome(); toast("모두 지웠습니다.");
};


/* 인쇄 */
var sel={}, prCfg=jload("candymath-print",{per:4,ans:true});
$("btnPrint").onclick=function(){
  sel={}; visible().forEach(function(it){ sel[it.id]=true }); renderPrint(); show("scPrint");
};
$("prClose").onclick=function(){ hide("scPrint") };
function selCount(){ var n=0; for(var k in sel) if(sel[k]) n++; return n }
function renderPrint(){
  var v=visible();
  $("prPool").textContent="지금 목록의 "+v.length+"문제 중에서 고릅니다 (홈에서 신호등·단원을 바꾸면 목록이 달라집니다)";
  var q=$("prQuick"); q.innerHTML="";
  [["all","모두 선택"],["none","모두 해제"]].forEach(function(p){
    var b=document.createElement("button"); b.textContent=p[1];
    b.onclick=function(){ v.forEach(function(it){ sel[it.id]=(p[0]==="all") }); renderPrint() };
    q.appendChild(b);
  });
  var pp=$("prPer"); pp.innerHTML="";
  [[2,"2문제"],[4,"4문제"],[6,"6문제"]].forEach(function(p){
    var b=document.createElement("button"); b.textContent=p[1];
    b.setAttribute("aria-pressed",prCfg.per===p[0]?"true":"false");
    b.onclick=function(){ prCfg.per=p[0]; localStorage.setItem("candymath-print",JSON.stringify(prCfg)); renderPrint() };
    pp.appendChild(b);
  });
  var pa=$("prAns"); pa.innerHTML="";
  [[true,"마지막 장에 답지 넣기"],[false,"문제만"]].forEach(function(p){
    var b=document.createElement("button"); b.textContent=p[1];
    b.setAttribute("aria-pressed",(!!prCfg.ans)===p[0]?"true":"false");
    b.onclick=function(){ prCfg.ans=p[0]; localStorage.setItem("candymath-print",JSON.stringify(prCfg)); renderPrint() };
    pa.appendChild(b);
  });
  $("prList").innerHTML=v.map(function(it){
    return '<button class="pick l-'+it.lamp+'" data-id="'+it.id+'" aria-pressed="'+(sel[it.id]?"true":"false")+'">'+
      '<span class="chk">✓</span><span class="dot"></span>'+
      '<span class="meta"><span class="unit">'+esc(it.unit)+'</span><span class="note">'+esc(it.title)+'</span></span></button>';
  }).join("");
  Array.prototype.forEach.call($("prList").querySelectorAll(".pick"),function(b){
    b.onclick=function(){ sel[b.dataset.id]=!sel[b.dataset.id]; b.setAttribute("aria-pressed",sel[b.dataset.id]?"true":"false"); updateGo() };
  });
  updateGo();
}
function updateGo(){
  var n=selCount();
  $("prGo").textContent=n?n+"문제 인쇄하기":"문제를 골라 주세요";
  $("prGo").disabled=!n;
}
$("prGo").onclick=function(){
  var list=items().filter(function(it){ return sel[it.id] });
  if(!list.length) return;
  var gap={2:"62mm",4:"26mm",6:"11mm"}[prCfg.per]||"26mm";
  var d=new Date(), day=(d.getMonth()+1)+"월 "+d.getDate()+"일";
  var where=(semPick||"3-2학기")+(unitPick?" · "+unitPick:"");
  var html='<div class="p-head"><b>Candy\'s Math</b><span>'+esc(where)+' · '+list.length+'문제 · '+day+'</span></div>';
  html+=list.map(function(it,i){
    return '<div class="p-item"><div class="q"><span class="p-no">'+(i+1)+'.</span>'+it.q+
      '</div><div style="height:'+gap+'"></div></div>';
  }).join("");
  if(prCfg.ans){
    html+='<div class="p-ans"><div class="p-head"><b>답</b><span>'+esc(where)+' · '+day+'</span></div><ol>'+
      list.map(function(it){ return '<li>'+esc(it.ans)+'</li>' }).join("")+'</ol></div>';
  }
  $("printArea").innerHTML=html;
  setTimeout(function(){ window.print() },60);
};

Array.prototype.forEach.call(document.querySelectorAll(".lamp"),function(b){
  b.onclick=function(){ filter=b.dataset.f; shown=PAGE; renderHome() };
});
$("allBtn").onclick=function(){ filter=(filter==="all"?"red":"all"); shown=PAGE; renderHome() };

renderHome();
if(syncOn()) pullNow();
})();
</script>
</body>
</html>
