<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A41">
<title>박수아 영단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#ffffff;
  --bg:#EFF3F6;
  --ink:#1B2A41;
  --ink-soft:#61718A;
  --rule:#D9E1EA;
  --accent:#1E7A6B;
  --mark:#FFE28A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- 상단 ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--ink);color:#fff;
  padding:14px 16px 12px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.brand .count{font-size:13px;color:#9FB3C8}
.tools{display:flex;gap:8px;margin-top:11px}
#q{
  flex:1;min-width:0;border:0;border-radius:9px;
  padding:9px 12px;font-size:15px;background:#2C4160;color:#fff;
}
#q::placeholder{color:#8FA3BC}
#q:focus{outline:2px solid var(--mark);outline-offset:1px}
.iconbtn{
  border:0;background:#2C4160;color:#DCE7F2;border-radius:9px;
  padding:0 13px;font-size:14px;white-space:nowrap;
}
.iconbtn:focus-visible{outline:2px solid var(--mark)}
.iconbtn[hidden]{display:none}
.ico{display:grid;place-items:center;padding:0 11px}
.ico svg{width:21px;height:21px;display:block}
.iconbtn.rec{background:#C0392B;color:#fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid #40587A;background:transparent;color:#B9C9DC;
  border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#1B2A41;font-weight:600}

/* ---------- 목록 ---------- */
main{padding:12px 12px 90px;max-width:640px;margin:0 auto}
.entry{
  background:var(--paper);border-radius:12px;
  padding:13px 14px 14px;margin-bottom:9px;
  border:1px solid var(--rule);
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;
}
.entry.done{border-color:#BFDCD5;background:#F7FCFB}
.w{
  grid-column:1;
  font-family:"Newsreader",Georgia,serif;
  font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1.15;
}
.side{grid-column:2;grid-row:1 / span 3;display:flex;flex-direction:column;gap:6px;align-items:center}
.mini{
  border:1px solid var(--rule);background:#fff;border-radius:8px;
  width:38px;height:32px;display:grid;place-items:center;font-size:15px;color:var(--ink-soft);
}
.mini.on{background:var(--accent);border-color:var(--accent);color:#fff}
.m{grid-column:1;font-size:16px;color:var(--ink);margin-top:3px}
.s{grid-column:1;font-size:14.5px;color:var(--ink-soft);margin-top:6px;line-height:1.55}
.s mark{background:var(--mark);color:var(--ink);border-radius:3px;padding:0 2px;font-weight:600}
.src{grid-column:1;font-size:12px;color:#9AA8BC;margin-top:7px}
.hide .m,.hide .s{filter:blur(5px);opacity:.55}
.hide .m:active,.hide .s:active{filter:none;opacity:1}

.empty{
  background:var(--paper);border:1px dashed #C3D0DE;border-radius:12px;
  padding:26px 20px;text-align:center;color:var(--ink-soft);font-size:15px;line-height:1.7;
}

/* ---------- 카드 모드 ---------- */
#card{display:none;padding:16px 14px 100px;max-width:640px;margin:0 auto}
#card.on{display:block}
.flip{
  background:var(--paper);border:1px solid var(--rule);border-radius:16px;
  min-height:56vh;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:28px 22px;gap:14px;
}
.flip .fw{font-family:"Newsreader",Georgia,serif;font-size:42px;font-weight:600;line-height:1.1}
.flip .fm{font-size:21px}
.flip .fs{font-size:16px;color:var(--ink-soft);line-height:1.6}
.flip .fs mark{background:var(--mark);padding:0 2px;border-radius:3px;font-weight:600}
.veil{color:#B4C0CE;font-size:15px}
.nav{display:flex;gap:9px;margin-top:14px}
.nav button{
  flex:1;border:1px solid var(--rule);background:#fff;border-radius:11px;padding:13px;font-size:15px;
}
.nav .primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.pos{text-align:center;margin-top:12px;color:var(--ink-soft);font-size:13.5px}

/* ---------- 문장 도우미 ---------- */
#maker{display:none;padding:14px 12px 100px;max-width:640px;margin:0 auto}
#maker.on{display:block}
.mk-help{margin:0 2px 11px;font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.mk-in{display:flex;gap:8px;align-items:stretch}
#kin{
  flex:1;min-width:0;border:1px solid var(--rule);border-radius:11px;
  padding:11px 12px;font:inherit;font-size:16px;resize:none;background:var(--paper);color:var(--ink);
}
#kin:focus{outline:2px solid var(--accent);outline-offset:-1px}
.mk-in .iconbtn{background:var(--paper);border:1px solid var(--rule);color:var(--ink-soft)}
.mk-in .iconbtn.rec{background:#C0392B;border-color:#C0392B;color:#fff}
#mkGo{
  width:100%;margin-top:9px;border:0;border-radius:11px;
  background:var(--ink);color:#fff;padding:12px;font-size:15px;font-weight:600;
}
.cov{background:var(--paper);border:1px solid var(--rule);border-radius:11px;
     padding:12px 14px;margin-top:14px;font-size:16px;line-height:1.7}
.cov mark{background:var(--mark);border-radius:3px;padding:0 2px}
.cov .miss{color:#C0392B;font-weight:600;text-decoration:underline wavy #C0392B 1px}
.cov .lead{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:400}
.mk-count{margin:14px 2px 8px;font-size:13.5px;color:var(--ink-soft)}
.mk-none{background:var(--paper);border:1px dashed #C3D0DE;border-radius:11px;
         padding:22px 18px;margin-top:14px;text-align:center;color:var(--ink-soft);line-height:1.7}

/* ---------- 하단 바 ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--rule);
  display:flex;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
}
.bar button{
  flex:1;border:1px solid var(--rule);background:#fff;border-radius:10px;
  padding:11px 2px;font-size:13.5px;
}
.bar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
body.makemode .tools,body.makemode .chips{display:none}

/* ---------- 인쇄(A4) ---------- */
#print{display:none}
@page{size:A4 portrait;margin:16mm 14mm}
@media print{
  header,.bar,main,#card{display:none !important}
  body{background:#fff;font-size:10pt}
  #print{display:block}
  .ph{display:flex;justify-content:space-between;align-items:baseline;
      border-bottom:1.2pt solid #000;padding-bottom:5px;margin-bottom:9px}
  .ph h2{margin:0;font-size:14pt;font-weight:600;letter-spacing:-.02em}
  .ph span{font-size:9pt;color:#444}
  table{width:100%;border-collapse:collapse}
  thead{display:table-header-group}
  tr{page-break-inside:avoid}
  th,td{border-bottom:.5pt solid #999;padding:5px 4px;text-align:left;vertical-align:top}
  th{border-bottom:1pt solid #000;font-size:9pt;font-weight:600}
  .cn{width:7%;color:#666;font-size:9pt}
  .cw{width:20%;font-family:"Newsreader",Georgia,serif;font-size:11.5pt;font-weight:600}
  .cm{width:24%}
  .cs{width:49%;font-size:9.5pt;line-height:1.4}
  .cs mark{background:none;font-weight:700;text-decoration:underline}
  .chk{display:inline-block;width:9px;height:9px;border:.5pt solid #666;margin-right:5px;vertical-align:-1px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>박수아 영단어장</h1>
    <span class="count" id="count"></span>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="단어나 뜻으로 찾기" autocomplete="off">
    <button class="iconbtn ico" id="micBtn" hidden aria-label="음성으로 검색">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/>
        <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
        <path d="M12 17.5V21"/>
      </svg>
    </button>
    <button class="iconbtn ico" id="printBtn" aria-label="인쇄하기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 8.5V3h10v5.5"/>
        <path d="M7 18H5a2 2 0 0 1-2-2v-4.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2V16a2 2 0 0 1-2 2h-2"/>
        <rect x="7" y="14.5" width="10" height="6.5" rx="1"/>
      </svg>
    </button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="list"></main>

<section id="card">
  <div class="flip" id="flip"></div>
  <div class="nav">
    <button id="prev">이전</button>
    <button class="primary" id="reveal">뜻 보기</button>
    <button id="next">다음</button>
  </div>
  <div class="pos" id="pos"></div>
</section>

<section id="maker">
  <p class="mk-help">한국어로 말하거나 쓰면, 단어장에서 쓸 수 있는 단어를 찾아 줍니다. 문장은 직접 만들어 보세요.</p>
  <div class="mk-in">
    <textarea id="kin" rows="2" placeholder="예: 달팽이가 여름 내내 잠을 자요"></textarea>
    <button class="iconbtn ico" id="kmic" hidden aria-label="한국어 음성 입력">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/>
        <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
        <path d="M12 17.5V21"/>
      </svg>
    </button>
  </div>
  <button id="mkGo">단어 찾기</button>
  <div id="mkOut"></div>
</section>

<nav class="bar">
  <button id="mList" aria-pressed="true">목록</button>
  <button id="mCard" aria-pressed="false">카드</button>
  <button id="mMake" aria-pressed="false">문장</button>
  <button id="mHide" aria-pressed="false">뜻 가리기</button>
</nav>

<div id="print"></div>

/* ---------- 저장소 (localStorage, 실패 시 메모리) ---------- */
const store = (()=>{
  let ok=true; try{localStorage.setItem("_t","1");localStorage.removeItem("_t")}catch(e){ok=false}
  const mem={};
  return {
    get(k){ try{ return ok?localStorage.getItem(k):mem[k] }catch(e){ return mem[k] } },
    set(k,v){ try{ ok?localStorage.setItem(k,v):mem[k]=v }catch(e){ mem[k]=v } }
  };
})();
const key = d => d.id;

/* 저장 키를 고정 id로 바꾸면서, 예전 형식(단어 / 단어|뜻)으로 저장된
   체크 기록을 한 번만 자동으로 옮긴다. 이후 뜻을 수정해도 풀리지 않음. */
let learned = new Set(JSON.parse(store.get("learned")||"[]"));
(function migrate(){
  if(store.get("learned_v")==="3") return;
  const byWordMeaning={}, byWord={}, ids=new Set();
  WORDS.forEach(d=>{
    byWordMeaning[d.w+"|"+d.m]=d.id;
    (byWord[d.w]=byWord[d.w]||[]).push(d.id);
    ids.add(d.id);
  });
  const moved=new Set();
  learned.forEach(k=>{
    if(ids.has(k)) moved.add(k);
    else if(byWordMeaning[k]) moved.add(byWordMeaning[k]);
    else if(byWord[k]) byWord[k].forEach(id=>moved.add(id));
  });
  learned=moved;
  store.set("learned", JSON.stringify([...learned]));
  store.set("learned_v","3");
})();
const saveLearned = ()=> store.set("learned", JSON.stringify([...learned]));

/* ---------- 상태 ---------- */
const BOOKS = [...new Set(WORDS.map(d=>d.b).filter(Boolean))];
const FILTERS = [
  {id:"all",  label:"전체"},
  {id:"todo", label:"안 외운 것"},
  {id:"done", label:"외운 것"},
  ...(BOOKS.length>1 ? BOOKS.map(b=>({id:"B:"+b, label:b})) : [])
];
let filter="all", query="", hide=false, mode="list", ci=0, revealed=false;

const esc = t => t.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mark = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<mark>$1</mark>");
const plain = t => t.replace(/\*\*/g,"");

function visible(){
  const q = query.trim().toLowerCase();
  return WORDS.filter((d,i)=>{
    if(filter==="done" && !learned.has(key(d))) return false;
    if(filter==="todo" &&  learned.has(key(d))) return false;
    if(filter.startsWith("B:") && d.b!==filter.slice(2)) return false;
    if(!q) return true;
    return (d.w+" "+d.m+" "+d.s).toLowerCase().includes(q);
  });
}

/* ---------- 목록 ---------- */
function renderList(){
  const rows = visible();
  const el = document.getElementById("list");
  document.getElementById("count").textContent = `${WORDS.length}단어 · 외움 ${learned.size}`;

  if(!rows.length){
    el.innerHTML = `<div class="empty">${WORDS.length ? "찾는 단어가 없어요." :
      "아직 단어가 없어요.<br>교재 페이지를 사진으로 찍어 올리면<br>여기에 하나씩 쌓입니다."}</div>`;
    return;
  }
  el.innerHTML = rows.map(d=>{
    const on = learned.has(key(d));
    return `<article class="entry ${on?"done":""} ${hide?"hide":""}">
      <div class="w">${esc(d.w)}</div>
      <div class="m">${esc(d.m)}</div>
      <div class="s">${mark(d.s)}</div>
      
      <div class="side">
        <button class="mini ${on?"on":""}" data-done="${esc(key(d))}"
                aria-label="${on?"외움 해제":"외움 표시"}">✓</button>
        <button class="mini" data-say="${esc(d.w)}" aria-label="발음 듣기">🔊</button>
      </div>
    </article>`;
  }).join("");
}

/* ---------- 카드 ---------- */
function renderCard(){
  const rows = visible();
  const flip = document.getElementById("flip");
  if(!rows.length){ flip.innerHTML=`<div class="veil">보여줄 단어가 없어요.</div>`;
                    document.getElementById("pos").textContent=""; return; }
  if(ci>=rows.length) ci=0;
  const d = rows[ci];
  flip.innerHTML = `<div class="fw">${esc(d.w)}</div>` + (revealed
    ? `<div class="fm">${esc(d.m)}</div><div class="fs">${mark(d.s)}</div>`
    : `<div class="veil">카드를 누르면 뜻이 보여요</div>`);
  document.getElementById("pos").textContent = `${ci+1} / ${rows.length}`;
  document.getElementById("reveal").textContent = revealed ? "뜻 숨기기" : "뜻 보기";
}

    </tr>`).join("")}
    </tbody></table>`;
}

function render(){
  document.getElementById("list").style.display = mode==="list" ? "" : "none";
  document.getElementById("card").classList.toggle("on", mode==="card");
  document.getElementById("maker").classList.toggle("on", mode==="make");
  document.body.classList.toggle("makemode", mode==="make");

  else if(mode==="card") renderCard();

/* ---------- 음성 입력 (검색: 영어 / 문장 도우미: 한국어) ---------- */
function setupVoice(btn, lang, onText){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR || !btn) return;
  btn.hidden = false;

  const rec = new SR();
  rec.lang = lang;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let on = false;
  const stop = ()=>{ on=false; btn.classList.remove("rec"); };

  btn.addEventListener("click", ()=>{
    if(on){ rec.stop(); stop(); return; }
    try{ rec.start(); on=true; btn.classList.add("rec"); }
    catch(e){ stop(); }
  });
  rec.addEventListener("result", e=>{
    let t=""; for(const r of e.results) t += r[0].transcript;
    onText(t.replace(/[.,!?]$/,"").trim());
  });
  rec.addEventListener("end", stop);
  rec.addEventListener("error", ev=>{
    stop();
    if(ev.error==="not-allowed")
      alert("마이크 사용이 차단되어 있어요.\n설정 → Safari → 마이크에서 허용해 주세요.");
  });
}

setupVoice(document.getElementById("micBtn"), "en-US", t=>{
  const q=document.getElementById("q");
  q.value=t; query=t; ci=0; render();
});
setupVoice(document.getElementById("kmic"), "ko-KR", t=>{
  document.getElementById("kin").value=t; renderMaker();
});

/* ---------- 문장 도우미 ----------
   한국어 문장에서 단어장에 있는 단어를 찾아 준다.
   조사·어미가 붙어도 걸리도록 뜻에서 어간을 뽑아 대조한다. */

// 뜻 문자열에서 검색용 낱말들을 뽑아낸다: "~를 살펴보다" → ["살펴보다"]
function korTerms(m){
  return m.replace(/[（(][^)）]*[)）]/g,"")   // 괄호 설명 제거
          .replace(/—.*$/,"")                 // 대시 뒤 부연 제거
          .split(/[,、/·]/)
          .map(t=>t.replace(/~[를을이가에서의로]?/g," ").replace(/\s+/g," ").trim())
          .filter(t=>/[가-힣]/.test(t));
}

// 과거형 축약: 그리다→그렸, 자다→잤, 보다→봤
function contracted(stem){
  if(!stem) return null;
  const c=stem.charCodeAt(stem.length-1)-0xAC00;
  if(c<0||c>11171||c%28!==0) return null;      // 받침 있으면 축약 안 일어남
  const jung=Math.floor(c/28)%21, cho=Math.floor(c/28/21);
  const map={0:0,1:1,4:4,5:5,8:9,13:14,20:6};   // ㅏㅐㅓㅔ 그대로 / ㅗ→ㅘ / ㅜ→ㅝ / ㅣ→ㅕ
  if(!(jung in map)) return null;
  const ch=0xAC00+((cho*21+map[jung])*28)+20;   // 받침 ㅆ
  return stem.slice(0,-1)+String.fromCharCode(ch);
}

// 한 낱말이 문장에 나타나는지 볼 때 쓸 형태들. [형태, 한글자허용]
function korForms(term){
  const out=new Map();
  const push=(f,short)=>{ if(f && (f.length>=2 || short)) out.set(f, out.get(f)||short); };
  const derive=(t,short)=>{
    push(t,short);
    const v=t.match(/^(.+)다$/);                 // 동사·형용사 어간
    if(v){
      const one = short && v[1].length===1;
      push(v[1], one);
      push(contracted(v[1]), one);               // 과거형
    }
    const a=t.match(/^(.+?)(한|인|은|는|던|운|나|린)$/); // 관형형·불규칙
    if(a && a[1].length>=2) push(a[1],false);
  };
  derive(term,true);
  // 뜻이 여러 낱말이면 각 낱말도 따로 본다 ("천둥번개를 동반한 비" → "천둥번개")
  if(/\s/.test(term)){
    term.split(/\s+/).forEach(tk=>{
      derive(tk.replace(/[를을이가은는의에서로와과]$/,""), false);
    });
  }
  return [...out.entries()];
}

const ENDINGS="요|아|어|았|었|는|은|을|를|ㄹ|고|지|기|니|나|면|자|ㅁ|음|와|워|여|해|이|가|도|만|에";

function findWords(input){
  const text=input.trim();
  if(!text) return {hits:[],ranges:[]};
  const low=text.toLowerCase();
  const hits=[], ranges=[];

  WORDS.forEach(d=>{
    let best=null;

    // 영어 단어를 그대로 쓴 경우
    const ew=d.w.toLowerCase();
    const ei=low.indexOf(ew);
    if(ei>=0) best={i:ei,len:ew.length,via:d.w};

    korTerms(d.m).forEach(term=>{
      korForms(term).forEach(([f,short])=>{
        if(f.length>=2){
          const i=text.indexOf(f);
          if(i>=0 && (!best||f.length>best.len)) best={i,len:f.length,via:f};
        }else if(short){
          // 어간이 한 글자면 어미가 붙은 형태일 때만 인정 ("자"+"요")
          const re=new RegExp(f+"("+ENDINGS+")");
          const m2=re.exec(text);
          if(m2 && (!best||best.len<2)) best={i:m2.index,len:m2[0].length,via:m2[0]};
        }
      });
    });

    if(best){ hits.push({d,...best}); ranges.push([best.i,best.i+best.len]); }
  });

  hits.sort((a,b)=>a.i-b.i);
  return {hits,ranges};
}

// 찾은 부분은 노란색, 못 찾은 부분은 빨간색으로 보여 준다
function coverage(text,ranges){
  if(!text.trim()) return "";
  const merged=[];
  ranges.slice().sort((a,b)=>a[0]-b[0]).forEach(r=>{
    const last=merged[merged.length-1];
    if(last && r[0]<=last[1]) last[1]=Math.max(last[1],r[1]);
    else merged.push(r.slice());
  });
  let out="",p=0;
  merged.forEach(([s,e])=>{
    if(s>p) out+=missSpan(text.slice(p,s));
    out+="<mark>"+esc(text.slice(s,e))+"</mark>";
    p=e;
  });
  if(p<text.length) out+=missSpan(text.slice(p));
  return out;
}
// 조사·공백처럼 굳이 표시할 필요 없는 부분은 그냥 두고, 낱말만 빨갛게
function missSpan(chunk){
  return chunk.split(/(\s+)/).map(part=>{
    if(!part.trim()) return esc(part);
    return /[가-힣a-zA-Z]{2,}/.test(part)
      ? '<span class="miss">'+esc(part)+"</span>" : esc(part);
  }).join("");
}

function renderMaker(){
  const text=document.getElementById("kin").value;
  const out=document.getElementById("mkOut");
  if(!text.trim()){ out.innerHTML=""; return; }

  const {hits,ranges}=findWords(text);
  let html=`<div class="cov"><span class="lead">노란색은 단어장에 있는 말, 빨간색은 아직 없는 말이에요.</span>${coverage(text,ranges)}</div>`;

  if(!hits.length){
    html+=`<div class="mk-none">이 문장에 쓸 만한 단어가 아직 단어장에 없어요.<br>더 쉬운 말로 바꿔서 다시 해 보세요.</div>`;
  }else{
    html+=`<p class="mk-count">쓸 수 있는 단어 ${hits.length}개</p>`;
    html+=hits.map(({d})=>`<article class="entry">
      <div class="w">${esc(d.w)}</div>
      <div class="m">${esc(d.m)}</div>
      <div class="s">${mark(d.s)}</div>
      <div class="side">
        <button class="mini" data-say="${esc(d.w)}" aria-label="발음 듣기">🔊</button>
      </div>
    </article>`).join("");
  }
  out.innerHTML=html;
}

document.getElementById("mkGo").addEventListener("click", renderMaker);
document.getElementById("kin").addEventListener("input", renderMaker);
document.getElementById("mkOut").addEventListener("click", e=>{
  const sy=e.target.closest("[data-say]"); if(sy) say(sy.dataset.say);
});

document.getElementById("printBtn").addEventListener("click", ()=>{ renderPrint(); window.print(); });
window.addEventListener("beforeprint", renderPrint);

render();
</script>
