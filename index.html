<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2a4d">
<link rel="apple-touch-icon" href="icon.png">
<title>Candy’s Voca — 새 주소로 이동</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,system-ui,sans-serif;
    background:linear-gradient(180deg,#dff4ff,#f4f7ff);color:#1f2a4d;text-align:center;padding:24px}
  a{color:#3b5bdb;font-weight:700}
</style>
<script>
/* 단어장은 suahstudy.vercel.app/voca 로 옮겼다.
   이 기기에 저장된 기록(외움 표시 등)을 들고 새 주소로 넘어간다. */
(function(){
  var d={};
  try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); d[k]=localStorage.getItem(k) } }catch(e){}
  location.replace("https://suahstudy.vercel.app/voca/#mig="+encodeURIComponent(JSON.stringify(d)));
})();
</script>
</head>
<body>
<div>
  <p>Candy’s Voca가 새 주소로 이사했어요.</p>
  <p><a href="https://suahstudy.vercel.app/voca/">suahstudy.vercel.app/voca</a></p>
</div>
</body>
</html>
