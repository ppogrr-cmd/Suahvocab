<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A41">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Candy’s Voca">
<title>Candy’s Voca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#ffffff;
  --bg:#EFF3F6;
  --ink:#1B2A41;
  --ink-soft:#61718A;
  --rule:#D9E1EA;
  --accent:#1E7A6B;
  --mark:#FFE28A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}

/* 화면 골격 — 하단 메뉴는 항상 화면 맨 아래 같은 자리에 고정.
   내용만 가운데 영역에서 스크롤되므로 탭을 옮겨도 메뉴가 움직이지 않는다. */
html{height:100%}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#scrollArea{flex:1 1 auto;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- 상단 ---------- */
header{
  flex:0 0 auto;z-index:20;
  background:var(--ink);color:#fff;
  padding:14px 16px 12px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.brand .count{font-size:13px;color:#9FB3C8}
.tools{display:flex;gap:8px;margin-top:11px}
#q{
  flex:1;min-width:0;border:0;border-radius:9px;
  padding:9px 12px;font-size:15px;background:#2C4160;color:#fff;
}
#q::placeholder{color:#8FA3BC}
#q:focus{outline:2px solid var(--mark);outline-offset:1px}
.iconbtn{
  border:0;background:#2C4160;color:#DCE7F2;border-radius:9px;
  padding:0 13px;font-size:14px;white-space:nowrap;
}
.iconbtn:focus-visible{outline:2px solid var(--mark)}
.iconbtn[hidden]{display:none}
.ico{display:grid;place-items:center;padding:0 11px}
.ico svg{width:21px;height:21px;display:block}
.iconbtn.rec{background:#C0392B;color:#fff;animation:pulse 1.1s ease-in-out infinite}
.iconbtn[aria-pressed="true"]{background:var(--mark);color:#1B2A41}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
#chips{flex-wrap:wrap;overflow:visible;row-gap:6px}
.subchips{margin-top:7px;padding-left:2px}
.subchips .chip{font-size:12.5px;padding:4px 11px}
.chip .ar{font-size:10px;opacity:.75;margin-left:1px}
.chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid #40587A;background:transparent;color:#B9C9DC;
  border-radius:999px;padding:5px 10px 5px 9px;font-size:12.5px;white-space:nowrap;
}
.chip svg{width:14px;height:14px;display:block;flex:none}
.chip[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#1B2A41;font-weight:600}

/* ---------- 목록 ---------- */
main{padding:12px 12px 26px;max-width:640px;margin:0 auto}
.entry{
  background:var(--paper);border-radius:12px;
  padding:13px 14px 14px;margin-bottom:9px;
  border:1px solid var(--rule);
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;
}
.entry.done{border-color:#BFDCD5;background:#F7FCFB}
.entry.spoken{border-color:#8FCBB9;background:#F1FAF7}
.w{
  grid-column:1;
  font-family:"Newsreader",Georgia,serif;
  font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1.15;
}
.side{grid-column:2;grid-row:1 / span 3;display:flex;flex-direction:column;gap:6px;align-items:center}
.mini{
  border:1px solid var(--rule);background:#fff;border-radius:8px;
  width:38px;height:32px;display:grid;place-items:center;font-size:15px;color:var(--ink-soft);
}
.mini.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mini.on.s3{background:#0E5B4E;border-color:#0E5B4E}
.mini svg{width:17px;height:17px;display:block}
.m{grid-column:1;font-size:16px;color:var(--ink);margin-top:3px}
.s{grid-column:1;font-size:14.5px;color:var(--ink-soft);margin-top:6px;line-height:1.55}
.s mark{background:var(--mark);color:var(--ink);border-radius:3px;padding:0 2px;font-weight:600}
.src{grid-column:1;font-size:12px;color:#9AA8BC;margin-top:7px}
.hide .m,.hide .s{filter:blur(5px);opacity:.55}
.hide .m:active,.hide .s:active{filter:none;opacity:1}

.empty{
  background:var(--paper);border:1px dashed #C3D0DE;border-radius:12px;
  padding:26px 20px;text-align:center;color:var(--ink-soft);font-size:15px;line-height:1.7;
}

/* ---------- 카드 모드 ---------- */
#card{display:none;padding:16px 14px 26px;max-width:640px;margin:0 auto}
#card.on{display:block}
.flip{
  background:var(--paper);border:1px solid var(--rule);border-radius:16px;
  min-height:56vh;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:28px 22px;gap:14px;
}
.flip .sp{
  -webkit-appearance:none;appearance:none;background:none;border:0;color:inherit;font:inherit;
  width:100%;display:block;padding:6px 4px;border-radius:12px;cursor:pointer;text-align:center;
}
.flip .sp:active{background:#EFF4F7}
.flip .sp:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.spk{display:inline-grid;place-items:center;vertical-align:middle;margin-left:8px;color:#A9B6C6}
.spk svg{width:17px;height:17px;display:block}
.flip .fw .spk svg{width:23px;height:23px}
.flip .fw{font-family:"Newsreader",Georgia,serif;font-size:42px;font-weight:600;line-height:1.1}
.flip .fm{font-size:21px}
.flip .fs{font-size:16px;color:var(--ink-soft);line-height:1.6}
.flip .fs mark{background:var(--mark);padding:0 2px;border-radius:3px;font-weight:600}
.veil{color:#B4C0CE;font-size:15px}
.nav{display:flex;gap:9px;margin-top:14px}
.nav button{
  flex:1;border:1px solid var(--rule);background:#fff;border-radius:11px;padding:13px;font-size:15px;
}
.nav .primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.pos{text-align:center;margin-top:12px;color:var(--ink-soft);font-size:13.5px}

/* ---------- 문장 도우미 ---------- */
#maker{display:none;padding:14px 12px 26px;max-width:640px;margin:0 auto}
#maker.on{display:block}
.mk-help{margin:0 2px 11px;font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.mk-in{display:flex;gap:8px;align-items:stretch}
#kin{
  flex:1;min-width:0;border:1px solid var(--rule);border-radius:11px;
  padding:11px 12px;font:inherit;font-size:16px;resize:none;background:var(--paper);color:var(--ink);
}
#kin:focus{outline:2px solid var(--accent);outline-offset:-1px}
.mk-in .iconbtn{background:var(--paper);border:1px solid var(--rule);color:var(--ink-soft)}
.mk-in .iconbtn.rec{background:#C0392B;border-color:#C0392B;color:#fff}
#mkGo{
  width:100%;margin-top:9px;border:0;border-radius:11px;
  background:var(--ink);color:#fff;padding:12px;font-size:15px;font-weight:600;
}
.cov{background:var(--paper);border:1px solid var(--rule);border-radius:11px;
     padding:12px 14px;margin-top:14px;font-size:16px;line-height:1.7}
.cov mark{background:var(--mark);border-radius:3px;padding:0 2px}
.cov .miss{color:#C0392B;font-weight:600;text-decoration:underline wavy #C0392B 1px}
.cov .lead{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:400}
.mk-count{margin:14px 2px 8px;font-size:13.5px;color:var(--ink-soft)}
.mk-none{background:var(--paper);border:1px dashed #C3D0DE;border-radius:11px;
         padding:22px 18px;margin-top:14px;text-align:center;color:var(--ink-soft);line-height:1.7}

.backup{margin-top:14px;background:var(--paper);border:1px solid var(--rule);
  border-radius:12px;padding:13px 14px}
.backup h4{margin:0 0 4px;font-size:14.5px}
.backup p{margin:0 0 10px;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.backup .bt{display:flex;gap:8px}
.backup .bt button{flex:1;border:1px solid var(--rule);background:#fff;border-radius:9px;
  padding:9px;font-size:13.5px;cursor:pointer}
.backup .bt button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.backup textarea{width:100%;margin-top:9px;border:1px solid var(--rule);border-radius:9px;
  padding:9px;font-size:11px;font-family:ui-monospace,monospace;height:74px;resize:none;
  color:var(--ink);background:#F7FAFC}

#settings{display:none;padding:14px 12px 26px;max-width:640px;margin:0 auto}
#settings.on{display:block}
.info{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:4px 14px;margin-bottom:12px}
.info div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--rule);font-size:14px}
.info div:last-child{border-bottom:0}
.info span{color:var(--ink-soft)}
.info b{font-weight:600;font-variant-numeric:tabular-nums}
.info .fold{cursor:pointer}
.info .fold .ar{font-style:normal;color:var(--ink-soft);font-size:11px;margin-left:2px}
.info .sub{padding:8px 0 8px 12px;font-size:13px;color:var(--ink-soft);border-bottom:1px solid var(--rule)}
.info .sub b{color:var(--ink);font-weight:500}

/* ---------- 하단 바 ---------- */
.bar{
  flex:0 0 auto;width:100%;z-index:20;
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--rule);
  display:flex;gap:5px;padding:5px 9px calc(2px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
}
.bar button{
  flex:1;border:1px solid var(--rule);background:#fff;border-radius:10px;
  padding:8px 0;font-size:11.5px;letter-spacing:-.03em;
}
.bar .dot{margin-left:2px}
.bar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
body.makemode .tools,body.makemode .chips{display:none}

/* ---------- 교재 몰아보기 ---------- */
#reader{display:none;padding:14px 12px 26px;max-width:640px;margin:0 auto}
#reader.on{display:block}
.rd-key{display:flex;flex-wrap:wrap;align-items:center;gap:5px 14px;
  font-size:12px;color:var(--ink-soft);margin:0 3px 12px}
.rd-key i{display:inline-block;width:11px;height:11px;border-radius:3px;
  margin-right:5px;vertical-align:-1px}
.rd-key .y{background:var(--mark)}
.rd-key .g{background:#CDEBD8}
.rd-books{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.rd-sub{margin-bottom:12px;padding-left:2px}
.rd-sub button{font-size:12px;padding:6px 11px}
.rd-books button{border:1px solid var(--rule);background:#fff;border-radius:999px;
  padding:7px 13px;font-size:12.5px;color:var(--ink)}
.rd-books button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rd-les{border:1px solid var(--rule);border-radius:13px;background:#fff;margin:0 0 10px;overflow:hidden}
.rd-hd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:0;background:#fff;padding:13px 14px;font-size:14.5px;color:var(--ink)}
.rd-hd b{font-weight:700}
.rd-hd .pg{margin-left:auto;font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
.rd-hd .ar{font-size:11px;color:var(--ink-soft);margin-left:2px}
.rd-body{border-top:1px solid var(--rule);padding:12px 14px 14px}
.rd-s{font-size:15.5px;line-height:1.8;margin:0 0 3px;letter-spacing:-.01em}
.rd-s .hl{background:var(--mark);border-radius:4px;padding:0 2px;font-weight:600;cursor:pointer}
.rd-s .hl.done{background:#CDEBD8}
.rd-tip{display:inline-block;margin:3px 0 7px;font-size:12.5px;
  background:var(--ink);color:#fff;border-radius:8px;padding:5px 10px}
.rd-tip .en{opacity:.7;margin-right:6px}
.rd-play{border:1px solid var(--rule);background:#fff;border-radius:9px;
  padding:6px 11px;font-size:12px;color:var(--ink);margin:10px 0 0}
.rd-empty{font-size:13px;color:var(--ink-soft);padding:20px 4px}
body.makemode .tools{display:none}

/* ---------- 오늘 · 퀴즈 · 말하기 ---------- */
#today,#quiz,#speak{display:none;padding:14px 12px 26px;max-width:640px;margin:0 auto}
#today.on,#quiz.on,#speak.on{display:block}

.tcard{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px;margin-bottom:11px}
.tcard h3{margin:0 0 11px;font-size:14px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.tcard h3 .stamp{font-style:normal;font-size:11.5px;background:var(--accent);color:#fff;
  border-radius:999px;padding:2px 9px;font-weight:600}

.miss3{display:flex;gap:7px}
.ms{flex:1;border:1px solid var(--rule);border-radius:11px;padding:11px 5px;text-align:center;background:#fff}
.ms.ok{background:#EAF7F2;border-color:#9FD4C4}
.ms .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.ms .n span{font-size:12px;font-weight:500;color:var(--ink-soft)}
.ms .lb{font-size:11.5px;color:var(--ink-soft);margin-top:3px}

.streak{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:12.5px;color:var(--ink-soft)}
.streak b{font-size:14px;color:var(--ink)}
.streak .wk{display:flex;gap:4px;margin-left:auto}
.streak .wk i{width:11px;height:11px;border-radius:50%;background:#DDE5EC;display:block}
.streak .wk i.on{background:var(--accent)}

.go3{display:flex;gap:7px;margin-top:13px}
.go3 button{flex:1;border:1px solid var(--rule);background:#fff;color:var(--ink);
  border-radius:10px;padding:11px 3px;font-size:12.5px;font-weight:600;letter-spacing:-.04em}
.go3 button:first-child{background:var(--ink);color:#fff;border-color:var(--ink)}

.ptot{font-size:13.5px;color:var(--ink-soft);margin-bottom:8px}
.ptot b{color:var(--ink);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.pbar{position:relative;height:9px;border-radius:99px;background:#E3EAF0;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.pbar i.k{background:#9FD4C4}
.pbar i.s{background:var(--accent)}
.plegend{display:flex;flex-wrap:wrap;gap:4px 13px;margin-top:8px;font-size:11.5px;color:var(--ink-soft)}
.plegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.plegend .lk{background:#9FD4C4}
.plegend .ls{background:var(--accent)}
.fold2{width:100%;margin-top:11px;border:1px solid var(--rule);background:#fff;
  border-radius:9px;padding:9px;font-size:12.5px;color:var(--ink-soft)}
.fold2 i{font-style:normal;margin-left:3px}
.prow{display:grid;grid-template-columns:1fr auto;gap:3px 8px;margin-top:12px;font-size:12.5px}
.prow b{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-weight:600}
.prow .pbar{grid-column:1 / -1}
.slist{margin-top:4px;font-size:13.5px;line-height:1.65;color:var(--ink-soft)}
.slist p{margin:0 0 7px}
.slist p b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;margin-right:7px}

/* 연습 하위 메뉴 */
.pracnav{display:flex;gap:6px;padding:12px 12px 0;max-width:640px;margin:0 auto}
.pracnav[hidden]{display:none}
.pracnav button{flex:1;border:1px solid var(--rule);background:#fff;border-radius:9px;
  padding:8px 0;font-size:12.5px;color:var(--ink)}
.pracnav button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}

/* 퀴즈 */
.qtop{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-soft);margin:0 2px 10px}
.qtop .qbar{flex:1;height:6px;border-radius:99px;background:#E3EAF0;overflow:hidden}
.qtop .qbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.qask{background:var(--paper);border:1px solid var(--rule);border-radius:14px;
  padding:24px 18px;text-align:center;min-height:132px;display:flex;flex-direction:column;
  justify-content:center;gap:11px}
.qask .qs{font-size:12.5px;color:var(--ink-soft)}
.qask .qq{font-family:"Newsreader",Georgia,serif;font-size:34px;font-weight:600;line-height:1.2;word-break:break-word}
.qask .qq.ko{font-family:inherit;font-size:23px;font-weight:600}
.qask .qq.sm{font-family:inherit;font-size:16.5px;font-weight:500;line-height:1.65}
.qask .qq.sm u{text-decoration:none;background:var(--mark);border-radius:3px;padding:0 7px;font-weight:700}
.qask .qplay{border:1px solid var(--rule);background:#fff;border-radius:999px;
  padding:13px 20px;font-size:14px;color:var(--ink);align-self:center;display:inline-flex;align-items:center;gap:8px}
.qask .qplay svg{width:20px;height:20px}
.qopts{display:grid;gap:8px;margin-top:12px}
.qopts button{border:1px solid var(--rule);background:#fff;border-radius:11px;
  padding:13px 14px;font-size:15.5px;text-align:left;line-height:1.4}
.qopts button.en{font-family:"Newsreader",Georgia,serif;font-size:19px;font-weight:600}
.qopts button.right{background:#E7F6EF;border-color:var(--accent);font-weight:600}
.qopts button.wrong{background:#FCECEA;border-color:#D98A7E}
.qnext{width:100%;margin-top:12px;border:0;border-radius:11px;background:var(--ink);
  color:#fff;padding:14px;font-size:15px;font-weight:600}
.qwhy{margin-top:11px;background:var(--paper);border:1px solid var(--rule);
  border-radius:11px;padding:12px 14px;font-size:14px;line-height:1.6;color:var(--ink-soft)}
.qwhy b{color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:17px}
.qwhy .ex{display:block;margin-top:6px}
.qwhy mark{background:var(--mark);border-radius:3px;padding:0 2px;color:var(--ink)}
.qdone{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:26px 18px;text-align:center}
.qdone .big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.qdone .big span{font-size:20px;color:#8A98AB}
.qdone .tit{font-size:18px;font-weight:700;margin-top:8px}
.qdone .sub{color:var(--ink-soft);font-size:14px;margin-top:5px;line-height:1.6}
.qdone .wl{text-align:left;margin-top:16px;font-size:13.5px;line-height:1.9;color:var(--ink-soft)}
.qdone .wl b{color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:16px}

/* 말하기 */
.spsent{background:var(--paper);border:1px solid var(--rule);border-radius:14px;
  padding:22px 18px;font-size:19px;line-height:1.8;text-align:center;letter-spacing:-.01em}
.spsent .tw{padding:0 2px;border-radius:4px}
.spsent .tw.hit{background:#CDEBD8}
.spsent .tw.no{color:#B9C4D1}
.spmeta{font-size:12px;color:var(--ink-soft);margin:9px 2px 0;text-align:center}
.sprow{display:flex;gap:8px;margin-top:13px}
.sprow button{flex:1;border:1px solid var(--rule);background:#fff;border-radius:11px;
  padding:14px 4px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px}
.sprow button svg{width:18px;height:18px}
.sprow .mic{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;flex:1.5}

/* ---------- 저장소 (localStorage, 실패 시 메모리) ---------- */
const store = (()=>{
  let ok=true; try{localStorage.setItem("_t","1");localStorage.removeItem("_t")}catch(e){ok=false}
  const mem={};
  return {
    get(k){ try{ return ok?localStorage.getItem(k):mem[k] }catch(e){ return mem[k] } },
    set(k,v){ try{ ok?localStorage.setItem(k,v):mem[k]=v }catch(e){ mem[k]=v } }
  };
})();
const key = d => d.id;

/* 저장 키를 고정 id로 바꾸면서, 예전 형식(단어 / 단어|뜻)으로 저장된
   체크 기록을 한 번만 자동으로 옮긴다. 이후 뜻을 수정해도 풀리지 않음. */
let learned = new Set(JSON.parse(store.get("learned")||"[]"));
(function migrate(){
  if(store.get("learned_v")==="3") return;
  const byWordMeaning={}, byWord={}, ids=new Set();
  WORDS.forEach(d=>{
    byWordMeaning[d.w+"|"+d.m]=d.id;
    (byWord[d.w]=byWord[d.w]||[]).push(d.id);
    ids.add(d.id);
  });
  const moved=new Set();
  learned.forEach(k=>{
    if(ids.has(k)) moved.add(k);
    else if(byWordMeaning[k]) moved.add(byWordMeaning[k]);
    else if(byWord[k]) byWord[k].forEach(id=>moved.add(id));
  });
  learned=moved;
  store.set("learned", JSON.stringify([...learned]));
  store.set("learned_v","3");
})();
const saveLearned = ()=> store.set("learned", JSON.stringify([...learned]));

   0 아직 · 1 봤다 · 2 안다 · 3 말한다

/* 교재 난이도. 시리즈(Seed < Sprout) → 시리즈 번호 → 급(A < B) → 급 번호 순.
   이름이 "Seed2(A1)" 꼴이 아니면 맨 뒤로 보낸다. */
function bookRank(b){
  const m = /^([A-Za-z]+)\s*(\d+)\s*\(\s*([A-Z])\s*(\d+)\s*\)$/.exec(b||"");
  if(!m) return [-1,-1,-1,-1];
  const SERIES = {Seed:0, Sprout:1};
  return [SERIES[m[1]] ?? -1, +m[2], m[3].charCodeAt(0)-65, +m[4]];
}
/* 어려운 교재가 앞에 오도록 내림차순 */
function cmpBookDesc(a,b){
  const x=bookRank(a), y=bookRank(b);
  for(let i=0;i<4;i++) if(x[i]!==y[i]) return y[i]-x[i];
  return a<b ? 1 : a>b ? -1 : 0;
}
const BOOKS = [...new Set(WORDS.map(d=>d.b).filter(Boolean))].sort(cmpBookDesc);
/* 목록에 뿌릴 때는 쉬운 교재부터 */
const BOOK_ORDER = new Map([...BOOKS].reverse().map((b,i)=>[b,i]));

/* 교재 묶음. 새 묶음이 생기면 아래 규칙만 늘리면 된다.
   match 에 걸리지 않는 교재는 자동으로 "기타" 묶음으로 간다. */
const CAT_RULES = [
  {id:"classbook", label:"Classbook", match:b=>/^(Seed|Sprout)/.test(b)}
];
function catOf(book){
  const r = CAT_RULES.find(c=>c.match(book));
  return r ? r.id : "etc";
}
const CATS = (()=>{
  const out=[];
  CAT_RULES.forEach(r=>{
    const books = BOOKS.filter(b=>catOf(b)===r.id);
    if(books.length) out.push({id:r.id, label:r.label, books});
  });
  const rest = BOOKS.filter(b=>catOf(b)==="etc");
  if(rest.length) out.push({id:"etc", label:"기타", books:rest});
  return out;
})();

function visible(){
  const q = query.trim().toLowerCase();
  return WORDS.filter(d=>{
    const st = stageMap[d.id] || 0;
    if(fState==="done" && st<2) return false;
    if(fState==="todo" && st>=2) return false;
    if(fState==="said" && st<3) return false;
    if(fBook && d.b!==fBook) return false;
    if(!q) return true;
    return (d.w+" "+d.m+" "+d.s).toLowerCase().includes(q);
  }).sort((a,b)=>(BOOK_ORDER.get(a.b) ?? 999) - (BOOK_ORDER.get(b.b) ?? 999));
}

    </tr></thead><tbody>
    ${rows.map((d,i)=>`<tr>
      <td class="cn">${i+1}</td>
      <td class="cw"><span class="chk"></span>${esc(d.w)}</td>
      <td class="cm">${esc(d.m)}</td>
      <td class="cs">${mark(d.s)}</td>
    </tr>`).join("")}
    </tbody></table>`;
}

/* =====================================================================
   교재 몰아보기 — 단어 예문(s)을 교재·레슨·쪽 순서대로 이어 붙여
   본문처럼 읽는 화면. 같은 문장이 여러 단어의 예문으로 쓰였으면
   한 번만 보여 주고, 표시된 단어를 모두 합쳐서 강조한다.
===================================================================== */
let rdCat  = null;          // 보고 있는 교재 묶음
let rdBook = null;          // 보고 있는 교재
let rdOpen = new Set();     // 펼쳐 둔 레슨
let rdTip  = null;          // 뜻을 띄운 단어 id

function bookNames(){
  const seen=[]; WORDS.forEach(d=>{ if(d.b && !seen.includes(d.b)) seen.push(d.b); });
  return seen;
}

/* 예문 하나에서 **...** 위치를 뽑아낸다 (여러 쌍도 처리) */
function marksOf(s){
  const out=[]; let plain="", i=0, open=false, start=0;
  while(i < s.length){
    if(s[i]==="*" && s[i+1]==="*"){
      if(!open){ open=true; start=plain.length; }
      else     { open=false; out.push([start, plain.length]); }
      i+=2;
    } else { plain += s[i]; i++; }
  }
  return {plain, spans: out};
}

/* 교재 → 레슨 → 쪽 → 문장 */
function readerData(book){
  const lessons=[];           // [{l, pages:[{p, lines:[{text, spans:[{a,b,id}]}]}], n}]
  const lmap={};
  WORDS.filter(d=>d.b===book).forEach(d=>{
    const {plain, spans} = marksOf(d.s);
    let L=lmap[d.l];
    if(!L){ L={l:d.l, pages:[], pmap:{}, n:0}; lmap[d.l]=L; lessons.push(L); }
    L.n++;
    let P=L.pmap[d.p];
    if(!P){ P={p:d.p, lines:[], lmap:{}}; L.pmap[d.p]=P; L.pages.push(P); }
    let line=P.lmap[plain];
    if(!line){ line={text:plain, spans:[]}; P.lmap[plain]=line; P.lines.push(line); }
    spans.forEach(([a,b])=>{
      if(!line.spans.some(x=>x.a===a && x.b===b)) line.spans.push({a, b, id:d.id, w:d.w, m:d.m});
    });
  });
  lessons.forEach(L=>L.pages.forEach(P=>P.lines.forEach(x=>x.spans.sort((u,v)=>u.a-v.a))));
  return lessons;
}

function lineHTML(line){
  let out="", at=0, last=-1;
  line.spans.forEach(sp=>{
    if(sp.a < last) return;                 // 겹치는 표시는 건너뜀
    out += esc(line.text.slice(at, sp.a));
    const on = learned.has(sp.id);
    out += `<span class="hl ${on?"done":""}" data-hl="${esc(sp.id)}">${esc(line.text.slice(sp.a, sp.b))}</span>`;
    at = sp.b; last = sp.b;
  });
  out += esc(line.text.slice(at));
  return out;
}

function renderReader(){
  const books = bookNames();
  if(!books.length){ document.getElementById("reader").innerHTML =
    `<div class="rd-empty">아직 등록된 교재가 없어요.</div>`; return; }
  if(!rdCat || !CATS.some(c=>c.id===rdCat)) rdCat = CATS[0].id;
  let catBooks = CATS.find(c=>c.id===rdCat).books;
  if(!rdBook || !catBooks.includes(rdBook)) rdBook = catBooks[0];

  const lessons = readerData(rdBook);
  const body = lessons.map(L=>{
    const id = rdBook+"|"+L.l, open = rdOpen.has(id);
    const inner = !open ? "" : `<div class="rd-body">` +
      L.pages.map(P=>
        P.lines.map(x=>{
          const tipSpan = x.spans.find(sp=>sp.id===rdTip);
          return `<p class="rd-s" data-say="${esc(x.text)}">${lineHTML(x)}</p>` +
                 (tipSpan ? `<div class="rd-tip"><span class="en">${esc(tipSpan.w)}</span>${esc(tipSpan.m)}</div>` : "");
        }).join("")
      ).join("") +
      `<button class="rd-play" data-read="${esc(id)}">이 레슨 전체 듣기</button></div>`;
    return `<div class="rd-les">
      <button class="rd-hd" data-les="${esc(id)}">
        <b>${esc(L.l)}</b><span class="ar">${open?"▾":"▸"}</span>
        <span class="pg">단어 ${L.n}개</span>
      </button>${inner}</div>`;
  }).join("");

  document.getElementById("reader").innerHTML = `
    <div class="rd-key">
      <span><i class="y"></i>단어장 단어</span>
      <span><i class="g"></i>외운 단어</span>
      <span>👆 단어 = 뜻 · 문장 = 듣기</span>
    </div>
    <div class="rd-books">${CATS.map(c=>
      `<button data-rcat="${esc(c.id)}" aria-pressed="${c.id===rdCat}">${esc(c.label)}</button>`).join("")}</div>
    <div class="rd-books rd-sub">${(CATS.find(c=>c.id===rdCat)?.books||[]).map(b=>
      `<button data-book="${esc(b)}" aria-pressed="${b===rdBook}">${esc(b)}</button>`).join("")}</div>
    ${body || `<div class="rd-empty">이 교재에는 아직 문장이 없어요.</div>`}`;
}

document.getElementById("reader").addEventListener("click", e=>{
  const rc=e.target.closest("[data-rcat]");
  if(rc){ rdCat=rc.dataset.rcat; rdBook=null; rdTip=null; rdOpen.clear(); renderReader(); return; }
  const bk=e.target.closest("[data-book]");
  if(bk){ rdBook=bk.dataset.book; rdTip=null; renderReader(); return; }
  const ls=e.target.closest("[data-les]");
  if(ls){ const id=ls.dataset.les;
          if(rdOpen.has(id)) rdOpen.delete(id); else rdOpen.add(id);
          rdTip=null; renderReader(); return; }
  const pl=e.target.closest("[data-read]");
  if(pl){ readLesson(pl.dataset.read); return; }
  const hl=e.target.closest("[data-hl]");
  if(hl){ rdTip = (rdTip===hl.dataset.hl) ? null : hl.dataset.hl; renderReader(); return; }
  const sp=e.target.closest("[data-say]");
  if(sp) say(sp.dataset.say);
});

function readLesson(id){
  if(!("speechSynthesis" in window)) return;
  const [b,l] = id.split("|");
  const L = readerData(b).find(x=>x.l===l); if(!L) return;
  speechSynthesis.cancel();
  L.pages.forEach(P=>P.lines.forEach(x=>{
    const u=new SpeechSynthesisUtterance(x.text); u.lang="en-US"; u.rate=0.9;
    speechSynthesis.speak(u);
  }));
}

/* ---------- 음성 입력 (검색: 영어 / 문장 도우미: 한국어) ---------- */
function setupVoice(btn, lang, onText){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR || !btn) return;
  btn.hidden = false;

  const rec = new SR();
  rec.lang = lang;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let on = false;
  const stop = ()=>{ on=false; btn.classList.remove("rec"); };

  btn.addEventListener("click", ()=>{
    if(on){ rec.stop(); stop(); return; }
    try{ rec.start(); on=true; btn.classList.add("rec"); }
    catch(e){ stop(); }
  });
  rec.addEventListener("result", e=>{
    let t=""; for(const r of e.results) t += r[0].transcript;
    onText(t.replace(/[.,!?]$/,"").trim());
  });
  rec.addEventListener("end", stop);
  rec.addEventListener("error", ev=>{
    stop();
    if(ev.error==="not-allowed")
      alert("마이크 사용이 차단되어 있어요.\n설정 → Safari → 마이크에서 허용해 주세요.");
  });
}

/* ---------- 문장 도우미 ----------
   한국어 문장에서 단어장에 있는 단어를 찾아 준다.
   조사·어미가 붙어도 걸리도록 뜻에서 어간을 뽑아 대조한다. */

// 뜻 문자열에서 검색용 낱말들을 뽑아낸다: "~를 살펴보다" → ["살펴보다"]
function korTerms(m){
  return m.replace(/[（(][^)）]*[)）]/g,"")   // 괄호 설명 제거
          .replace(/—.*$/,"")                 // 대시 뒤 부연 제거
          .split(/[,、/·]/)
          .map(t=>t.replace(/~[를을이가에서의로]?/g," ").replace(/\s+/g," ").trim())
          .filter(t=>/[가-힣]/.test(t));
}

// 과거형 축약: 그리다→그렸, 자다→잤, 보다→봤
function contracted(stem){
  if(!stem) return null;
  const c=stem.charCodeAt(stem.length-1)-0xAC00;
  if(c<0||c>11171||c%28!==0) return null;      // 받침 있으면 축약 안 일어남
  const jung=Math.floor(c/28)%21, cho=Math.floor(c/28/21);
  const map={0:0,1:1,4:4,5:5,8:9,13:14,20:6};   // ㅏㅐㅓㅔ 그대로 / ㅗ→ㅘ / ㅜ→ㅝ / ㅣ→ㅕ
  if(!(jung in map)) return null;
  const ch=0xAC00+((cho*21+map[jung])*28)+20;   // 받침 ㅆ
  return stem.slice(0,-1)+String.fromCharCode(ch);
}

// 한 낱말이 문장에 나타나는지 볼 때 쓸 형태들. [형태, 한글자허용]
function korForms(term){
  const out=new Map();
  const push=(f,short)=>{ if(f && (f.length>=2 || short)) out.set(f, out.get(f)||short); };
  const derive=(t,short)=>{
    push(t,short);
    const v=t.match(/^(.+)다$/);                 // 동사·형용사 어간
    if(v){
      const one = short && v[1].length===1;
      push(v[1], one);
      push(contracted(v[1]), one);               // 과거형
    }
    const a=t.match(/^(.+?)(한|인|은|는|던|운|나|린)$/); // 관형형·불규칙
    if(a && a[1].length>=2) push(a[1],false);
  };
  derive(term,true);
  // 뜻이 여러 낱말이면 각 낱말도 따로 본다 ("천둥번개를 동반한 비" → "천둥번개")
  if(/\s/.test(term)){
    term.split(/\s+/).forEach(tk=>{
      derive(tk.replace(/[를을이가은는의에서로와과]$/,""), false);
    });
  }
  return [...out.entries()];
}

const ENDINGS="요|아|어|았|었|는|은|을|를|ㄹ|고|지|기|니|나|면|자|ㅁ|음|와|워|여|해|이|가|도|만|에";

function findWords(input){
  const text=input.trim();
  if(!text) return {hits:[],ranges:[]};
  const low=text.toLowerCase();
  const hits=[], ranges=[];

  WORDS.forEach(d=>{
    let best=null;

    // 영어 단어를 그대로 쓴 경우
    const ew=d.w.toLowerCase();
    const ei=low.indexOf(ew);
    if(ei>=0) best={i:ei,len:ew.length,via:d.w};

    korTerms(d.m).forEach(term=>{
      korForms(term).forEach(([f,short])=>{
        if(f.length>=2){
          const i=text.indexOf(f);
          if(i>=0 && (!best||f.length>best.len)) best={i,len:f.length,via:f};
        }else if(short){
          // 어간이 한 글자면 어미가 붙은 형태일 때만 인정 ("자"+"요")
          const re=new RegExp(f+"("+ENDINGS+")");
          const m2=re.exec(text);
          if(m2 && (!best||best.len<2)) best={i:m2.index,len:m2[0].length,via:m2[0]};
        }
      });
    });

    if(best){ hits.push({d,...best}); ranges.push([best.i,best.i+best.len]); }
  });

  hits.sort((a,b)=>a.i-b.i);
  return {hits,ranges};
}

// 찾은 부분은 노란색, 못 찾은 부분은 빨간색으로 보여 준다
function coverage(text,ranges){
  if(!text.trim()) return "";
  const merged=[];
  ranges.slice().sort((a,b)=>a[0]-b[0]).forEach(r=>{
    const last=merged[merged.length-1];
    if(last && r[0]<=last[1]) last[1]=Math.max(last[1],r[1]);
    else merged.push(r.slice());
  });
  let out="",p=0;
  merged.forEach(([s,e])=>{
    if(s>p) out+=missSpan(text.slice(p,s));
    out+="<mark>"+esc(text.slice(s,e))+"</mark>";
    p=e;
  });
  if(p<text.length) out+=missSpan(text.slice(p));
  return out;
}
// 조사·공백처럼 굳이 표시할 필요 없는 부분은 그냥 두고, 낱말만 빨갛게
function missSpan(chunk){
  return chunk.split(/(\s+)/).map(part=>{
    if(!part.trim()) return esc(part);
    return /[가-힣a-zA-Z]{2,}/.test(part)
      ? '<span class="miss">'+esc(part)+"</span>" : esc(part);
  }).join("");
}

function renderMaker(){
  const text=document.getElementById("kin").value;
  const out=document.getElementById("mkOut");
  if(!text.trim()){ out.innerHTML=""; return; }

  const {hits,ranges}=findWords(text);
  let html=`<div class="cov"><span class="lead">노란색은 단어장에 있는 말, 빨간색은 아직 없는 말이에요.</span>${coverage(text,ranges)}</div>`;

  if(!hits.length){
    html+=`<div class="mk-none">이 문장에 쓸 만한 단어가 아직 단어장에 없어요.<br>더 쉬운 말로 바꿔서 다시 해 보세요.</div>`;
  }else{
    html+=`<p class="mk-count">쓸 수 있는 단어 ${hits.length}개</p>`;
    html+=hits.map(({d})=>`<article class="entry">
      <div class="w">${esc(d.w)}</div>
      <div class="m">${esc(d.m)}</div>
      <div class="s">${mark(d.s)}</div>
      <div class="side">
        <button class="mini" data-say="${esc(d.w)}" aria-label="발음 듣기">${ICON_SOUND}</button>
      </div>
    </article>`).join("");
  }
  out.innerHTML=html;

let unlocked = new Set(JSON.parse(store.get("cities")||"[]"));
const saveCities = ()=> store.set("cities", JSON.stringify([...unlocked]));



/* ---------- 기기 간 동기화 ----------
   동기화를 켠 기기끼리만 합쳐진다. 끈 기기는 그 안에만 기록한다.
   서버가 준비되지 않았으면 조용히 기기 저장만 쓴다. */
let syncOn = store.get("syncOn")==="1";
let pendingDel = new Set(JSON.parse(store.get("pendingDel")||"[]"));
let syncState = "";                     // 화면에 보여줄 상태 문구
const savePendingDel = ()=> store.set("pendingDel", JSON.stringify([...pendingDel]));

function applyRemote(o){
  let changed=false;
  (o.l||[]).forEach(x=>{ if(!pendingDel.has(x) && !learned.has(x)){ learned.add(x); changed=true; } });
  (o.c||[]).forEach(x=>{ if(!unlocked.has(x)){ unlocked.add(x); changed=true; } });
  Object.entries(o.r||{}).forEach(([k,v])=>{ if(!reacts[k]){ reacts[k]=v; changed=true; } });
  /* 단계·복습일정·말한 문장·연속 기록 — 늘 더 앞선 쪽을 남긴다 */
  Object.entries(o.st||{}).forEach(([k,v])=>{
    if(pendingDel.has(k)) return;
    if((stageMap[k]||0)<v){ stageMap[k]=v; changed=true; } });
  Object.entries(o.sp||{}).forEach(([k,v])=>{ if((spoken[k]||0)<v){ spoken[k]=v; changed=true; } });
  Object.entries(o.sr||{}).forEach(([k,v])=>{
    if(!v || typeof v.n!=="number") return;
    if(!srs[k] || srs[k].n<v.n){ srs[k]=v; changed=true; } });
  const k=o.sk;
  if(k){
    if((k.best||0)>(streak.best||0)){ streak.best=k.best; changed=true; }
    if((k.last||"")>(streak.last||"")){ streak.n=k.n||0; streak.last=k.last; changed=true; }
    (k.days||[]).forEach(x=>{ if(!streak.days.includes(x)){ streak.days.push(x); changed=true; } });
    streak.days.sort(); streak.days=streak.days.slice(-120);
  }
  /* 단계가 2 이상이면 외움 집합에도 반영해 둔다 */
  Object.entries(stageMap).forEach(([id,v])=>{
    if(v>=2 && !pendingDel.has(id) && !learned.has(id)){ learned.add(id); changed=true; } });
  learned.forEach(id=>{ if(!stageMap[id]){ stageMap[id]=2; changed=true; } });
  if(changed){ saveLearned(); saveCities(); saveReacts(); saveStage(); saveSpoken(); saveSrs(); saveStreak(); }
  return changed;
}

async function syncPull(){
  if(!syncOn) return;
  try{
    const r=await fetch("/api/sync",{cache:"no-store"});
    if(r.status===503){ syncState="서버 연결 전"; renderIfSet(); return; }
    if(!r.ok) throw 0;
    const changed=applyRemote(await r.json());
    syncState="맞춤"; if(changed) render(); else renderIfSet();
  }catch(e){ syncState="연결 안 됨"; renderIfSet(); }
}

let pushTimer=null;
function syncPush(){
  if(!syncOn) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(async ()=>{
    try{
      const r=await fetch("/api/sync",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({l:[...learned], c:[...unlocked], r:reacts, del:[...pendingDel],
                             st:stageMap, sp:spoken, sr:srs, sk:streak})});
      if(r.status===503){ syncState="서버 연결 전"; renderIfSet(); return; }
      if(!r.ok) throw 0;
      pendingDel.clear(); savePendingDel();
      applyRemote(await r.json());
      syncState="맞춤"; renderIfSet();
    }catch(e){ syncState="연결 안 됨"; renderIfSet(); }
  }, 1200);
}

/* ---------- 날짜 (기기 시간 기준 하루) ---------- */
const DAY = 86400000;
function ymd(dt){
  const d = dt || new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
const saidCount = ()=> Object.keys(stageMap).filter(k=>stageMap[k]>=3).length;

/* ---------- 단계 바꾸기 ---------- */
function setStage(id, st){
  const prev = stageOf(id);
  if(prev===st) return;
  if(st<=0) delete stageMap[id]; else stageMap[id]=st;
  if(st>=2){ learned.add(id); pendingDel.delete(id); }
  else if(prev>=2){ learned.delete(id); pendingDel.add(id); }
  saveStage(); saveLearned(); savePendingDel();
}
/* 화면에 한 번이라도 나온 단어는 '봤다'로 올려 둔다 */
function touch(id){ if(stageOf(id)===0){ stageMap[id]=1; saveStage(); } }

function toggleKnow(id){
  if(stageOf(id)>=2){ setStage(id,0); delete srs[id]; saveSrs(); }
  else { setStage(id,2); schedule(id,true); bump("nw", id); }
  syncPush();
}

/* ---------- 복습 큐 (1·3·7·21·60일) ---------- */
const SRS = [1,3,7,21,60];
let srs = (()=>{ try{ return JSON.parse(store.get("srs")||"{}"); }catch(e){ return {}; } })();
const saveSrs = ()=> store.set("srs", JSON.stringify(srs));
function schedule(id, ok){
  const cur = srs[id];
  const n = ok ? Math.min((cur ? cur.n : -1)+1, SRS.length-1) : 0;
  srs[id] = {n, d: ymd(new Date(Date.now() + SRS[n]*DAY))};
  saveSrs();
}
/* 이미 외워 둔 옛 단어들에 복습 날짜를 한 번만 깔아 준다.
   전부 오늘로 몰리지 않도록 단어 이름으로 30일에 고르게 흩뿌린다. */

    if(stageMap[id]<2 || srs[id]) return;
    let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0;
    srs[id] = {n:2, d: ymd(new Date(Date.now() + (h%30)*DAY))};

  rollDay();

  if(k==="sp"){ if(daily.sids.includes(id)) return; daily.sids.push(id); }
  daily[k]++; saveDaily(); checkStamp();

function checkStamp(){
  if(daily.stamp) return;
  if(daily.nw<G_NEW || daily.qz<G_QZ || daily.sp<G_SPK) return;
  daily.stamp = true;
  const t = ymd(), y = ymd(new Date(Date.now()-DAY));

  streak.days.sort(); streak.days = streak.days.slice(-120);
  streak.n = (streak.last===y) ? streak.n+1 : 1;
  streak.last = t;
  streak.best = Math.max(streak.best||0, streak.n);
  saveDaily(); saveStreak(); syncPush();

/* ---------- 퀴즈 ---------- */
let quiz = null;
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
/* 복습할 때가 된 단어 → 외운 단어 → 본 단어 → 나머지 순으로 채운다 */
function quizPool(n){
  const seen = new Set(), out = [];
  const add = arr => arr.forEach(d=>{ if(out.length<n && !seen.has(d.id)){ seen.add(d.id); out.push(d); } });
  add(shuffle(dueWords()));
  add(shuffle(WORDS.filter(d=>stageOf(d.id)>=2)));
  add(shuffle(WORDS.filter(d=>stageOf(d.id)===1)));
  add(shuffle(WORDS));
  return out;
}
/* 헷갈리게, 같은 교재에서 먼저 고른다 */
function distract(d, f, n){
  const same = WORDS.filter(x=>x.b===d.b && x.id!==d.id && x[f]!==d[f]);
  const pool = shuffle(same.length>=12 ? same : WORDS.filter(x=>x.id!==d.id && x[f]!==d[f]));
  const out = [], used = new Set([d[f]]);
  for(const x of pool){
    if(out.length>=n) break;
    if(used.has(x[f])) continue;
    used.add(x[f]); out.push(x[f]);
  }
  return out;
}
function makeQ(d){
  const types = ["meaning","word","listen"];
  const mk = marksOf(d.s);
  if(mk.spans.length && mk.plain.split(/\s+/).length<=18) types.push("blank","blank");
  const t = types[Math.floor(Math.random()*types.length)];
  if(t==="meaning") return {d,t, sub:"무슨 뜻일까?", ask:d.w,
                            opts:shuffle([d.m, ...distract(d,"m",3)]), ans:d.m};
  if(t==="listen")  return {d,t, sub:"듣고 뜻을 고르세요", say:d.w,
                            opts:shuffle([d.m, ...distract(d,"m",3)]), ans:d.m};
  if(t==="word")    return {d,t, sub:"영어로 뭘까?", ask:d.m, ko:true, en:true,
                            opts:shuffle([d.w, ...distract(d,"w",3)]), ans:d.w};
  const sp = mk.spans[0], word = mk.plain.slice(sp[0], sp[1]);
  return {d, t, sub:"빈칸에 들어갈 말은?", sm:true, en:true,
          ask: mk.plain.slice(0,sp[0])+"____"+mk.plain.slice(sp[1]),
          opts: shuffle([word, ...distract(d,"w",3)]), ans: word};
}
function startQuiz(){
  const pool = quizPool(QUIZ_N);
  quiz = pool.length ? {qs: pool.map(makeQ), i:0, pick:null, right:0, wrong:[]} : null;
  renderQuiz();
}
function answerQ(o){
  if(!quiz || quiz.pick!=null) return;
  const q = quiz.qs[quiz.i];
  quiz.pick = o;
  const ok = (o===q.ans);
  touch(q.d.id);
  if(stageOf(q.d.id)>=2) schedule(q.d.id, ok);   // 외운 단어만 복습 일정을 움직인다
  if(ok){ quiz.right++; bump("qz"); } else quiz.wrong.push(q.d);
  syncPush();
  renderQuiz();
}
function renderQuiz(){
  const el = document.getElementById("quiz");
  if(!quiz){
    el.innerHTML = `<div class="qdone"><div class="pemo">🧠</div>
      <div class="tit">퀴즈 ${QUIZ_N}문제</div>
      <div class="sub">복습할 때가 된 단어부터 나와요.<br>
        뜻 고르기 · 영어 고르기 · 듣고 고르기 · 빈칸 채우기</div></div>
      <button class="qnext" data-q="start">시작하기</button>`;
    return;
  }
  if(quiz.i >= quiz.qs.length){
    const n = quiz.qs.length, r = quiz.right;
    el.innerHTML = `<div class="qdone">
      <div class="big">${r}<span> / ${n}</span></div>
      <div class="sub">${r===n ? "다 맞았어요! 대단한데?"
        : r>=Math.ceil(n*0.7) ? "잘했어요!" : "틀린 건 곧 다시 나올 거예요."}</div>
      ${quiz.wrong.length?`<div class="wl">${quiz.wrong.map(d=>
        `<div><b>${esc(d.w)}</b> — ${esc(d.m)}</div>`).join("")}</div>`:""}
      </div>
      <button class="qnext" data-q="start">한 판 더</button>`;
    return;
  }
  const q = quiz.qs[quiz.i], pick = quiz.pick;
  if(q.t==="listen" && pick==null && !q.played){ q.played=true; setTimeout(()=>say(q.say), 320); }
  const ask = q.t==="listen"
    ? `<button class="qplay" data-say="${esc(q.say)}">${ICON_SOUND}소리 듣기</button>`
    : `<div class="qq ${q.sm?"sm":q.ko?"ko":""}">${
         q.sm ? esc(q.ask).replace("____","<u>____</u>") : esc(q.ask)}</div>`;
  const opts = q.opts.map(o=>{
    let cls = q.en ? "en" : "";
    if(pick!=null){ if(o===q.ans) cls += " right"; else if(o===pick) cls += " wrong"; }
    return `<button class="${cls}" data-opt="${esc(o)}">${esc(o)}</button>`;
  }).join("");
  const why = pick==null ? "" :
    `<div class="qwhy"><b>${esc(q.d.w)}</b> — ${esc(q.d.m)}<span class="ex">${mark(q.d.s)}</span></div>`;
  const next = pick==null ? "" :
    `<button class="qnext" data-q="next">${quiz.i+1<quiz.qs.length?"다음":"결과 보기"}</button>`;
  el.innerHTML = `
    <div class="qtop"><span>${quiz.i+1} / ${quiz.qs.length}</span>
      <span class="qbar"><i style="width:${Math.round(quiz.i/quiz.qs.length*100)}%"></i></span>
      <span>맞힘 ${quiz.right}</span></div>
    <div class="qask"><div class="qs">${esc(q.sub)}</div>${ask}</div>
    <div class="qopts">${opts}</div>${why}${next}`;
}
document.getElementById("quiz").addEventListener("click", e=>{
  const sy = e.target.closest("[data-say]"); if(sy){ say(sy.dataset.say); return; }
  const op = e.target.closest("[data-opt]"); if(op){ answerQ(op.dataset.opt); return; }
  const bt = e.target.closest("[data-q]");   if(!bt) return;
  if(bt.dataset.q==="start"){ startQuiz(); return; }
  quiz.i++; quiz.pick=null; renderQuiz();
});

/* ---------- 따라 말하기 ----------
   예문을 들려주고, 아이가 따라 말한 것을 받아적어 단어 단위로 맞춰 본다.
   마이크를 쓸 수 없는 기기에서는 스스로 확인하는 버튼으로 바뀐다. */
const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
let spk=null, spRec=null, spOn=false;

const plainOf = d => marksOf(d.s).plain;
const nrm = w => w.toLowerCase().replace(/[^a-z0-9]/g,"");

function speakPool(){
  const a=[], b=[], c=[];
  WORDS.forEach(d=>{
    const n = plainOf(d).split(/\s+/).filter(Boolean).length;
    if(n<3 || n>14) return;                 // 너무 짧거나 긴 문장은 뺀다
    if(spoken[d.id]) c.push(d);
    else if(stageOf(d.id)>=2) a.push(d);
    else b.push(d);
  });
  return [...shuffle(a), ...shuffle(b), ...shuffle(c)];
}
function grade(sent, heard){
  const disp = sent.split(/\s+/).filter(Boolean);
  const tgt  = disp.map(nrm);
  const H    = String(heard||"").split(/\s+/).map(nrm).filter(Boolean);
  const hit  = disp.map(()=>false);
  let j = 0;
  for(let i=0;i<tgt.length;i++){
    if(!tgt[i]){ hit[i]=true; continue; }
    const k = H.indexOf(tgt[i], j);
    if(k>=0){ hit[i]=true; j=k+1; }
  }
  const rest = H.slice();                   // 순서가 어긋난 것도 한 번 더 본다
  for(let i=0;i<tgt.length;i++){
    if(hit[i] || !tgt[i]) continue;
    const k = rest.indexOf(tgt[i]);
    if(k>=0){ hit[i]=true; rest.splice(k,1); }
  }
  const total = tgt.filter(Boolean).length;
  const got   = hit.filter((h,i)=>h && tgt[i]).length;
  return {disp, hit, score: total ? Math.round(got/total*100) : 0};
}
const spCur = ()=> spk.list[spk.i % spk.list.length];
function spStop(){ spOn=false; try{ if(spRec) spRec.stop(); }catch(e){} }
function spStart(){
  if(!spk) return;
  if(spOn){ spStop(); renderSpeak(); return; }
  if(!SRClass){ spk.err="noSR"; renderSpeak(); return; }
  try{
    spRec = new SRClass();
    spRec.lang="en-US"; spRec.interimResults=false; spRec.maxAlternatives=1; spRec.continuous=false;
    spRec.onresult = ev=>{ let t=""; for(const r of ev.results) t += r[0].transcript + " "; spJudge(t); };
    spRec.onerror = ev=>{
      spOn=false;
      spk.err = (ev.error==="not-allowed"||ev.error==="service-not-allowed") ? "noMic"
              : (ev.error==="no-speech") ? "noSpeech" : "fail";
      renderSpeak();
    };
    spRec.onend = ()=>{ spOn=false; renderSpeak(); };
    spk.err=null; spk.res=null; spk.heard=null;
    spRec.start(); spOn=true;
    renderSpeak();
  }catch(e){ spOn=false; spk.err="noSR"; renderSpeak(); }
}
function spJudge(text){
  const d = spCur();
  const r = grade(plainOf(d), text);
  spk.heard = String(text).trim(); spk.res = r; spk.err = null;
  touch(d.id);
  if(r.score>=80) spPass(d, r.score);
  renderSpeak();
}
function spPass(d, score){
  spoken[d.id] = Math.max(spoken[d.id]||0, score); saveSpoken();
  if(stageOf(d.id)<3) setStage(d.id, 3);
  schedule(d.id, true);
  bump("sp", d.id);
  syncPush();
}
function spNext(){
  spk.i = (spk.i+1) % spk.list.length;
  spk.res=null; spk.heard=null; spk.err=null;
  renderSpeak();
}
function renderSpeak(){
  const el = document.getElementById("speak");
  if(!spk) spk = {list: speakPool(), i:0, res:null, heard:null, err:null};
  if(!spk.list.length){ el.innerHTML = `<div class="rd-empty">말하기에 쓸 만한 문장이 없어요.</div>`; return; }
  const d = spCur(), res = spk.res, best = spoken[d.id];
  const body = res
    ? res.disp.map((w,i)=>`<span class="tw ${res.hit[i]?"hit":"no"}">${esc(w)}</span>`).join(" ")
    : esc(plainOf(d));
  const NOTE = {
    noSR:"이 브라우저에서는 마이크로 받아적기가 안 돼요. 소리를 듣고 따라 말한 뒤 아래 버튼을 눌러 주세요.",
    noMic:"마이크가 막혀 있어요. 설정 → Safari → 마이크를 허용하거나, 아래 버튼으로 직접 확인해 주세요.",
    noSpeech:"소리가 안 들렸어요. 한 번 더 해 볼까요?",
    fail:"잘 안 들렸어요. 조용한 곳에서 다시 해 볼까요?"
  };
  const selfOK = !SRClass || spk.err==="noSR" || spk.err==="noMic";
  const score = !res ? "" : `<div class="spscore">
      <div class="num ${res.score>=80?"ok":""}">${res.score}<span style="font-size:18px">점</span></div>
      <div class="msg">${res.score>=80 ? "통과! 이 문장은 이제 말할 수 있어요 🗣"
        : res.score>=55 ? "거의 다 왔어요. 회색 단어를 또박또박!" : "천천히 한 번 더 들어 볼까요?"}</div>
      ${spk.heard?`<div class="spheard">들린 말: ${esc(spk.heard)}</div>`:""}
    </div>`;
  el.innerHTML = `
    <div class="spbar"><span>오늘 ${daily.sp} / ${G_SPK}</span>
      <span class="qbar"><i style="width:${Math.min(100, daily.sp/G_SPK*100)}%"></i></span>
      <span>모은 문장 ${Object.keys(spoken).length}</span></div>
    <div class="spsent">${body}</div>
    <div class="spmeta">${esc(d.w)} · ${esc(d.m)} · ${esc(d.b||"")} ${esc(d.l||"")}${best?` · 최고 ${best}점`:""}</div>
    <div class="sprow">
      <button data-sp="play">${ICON_SOUND}듣기</button>
      <button class="mic ${spOn?"rec":""}" data-sp="mic">${ICON_MIC}${spOn?"듣는 중…":"따라 말하기"}</button>
    </div>
    <div class="sprow">
      ${selfOK?`<button data-sp="self">따라 말했어요 ✓</button>`:""}
      <button data-sp="next">다음 문장 →</button>
    </div>
    ${score}
    <p class="spnote">${spk.err ? NOTE[spk.err]
      : "듣기를 누르고 똑같이 따라 말해 보세요. 80점을 넘으면 통과예요."}</p>`;
}
document.getElementById("speak").addEventListener("click", e=>{
  const b = e.target.closest("[data-sp]"); if(!b || !spk) return;
  const d = spCur();
  if(b.dataset.sp==="play"){ say(plainOf(d)); return; }
  if(b.dataset.sp==="mic"){ spStart(); return; }
  if(b.dataset.sp==="next"){ spNext(); return; }
  if(b.dataset.sp==="self"){
    const disp = plainOf(d).split(/\s+/).filter(Boolean);
    spk.res = {disp, hit: disp.map(()=>true), score:100};
    spk.heard = null; spk.err = null;
    spPass(d, 100); renderSpeak();
  }
});

document.getElementById("printBtn").addEventListener("click", ()=>{ renderPrint(); window.print(); });
window.addEventListener("beforeprint", renderPrint);

setMode(mode);
</script>
</body>
