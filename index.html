<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A41">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="영어 단어장">
<title>박수아의 영어 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#ffffff;
  --bg:#EFF3F6;
  --ink:#1B2A41;
  --ink-soft:#61718A;
  --rule:#D9E1EA;
  --accent:#1E7A6B;
  --mark:#FFE28A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- 상단 ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--ink);color:#fff;
  padding:14px 16px 12px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.brand .count{font-size:13px;color:#9FB3C8}
.tools{display:flex;gap:8px;margin-top:11px}
#q{
  flex:1;min-width:0;border:0;border-radius:9px;
  padding:9px 12px;font-size:15px;background:#2C4160;color:#fff;
}
#q::placeholder{color:#8FA3BC}
#q:focus{outline:2px solid var(--mark);outline-offset:1px}
.iconbtn{
  border:0;background:#2C4160;color:#DCE7F2;border-radius:9px;
  padding:0 13px;font-size:14px;white-space:nowrap;
}
.iconbtn:focus-visible{outline:2px solid var(--mark)}
.iconbtn[hidden]{display:none}
.ico{display:grid;place-items:center;padding:0 11px}
.ico svg{width:21px;height:21px;display:block}
.iconbtn.rec{background:#C0392B;color:#fff;animation:pulse 1.1s ease-in-out infinite}
.iconbtn[aria-pressed="true"]{background:var(--mark);color:#1B2A41}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid #40587A;background:transparent;color:#B9C9DC;
  border-radius:999px;padding:5px 12px 5px 10px;font-size:13.5px;white-space:nowrap;
}
.chip svg{width:14px;height:14px;display:block;flex:none}
.chip[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#1B2A41;font-weight:600}

/* ---------- 목록 ---------- */
main{padding:12px 12px 90px;max-width:640px;margin:0 auto}
.entry{
  background:var(--paper);border-radius:12px;
  padding:13px 14px 14px;margin-bottom:9px;
  border:1px solid var(--rule);
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;
}
.entry.done{border-color:#BFDCD5;background:#F7FCFB}
.w{
  grid-column:1;
  font-family:"Newsreader",Georgia,serif;
  font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1.15;
}
.side{grid-column:2;grid-row:1 / span 3;display:flex;flex-direction:column;gap:6px;align-items:center}
.mini{
  border:1px solid var(--rule);background:#fff;border-radius:8px;
  width:38px;height:32px;display:grid;place-items:center;font-size:15px;color:var(--ink-soft);
}
.mini.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mini svg{width:17px;height:17px;display:block}
.m{grid-column:1;font-size:16px;color:var(--ink);margin-top:3px}
.s{grid-column:1;font-size:14.5px;color:var(--ink-soft);margin-top:6px;line-height:1.55}
.s mark{background:var(--mark);color:var(--ink);border-radius:3px;padding:0 2px;font-weight:600}
.src{grid-column:1;font-size:12px;color:#9AA8BC;margin-top:7px}
.hide .m,.hide .s{filter:blur(5px);opacity:.55}
.hide .m:active,.hide .s:active{filter:none;opacity:1}

.empty{
  background:var(--paper);border:1px dashed #C3D0DE;border-radius:12px;
  padding:26px 20px;text-align:center;color:var(--ink-soft);font-size:15px;line-height:1.7;
}

/* ---------- 카드 모드 ---------- */
#card{display:none;padding:16px 14px 100px;max-width:640px;margin:0 auto}
#card.on{display:block}
.flip{
  background:var(--paper);border:1px solid var(--rule);border-radius:16px;
  min-height:56vh;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:28px 22px;gap:14px;
}
.flip .sp{
  -webkit-appearance:none;appearance:none;background:none;border:0;color:inherit;font:inherit;
  width:100%;display:block;padding:6px 4px;border-radius:12px;cursor:pointer;text-align:center;
}
.flip .sp:active{background:#EFF4F7}
.flip .sp:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.spk{display:inline-grid;place-items:center;vertical-align:middle;margin-left:8px;color:#A9B6C6}
.spk svg{width:17px;height:17px;display:block}
.flip .fw .spk svg{width:23px;height:23px}
.flip .fw{font-family:"Newsreader",Georgia,serif;font-size:42px;font-weight:600;line-height:1.1}
.flip .fm{font-size:21px}
.flip .fs{font-size:16px;color:var(--ink-soft);line-height:1.6}
.flip .fs mark{background:var(--mark);padding:0 2px;border-radius:3px;font-weight:600}
.veil{color:#B4C0CE;font-size:15px}
.nav{display:flex;gap:9px;margin-top:14px}
.nav button{
  flex:1;border:1px solid var(--rule);background:#fff;border-radius:11px;padding:13px;font-size:15px;
}
.nav .primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.pos{text-align:center;margin-top:12px;color:var(--ink-soft);font-size:13.5px}

/* ---------- 문장 도우미 ---------- */
#maker{display:none;padding:14px 12px 100px;max-width:640px;margin:0 auto}
#maker.on{display:block}
.mk-help{margin:0 2px 11px;font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.mk-in{display:flex;gap:8px;align-items:stretch}
#kin{
  flex:1;min-width:0;border:1px solid var(--rule);border-radius:11px;
  padding:11px 12px;font:inherit;font-size:16px;resize:none;background:var(--paper);color:var(--ink);
}
#kin:focus{outline:2px solid var(--accent);outline-offset:-1px}
.mk-in .iconbtn{background:var(--paper);border:1px solid var(--rule);color:var(--ink-soft)}
.mk-in .iconbtn.rec{background:#C0392B;border-color:#C0392B;color:#fff}
#mkGo{
  width:100%;margin-top:9px;border:0;border-radius:11px;
  background:var(--ink);color:#fff;padding:12px;font-size:15px;font-weight:600;
}
.cov{background:var(--paper);border:1px solid var(--rule);border-radius:11px;
     padding:12px 14px;margin-top:14px;font-size:16px;line-height:1.7}
.cov mark{background:var(--mark);border-radius:3px;padding:0 2px}
.cov .miss{color:#C0392B;font-weight:600;text-decoration:underline wavy #C0392B 1px}
.cov .lead{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:400}
.mk-count{margin:14px 2px 8px;font-size:13.5px;color:var(--ink-soft)}
.mk-none{background:var(--paper);border:1px dashed #C3D0DE;border-radius:11px;
         padding:22px 18px;margin-top:14px;text-align:center;color:var(--ink-soft);line-height:1.7}

/* ---------- 도시 카드 도감 ---------- */
#dex{display:none;padding:14px 12px 100px;max-width:640px;margin:0 auto}
#dex.on{display:block}
.dex-msg{background:var(--paper);border:1px solid var(--rule);border-radius:12px;
  padding:14px;text-align:center;font-size:14.5px;color:var(--ink-soft);line-height:1.6}
.dex-msg b{color:var(--ink);font-size:16px}
.bar .dot{display:inline-block;min-width:17px;height:17px;line-height:17px;padding:0 4px;
  border-radius:9px;background:#E24A3B;color:#fff;font-size:11px;font-weight:700;
  margin-left:4px;vertical-align:top;font-variant-numeric:tabular-nums}

/* 지도 대시보드 */
.map-card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:12px 12px 6px}
.map-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
.map-head b{font-size:17px}
.map-head span{font-size:13px;color:var(--ink-soft)}
.wmap{width:100%;height:auto;display:block;margin:2px 0 6px}
.wmap path{cursor:pointer;transition:opacity .15s}
.wmap path:active{opacity:.7}
.wmap .pin{cursor:pointer}
.wmap .pin path{filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.wmap .pin:active{opacity:.75}
.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:6px}
.lg{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:9px;
  border:1px solid var(--rule);font-size:12.5px;cursor:pointer;background:#fff}
.lg[aria-pressed="true"]{border-color:var(--ink);background:#F3F6F9}
.lg .sw{width:11px;height:11px;border-radius:3px;flex:none}
.lg .nm{flex:1;min-width:0}
.lg .ct{color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* 뒤집을 카드 */
.pack-wrap{margin:16px 0 4px;text-align:center}
.pack-lead{font-size:15px;color:var(--ink);margin-bottom:2px}
.pack-lead b{color:#C0392B}
.pack-sub{font-size:12.5px;color:var(--ink-soft);margin:0 auto 11px;max-width:330px}
.pack{perspective:1100px;width:196px;height:262px;margin:0 auto 10px;cursor:pointer}
.pack-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.2,.85,.25,1)}
.pack.open .pack-in{transform:rotateY(180deg)}
.pack .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:16px;overflow:hidden;box-shadow:0 5px 18px rgba(27,42,65,.2)}
.pack .front{background:linear-gradient(140deg,#27496B,#16324F);display:grid;place-items:center;gap:6px}
.pack .front .globe{width:78px;height:78px;opacity:.55}
.pack .front .txt{color:#9FC0DC;font-size:13px;letter-spacing:.02em}
.pack .back{transform:rotateY(180deg);background:var(--paper);border:1px solid var(--rule)}
.pack .back .cm-t{padding:10px 12px 12px}
.pack .back .en{font-size:22px}
.pack-ok{border:0;border-radius:11px;background:var(--ink);color:#fff;padding:11px 26px;font-size:15px}
.chance{display:flex;align-items:center;gap:9px;background:var(--paper);border:1px solid var(--rule);
  border-radius:12px;padding:10px 14px;margin:12px auto 7px;max-width:330px}
.chance .ci{display:grid;place-items:center;color:var(--accent);flex:none}
.chance .ci svg{width:21px;height:21px;display:block}
.chance .cl{flex:1;text-align:left;font-size:14.5px}
.chance .cv{font-size:22px;font-variant-numeric:tabular-nums;color:var(--ink)}
.chance .cv em{font-style:normal;font-size:14px;font-weight:400;color:var(--ink-soft);margin-left:2px}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:330px;
  margin:0 auto 12px;border:0;border-radius:12px;background:var(--accent);color:#fff;
  padding:13px;font-size:16px;font-weight:600;cursor:pointer}
.go svg{width:20px;height:20px;display:block}
.go:disabled{background:#DFE6EC;color:#9AA8BC;cursor:default}
.pack.sample{cursor:pointer}
.pack.sample .pack-in{transition:none}
.pack-note{font-size:12px;color:#9AA8BC;margin-top:2px}

/* 도시 목록 */
.clist{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:11px;background:var(--paper);
  border:1px solid var(--rule);border-radius:12px;padding:8px 11px 8px 8px;cursor:pointer}
.crow .th{width:68px;flex:none;border-radius:8px;overflow:hidden}
.crow .th svg{width:100%;height:auto;display:block}
.crow .tx{min-width:0;flex:1}
.crow .en{font-family:"Newsreader",Georgia,serif;font-size:18px;font-weight:600;line-height:1.2}
.crow .ko{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.crow .mo{font-size:12px;color:#9AA8BC;margin-top:2px}
.crow.lock{background:#EDF1F5;border-style:dashed;cursor:default}
.crow.lock .th{width:68px;aspect-ratio:4/3;display:grid;place-items:center;
  background:#DFE6EC;color:#AEBBC8;font-size:22px}
.backup{margin-top:26px;background:var(--paper);border:1px solid var(--rule);
  border-radius:12px;padding:13px 14px}
.backup h4{margin:0 0 4px;font-size:14.5px}
.backup p{margin:0 0 10px;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.backup .bt{display:flex;gap:8px}
.backup .bt button{flex:1;border:1px solid var(--rule);background:#fff;border-radius:9px;
  padding:9px;font-size:13.5px;cursor:pointer}
.backup .bt button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.backup textarea{width:100%;margin-top:9px;border:1px solid var(--rule);border-radius:9px;
  padding:9px;font-size:11px;font-family:ui-monospace,monospace;height:74px;resize:none;
  color:var(--ink);background:#F7FAFC}
.clist-h{margin:20px 2px 0;font-size:13.5px;color:var(--ink-soft);display:flex;
  align-items:center;justify-content:space-between;gap:8px}
.clist-h .clr{border:1px solid var(--rule);background:#fff;color:var(--ink);
  border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer;flex:none}

#cityModal{position:fixed;inset:0;z-index:40;background:rgba(20,32,48,.55);
  display:grid;place-items:center;padding:22px}
#cityModal[hidden]{display:none}
.cm-box{background:var(--paper);border-radius:18px;overflow:hidden;width:100%;max-width:330px}
.cm-box svg{width:100%;height:auto;display:block}
.cm-t{padding:14px 16px 16px}
.cm-t .en{font-family:"Newsreader",Georgia,serif;font-size:27px;font-weight:600;
  display:flex;align-items:center;gap:7px;cursor:pointer}
.cm-t .ko{font-size:15px;color:var(--ink-soft);margin-top:1px}
.cm-t .mo{font-size:14px;margin-top:9px;padding-top:9px;border-top:1px solid var(--rule)}
.rxrow{display:flex;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid var(--rule)}
.rxrow button{flex:1;border:1px solid var(--rule);background:#fff;border-radius:9px;
  padding:6px 2px 5px;cursor:pointer;display:grid;gap:1px;place-items:center;line-height:1.1}
.rxrow button .e{font-size:17px}
.rxrow button .n{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.rxrow button[aria-pressed="true"]{border-color:var(--ink);background:#F2F6FA}
.rxrow button[aria-pressed="true"] .n{color:var(--ink);font-weight:700}
.rx{display:flex;gap:6px;padding:2px 14px 12px}
.rx button{flex:1;border:1px solid var(--rule);background:#fff;border-radius:10px;
  padding:7px 2px 5px;cursor:pointer;display:grid;gap:2px;place-items:center;line-height:1.1}
.rx button .e{font-size:20px}
.rx button .t{font-size:10.5px;color:var(--ink-soft);white-space:nowrap}
.rx button[aria-pressed="true"]{border-color:var(--ink);background:#F2F6FA}
.rx button[aria-pressed="true"] .t{color:var(--ink);font-weight:600}
.crow .rb{font-size:18px;flex:none;margin-left:2px}
.cm-close{width:100%;border:0;background:var(--ink);color:#fff;padding:12px;font-size:15px}

#settings{display:none;padding:14px 12px 100px;max-width:640px;margin:0 auto}
#settings.on{display:block}
.info{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:4px 14px;margin-bottom:12px}
.info div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--rule);font-size:14px}
.info div:last-child{border-bottom:0}
.info span{color:var(--ink-soft)}
.info b{font-weight:600;font-variant-numeric:tabular-nums}
.info .fold{cursor:pointer}
.info .fold .ar{font-style:normal;color:var(--ink-soft);font-size:11px;margin-left:2px}
.info .sub{padding:8px 0 8px 12px;font-size:13px;color:var(--ink-soft);border-bottom:1px solid var(--rule)}
.info .sub b{color:var(--ink);font-weight:500}

/* ---------- 하단 바 ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--rule);
  display:flex;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
}
.bar button{
  flex:1;border:1px solid var(--rule);background:#fff;border-radius:10px;
  padding:11px 1px;font-size:12.5px;letter-spacing:-.02em;
}
.bar .dot{margin-left:2px}
.bar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
body.makemode .tools,body.makemode .chips{display:none}

/* ---------- 인쇄(A4) ---------- */
#print{display:none}
@page{size:A4 portrait;margin:16mm 14mm}
@media print{
  header,.bar,main,#card{display:none !important}
  body{background:#fff;font-size:10pt}
  #print{display:block}
  .ph{display:flex;justify-content:space-between;align-items:baseline;
      border-bottom:1.2pt solid #000;padding-bottom:5px;margin-bottom:9px}
  .ph h2{margin:0;font-size:14pt;font-weight:600;letter-spacing:-.02em}
  .ph span{font-size:9pt;color:#444}
  table{width:100%;border-collapse:collapse}
  thead{display:table-header-group}
  tr{page-break-inside:avoid}
  th,td{border-bottom:.5pt solid #999;padding:5px 4px;text-align:left;vertical-align:top}
  th{border-bottom:1pt solid #000;font-size:9pt;font-weight:600}
  .cn{width:7%;color:#666;font-size:9pt}
  .cw{width:20%;font-family:"Newsreader",Georgia,serif;font-size:11.5pt;font-weight:600}
  .cm{width:24%}
  .cs{width:49%;font-size:9.5pt;line-height:1.4}
  .cs mark{background:none;font-weight:700;text-decoration:underline}
  .chk{display:inline-block;width:9px;height:9px;border:.5pt solid #666;margin-right:5px;vertical-align:-1px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>박수아의 영어 단어장</h1>
    <span class="count" id="count"></span>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="단어나 뜻으로 찾기" autocomplete="off">
    <button class="iconbtn ico" id="micBtn" hidden aria-label="음성으로 검색">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/>
        <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
        <path d="M12 17.5V21"/>
      </svg>
    </button>
    <button class="iconbtn ico" id="mHide" aria-pressed="false" aria-label="뜻 가리기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.6 12S6.2 5.6 12 5.6 21.4 12 21.4 12 17.8 18.4 12 18.4 2.6 12 2.6 12Z"/>
        <circle cx="12" cy="12" r="2.9"/>
      </svg>
    </button>
    <button class="iconbtn ico" id="printBtn" aria-label="인쇄하기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 8.5V3h10v5.5"/>
        <path d="M7 18H5a2 2 0 0 1-2-2v-4.5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2V16a2 2 0 0 1-2 2h-2"/>
        <rect x="7" y="14.5" width="10" height="6.5" rx="1"/>
      </svg>
    </button>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main id="list"></main>

<section id="card">
  <div class="flip" id="flip"></div>

/* ---------- 저장소 (localStorage, 실패 시 메모리) ---------- */
const store = (()=>{
  let ok=true; try{localStorage.setItem("_t","1");localStorage.removeItem("_t")}catch(e){ok=false}
  const mem={};
  return {
    get(k){ try{ return ok?localStorage.getItem(k):mem[k] }catch(e){ return mem[k] } },
    set(k,v){ try{ ok?localStorage.setItem(k,v):mem[k]=v }catch(e){ mem[k]=v } }
  };
})();
const key = d => d.id;

/* 저장 키를 고정 id로 바꾸면서, 예전 형식(단어 / 단어|뜻)으로 저장된
   체크 기록을 한 번만 자동으로 옮긴다. 이후 뜻을 수정해도 풀리지 않음. */
let learned = new Set(JSON.parse(store.get("learned")||"[]"));
(function migrate(){
  if(store.get("learned_v")==="3") return;
  const byWordMeaning={}, byWord={}, ids=new Set();
  WORDS.forEach(d=>{
    byWordMeaning[d.w+"|"+d.m]=d.id;
    (byWord[d.w]=byWord[d.w]||[]).push(d.id);
    ids.add(d.id);
  });
  const moved=new Set();
  learned.forEach(k=>{
    if(ids.has(k)) moved.add(k);
    else if(byWordMeaning[k]) moved.add(byWordMeaning[k]);
    else if(byWord[k]) byWord[k].forEach(id=>moved.add(id));
  });
  learned=moved;
  store.set("learned", JSON.stringify([...learned]));
  store.set("learned_v","3");
})();
const saveLearned = ()=> store.set("learned", JSON.stringify([...learned]));

const plain = t => t.replace(/\*\*/g,"");

const FILTERS = [
  {id:"all",  label:"전체",      ic:ICON_ALL},
  {id:"todo", label:"안 외운 것", ic:ICON_TODO},
  {id:"done", label:"외운 것",    ic:ICON_DONE},
  ...(BOOKS.length>1 ? BOOKS.map(b=>({id:"B:"+b, label:b, ic:""})) : [])
];
let filter="all", query="", hide=false, mode="list", ci=0, revealed=false;



function visible(){
  const q = query.trim().toLowerCase();
  return WORDS.filter((d,i)=>{
    if(filter==="done" && !learned.has(key(d))) return false;
    if(filter==="todo" &&  learned.has(key(d))) return false;
    if(filter.startsWith("B:") && d.b!==filter.slice(2)) return false;
    if(!q) return true;
    return (d.w+" "+d.m+" "+d.s).toLowerCase().includes(q);
  });
}

/* ---------- 목록 ---------- */
function renderList(){
  const rows = visible();
  const el = document.getElementById("list");
  document.getElementById("count").textContent = `${WORDS.length}단어 · 외움 ${learned.size}`;

  if(!rows.length){
    el.innerHTML = `<div class="empty">${WORDS.length ? "찾는 단어가 없어요." :
      "아직 단어가 없어요.<br>교재 페이지를 사진으로 찍어 올리면<br>여기에 하나씩 쌓입니다."}</div>`;
    return;
  }
  el.innerHTML = rows.map(d=>{
    const on = learned.has(key(d));
    return `<article class="entry ${on?"done":""} ${hide?"hide":""}">
      <div class="w">${esc(d.w)}</div>
      <div class="m">${esc(d.m)}</div>
      <div class="s">${mark(d.s)}</div>
      
      <div class="side">
        <button class="mini ${on?"on":""}" data-done="${esc(key(d))}"
                aria-label="${on?"외움 해제":"외움 표시"}">${on?ICON_CHECK:ICON_TODO}</button>
        <button class="mini" data-say="${esc(d.w)}" aria-label="발음 듣기">${ICON_SOUND}</button>
      </div>
    </article>`;
  }).join("");
}

/* ---------- 카드 ---------- */
function renderCard(){
  const rows = visible();
  const flip = document.getElementById("flip");
  if(!rows.length){ flip.innerHTML=`<div class="veil">보여줄 단어가 없어요.</div>`;
                    document.getElementById("pos").textContent=""; return; }
  if(ci>=rows.length) ci=0;
  const d = rows[ci];
  flip.innerHTML =
    `<button class="fw sp" data-say="${esc(d.w)}" aria-label="${esc(d.w)} 발음 듣기">${esc(d.w)}<i class="spk">${ICON_SOUND}</i></button>` +
    (revealed
      ? `<div class="fm">${esc(d.m)}</div>
         <button class="fs sp" data-say="${esc(plain(d.s))}" aria-label="예문 발음 듣기">${mark(d.s)}<i class="spk">${ICON_SOUND}</i></button>`
      : `<div class="veil">영어를 누르면 발음이 들려요<br>빈 곳을 누르면 뜻이 보여요</div>`);
  document.getElementById("pos").textContent = `${ci+1} / ${rows.length}`;
  document.getElementById("reveal").textContent = revealed ? "뜻 숨기기" : "뜻 보기";
}

function render(){
  document.getElementById("list").style.display = mode==="list" ? "" : "none";
  document.getElementById("card").classList.toggle("on", mode==="card");
  document.getElementById("maker").classList.toggle("on", mode==="make");
  document.getElementById("dex").classList.toggle("on", mode==="dex");
  document.getElementById("settings").classList.toggle("on", mode==="set");
  document.body.classList.toggle("makemode", mode!=="list" && mode!=="card");
  if(mode==="list") renderList();
  else if(mode==="card") renderCard();
  else if(mode==="make") renderMaker();
  else if(mode==="dex") renderDex();
  else renderSettings();
}

/* ---------- 이벤트 ---------- */
const chips = document.getElementById("chips");
chips.innerHTML = FILTERS.map(f=>
  `<button class="chip" data-f="${f.id}" aria-pressed="${f.id==="all"}">${f.ic||""}${f.label}</button>`).join("");
chips.addEventListener("click", e=>{
  const b=e.target.closest("[data-f]"); if(!b) return;
  filter=b.dataset.f; ci=0; revealed=false;
  [...chips.children].forEach(c=>c.setAttribute("aria-pressed", c===b));
  render();
});

document.getElementById("q").addEventListener("input", e=>{ query=e.target.value; ci=0; render(); });

document.getElementById("list").addEventListener("click", e=>{
  const dn=e.target.closest("[data-done]"), sy=e.target.closest("[data-say]");
  if(dn){ const w=dn.dataset.done;
          if(learned.has(w)){ learned.delete(w); pendingDel.add(w); }
          else { learned.add(w); pendingDel.delete(w); }
          saveLearned(); savePendingDel(); render(); updateDexDot(); syncPush(); }
  if(sy) say(sy.dataset.say);
});

function say(w){
  if(!("speechSynthesis" in window)) return;
  const u=new SpeechSynthesisUtterance(w); u.lang="en-US";
  u.rate = w.trim().includes(" ") ? 0.9 : 0.8;   // 문장은 조금 덜 느리게
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---------- 음성 입력 (검색: 영어 / 문장 도우미: 한국어) ---------- */
function setupVoice(btn, lang, onText){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR || !btn) return;
  btn.hidden = false;

  const rec = new SR();
  rec.lang = lang;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let on = false;
  const stop = ()=>{ on=false; btn.classList.remove("rec"); };

  btn.addEventListener("click", ()=>{
    if(on){ rec.stop(); stop(); return; }
    try{ rec.start(); on=true; btn.classList.add("rec"); }
    catch(e){ stop(); }
  });
  rec.addEventListener("result", e=>{
    let t=""; for(const r of e.results) t += r[0].transcript;
    onText(t.replace(/[.,!?]$/,"").trim());
  });
  rec.addEventListener("end", stop);
  rec.addEventListener("error", ev=>{
    stop();
    if(ev.error==="not-allowed")
      alert("마이크 사용이 차단되어 있어요.\n설정 → Safari → 마이크에서 허용해 주세요.");
  });
}

/* ---------- 문장 도우미 ----------
   한국어 문장에서 단어장에 있는 단어를 찾아 준다.
   조사·어미가 붙어도 걸리도록 뜻에서 어간을 뽑아 대조한다. */

// 뜻 문자열에서 검색용 낱말들을 뽑아낸다: "~를 살펴보다" → ["살펴보다"]
function korTerms(m){
  return m.replace(/[（(][^)）]*[)）]/g,"")   // 괄호 설명 제거
          .replace(/—.*$/,"")                 // 대시 뒤 부연 제거
          .split(/[,、/·]/)
          .map(t=>t.replace(/~[를을이가에서의로]?/g," ").replace(/\s+/g," ").trim())
          .filter(t=>/[가-힣]/.test(t));
}

// 과거형 축약: 그리다→그렸, 자다→잤, 보다→봤
function contracted(stem){
  if(!stem) return null;
  const c=stem.charCodeAt(stem.length-1)-0xAC00;
  if(c<0||c>11171||c%28!==0) return null;      // 받침 있으면 축약 안 일어남
  const jung=Math.floor(c/28)%21, cho=Math.floor(c/28/21);
  const map={0:0,1:1,4:4,5:5,8:9,13:14,20:6};   // ㅏㅐㅓㅔ 그대로 / ㅗ→ㅘ / ㅜ→ㅝ / ㅣ→ㅕ
  if(!(jung in map)) return null;
  const ch=0xAC00+((cho*21+map[jung])*28)+20;   // 받침 ㅆ
  return stem.slice(0,-1)+String.fromCharCode(ch);
}

// 한 낱말이 문장에 나타나는지 볼 때 쓸 형태들. [형태, 한글자허용]
function korForms(term){
  const out=new Map();
  const push=(f,short)=>{ if(f && (f.length>=2 || short)) out.set(f, out.get(f)||short); };
  const derive=(t,short)=>{
    push(t,short);
    const v=t.match(/^(.+)다$/);                 // 동사·형용사 어간
    if(v){
      const one = short && v[1].length===1;
      push(v[1], one);
      push(contracted(v[1]), one);               // 과거형
    }
    const a=t.match(/^(.+?)(한|인|은|는|던|운|나|린)$/); // 관형형·불규칙
    if(a && a[1].length>=2) push(a[1],false);
  };
  derive(term,true);
  // 뜻이 여러 낱말이면 각 낱말도 따로 본다 ("천둥번개를 동반한 비" → "천둥번개")
  if(/\s/.test(term)){
    term.split(/\s+/).forEach(tk=>{
      derive(tk.replace(/[를을이가은는의에서로와과]$/,""), false);
    });
  }
  return [...out.entries()];
}

const ENDINGS="요|아|어|았|었|는|은|을|를|ㄹ|고|지|기|니|나|면|자|ㅁ|음|와|워|여|해|이|가|도|만|에";

function findWords(input){
  const text=input.trim();
  if(!text) return {hits:[],ranges:[]};
  const low=text.toLowerCase();
  const hits=[], ranges=[];

  WORDS.forEach(d=>{
    let best=null;

    // 영어 단어를 그대로 쓴 경우
    const ew=d.w.toLowerCase();
    const ei=low.indexOf(ew);
    if(ei>=0) best={i:ei,len:ew.length,via:d.w};

    korTerms(d.m).forEach(term=>{
      korForms(term).forEach(([f,short])=>{
        if(f.length>=2){
          const i=text.indexOf(f);
          if(i>=0 && (!best||f.length>best.len)) best={i,len:f.length,via:f};
        }else if(short){
          // 어간이 한 글자면 어미가 붙은 형태일 때만 인정 ("자"+"요")
          const re=new RegExp(f+"("+ENDINGS+")");
          const m2=re.exec(text);
          if(m2 && (!best||best.len<2)) best={i:m2.index,len:m2[0].length,via:m2[0]};
        }
      });
    });

    if(best){ hits.push({d,...best}); ranges.push([best.i,best.i+best.len]); }
  });

  hits.sort((a,b)=>a.i-b.i);
  return {hits,ranges};
}

// 찾은 부분은 노란색, 못 찾은 부분은 빨간색으로 보여 준다
function coverage(text,ranges){
  if(!text.trim()) return "";
  const merged=[];
  ranges.slice().sort((a,b)=>a[0]-b[0]).forEach(r=>{
    const last=merged[merged.length-1];
    if(last && r[0]<=last[1]) last[1]=Math.max(last[1],r[1]);
    else merged.push(r.slice());
  });
  let out="",p=0;
  merged.forEach(([s,e])=>{
    if(s>p) out+=missSpan(text.slice(p,s));
    out+="<mark>"+esc(text.slice(s,e))+"</mark>";
    p=e;
  });
  if(p<text.length) out+=missSpan(text.slice(p));
  return out;
}
// 조사·공백처럼 굳이 표시할 필요 없는 부분은 그냥 두고, 낱말만 빨갛게
function missSpan(chunk){
  return chunk.split(/(\s+)/).map(part=>{
    if(!part.trim()) return esc(part);
    return /[가-힣a-zA-Z]{2,}/.test(part)
      ? '<span class="miss">'+esc(part)+"</span>" : esc(part);
  }).join("");
}

function renderMaker(){
  const text=document.getElementById("kin").value;
  const out=document.getElementById("mkOut");
  if(!text.trim()){ out.innerHTML=""; return; }

  const {hits,ranges}=findWords(text);
  let html=`<div class="cov"><span class="lead">노란색은 단어장에 있는 말, 빨간색은 아직 없는 말이에요.</span>${coverage(text,ranges)}</div>`;

  if(!hits.length){
    html+=`<div class="mk-none">이 문장에 쓸 만한 단어가 아직 단어장에 없어요.<br>더 쉬운 말로 바꿔서 다시 해 보세요.</div>`;
  }else{
    html+=`<p class="mk-count">쓸 수 있는 단어 ${hits.length}개</p>`;
    html+=hits.map(({d})=>`<article class="entry">
      <div class="w">${esc(d.w)}</div>
      <div class="m">${esc(d.m)}</div>
      <div class="s">${mark(d.s)}</div>
      <div class="side">
        <button class="mini" data-say="${esc(d.w)}" aria-label="발음 듣기">${ICON_SOUND}</button>
      </div>
    </article>`).join("");
  }
  out.innerHTML=html;
}

 {id:"sydney",en:"Sydney",ko:"시드니",cen:"Australia",cko:"호주",con:"오세아니아",mo:"Opera House",mko:"오페라 하우스",
  art:A("#BEE0F2","#5C93B8",`<g fill="#F6F5F0"><path d="M28 70q4-26 20-26t18 26z"/><path d="M50 70q4-21 18-21t16 21z"/><path d="M70 70q3-15 13-15t11 15z"/></g><rect x="20" y="70" width="80" height="3.4" fill="#CFCFC6"/>`)},
 {id:"auckland",en:"Auckland",ko:"오클랜드",cen:"New Zealand",cko:"뉴질랜드",con:"오세아니아",mo:"Sky Tower",mko:"스카이 타워",
  art:A("#CBE7F3","#6F9B7A",`<path d="M56 72 58 42h6l2 30z" fill="#BCC2CB"/><path d="M54 42h14l-2.4-9h-9.2z" fill="#9AA0AA"/><ellipse cx="61" cy="32" rx="10" ry="5.4" fill="#8A9099"/><rect x="60" y="8" width="2.4" height="19" fill="#9AA0AA"/><rect x="24" y="58" width="12" height="14" fill="#A9B3BC"/><rect x="88" y="62" width="11" height="10" fill="#A9B3BC"/>`)}
];

let unlocked = new Set(JSON.parse(store.get("cities")||"[]"));
const saveCities = ()=> store.set("cities", JSON.stringify([...unlocked]));
const NEED = 10;                        // 카드 한 장에 필요한 단어 수
const owed = ()=> Math.max(0, Math.floor(learned.size/NEED) - unlocked.size);
function updateDexDot(){
  const d=document.getElementById("dexDot"); if(!d) return;
  const n=owed(), left=CITIES.filter(c=>!unlocked.has(c.id)).length;
  d.hidden = !(n>0 && left); d.textContent = n;
}

/* ---------- 세계지도 대시보드 ---------- */
const CONS=["아메리카","유럽","아프리카","아시아","오세아니아"];
const CON_COLOR={"아메리카":"#E08A5D","유럽":"#5B8DC9","아프리카":"#D9A441","아시아":"#4FA08A","오세아니아":"#9A7BC8"};
const CON_PATH={
 "아메리카":"M12 26 20 17 42 20 58 19 80 15 96 20 116 32 126 43 110 52 104 63 99 77 90 72 83 77 86 89 93 90 97 100 102 101 110 97 120 105 131 111 145 118 142 128 132 145 122 157 115 170 110 183 107 170 109 151 110 135 105 118 100 111 95 100 88 93 75 85 66 71 55 59 56 48 45 35 30 33 15 39Z",
 "유럽":"M168 66 166 56 174 50 180 44 184 34 190 24 200 19 211 23 214 34 210 45 200 50 192 55 184 60 176 66Z M191 52 195 56 197 64 193 62 190 56Z M172 44 178 42 177 50 171 49Z",
 "아프리카":"M163 84 174 65 190 63 214 75 217 92 223 96 231 96 221 114 220 131 212 145 205 156 198 156 193 127 192 119 190 113 188 106 175 105 163 92Z M222 148 226 144 227 152 223 155Z",
 "아시아":"M211 22 240 17 270 12 320 16 340 22 350 33 340 39 320 52 305 62 302 72 290 85 285 98 278 101 275 92 270 83 260 101 252 85 245 79 236 79 230 96 223 96 228 72 220 59 215 56 210 52 210 39Z M328 40 334 46 336 56 330 52Z",
 "오세아니아":"M294 140 309 127 322 126 326 135 333 144 330 161 320 161 309 153 295 156Z M350 163 356 160 358 168 352 172Z"
};
const ISLES="M138 10 158 8 162 20 152 32 140 28Z";

const PIN={
 paris:[182,47], london:[180,44], rome:[193,56], athens:[204,62], barcelona:[182,57],
 amsterdam:[185,43], tokyo:[320,65], seoul:[307,62], beijing:[296,59], agra:[258,76],
 istanbul:[209,58], bangkok:[281,93], newyork:[106,58], sanfrancisco:[58,62],
 rio:[137,141], cusco:[108,129], cairo:[211,72], nairobi:[217,113],
 sydney:[331,156], auckland:[355,160]
};
const PIN_SHAPE="M0 0c0 0-4.6-6-4.6-8.6a4.6 4.6 0 1 1 9.2 0C4.6-6 0 0 0 0z";
function pins(){
  return CITIES.filter(c=>unlocked.has(c.id) && PIN[c.id]).map(c=>{
    const [x,y]=PIN[c.id];
    return `<g transform="translate(${x},${y})" data-city="${c.id}" class="pin">
      <circle r="9" fill="transparent"/>
      <path d="${PIN_SHAPE}" fill="#E23B2E" stroke="#fff" stroke-width="1.1"/>
      <circle cy="-8.6" r="1.7" fill="#fff"/></g>`;
  }).join("");
}

function conStat(){
  const st={};
  CONS.forEach(c=>st[c]={have:0,total:0});
  CITIES.forEach(c=>{ st[c.con].total++; if(unlocked.has(c.id)) st[c.con].have++; });
  return st;
}

function worldMap(st,sel){
  const paths=CONS.map(c=>{
    const {have,total}=st[c];
    const ratio = total ? have/total : 0;
    const col = CON_COLOR[c];
    const fill = have===0 ? "#DDE4EB" : col;
    const op = have===0 ? 1 : (0.32 + 0.68*ratio);
    const stroke = sel===c ? "#16324F" : "#C6D2DC";
    const sw = sel===c ? 2 : 1;
    return `<path d="${CON_PATH[c]}" fill="${fill}" fill-opacity="${op.toFixed(2)}"
      stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" data-con="${c}"/>`;
  }).join("");
  return `<svg class="wmap" viewBox="0 0 362 192" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="대륙별 수집 현황">
    <rect width="362" height="192" rx="10" fill="#EAF3F9"/>
    <g stroke="#D3E4EF" stroke-width=".8">
      <path d="M0 48h362M0 96h362M0 144h362"/>
      <path d="M60 0v192M121 0v192M181 0v192M241 0v192M302 0v192"/>
    </g>
    <path d="${ISLES}" fill="#DDE4EB" stroke="#C6D2DC" stroke-width="1"/>
    ${paths}${pins()}</svg>`;
}

function legend(st,sel){
  return `<div class="legend">`+CONS.map(c=>{
    const {have,total}=st[c];
    return `<button class="lg" data-con="${c}" aria-pressed="${sel===c}">
      <i class="sw" style="background:${have?CON_COLOR[c]:"#DDE4EB"}"></i>
      <span class="nm">${c}</span><span class="ct">${have}/${total}</span></button>`;
  }).join("")+`</div>`;
}

/* ---------- 도감 ---------- */
let dexFilter=null, rxFilter=null, packCity=null, sampleIdx=0;

function rxCount(k){
  return CITIES.filter(c=>unlocked.has(c.id) && reacts[c.id]===k).length;
}

function rxRow(){
  return `<div class="rxrow">`+REACTS.map(r=>
    `<button data-rx-f="${r.k}" aria-pressed="${rxFilter===r.k}" aria-label="${r.t}">
       <span class="e">${r.e}</span><span class="n">${rxCount(r.k)}</span></button>`).join("")+`</div>`;
}

function renderDex(){
  const top=document.getElementById("dexTop"), grid=document.getElementById("dexGrid");
  const st=conStat(), left=CITIES.filter(c=>!unlocked.has(c.id)), n=owed();
  updateDexDot();

  top.innerHTML=
    `<div class="map-card">
       <div class="map-head"><b>모은 도시 ${unlocked.size} / ${CITIES.length}</b>
         <span>다음 티켓까지 ${Math.max(0,(unlocked.size+1)*NEED - learned.size)}단어</span></div>
       ${worldMap(st,dexFilter)}
       ${legend(st,dexFilter)}
       ${rxRow()}
     </div>` + packArea(n,left.length);

  let shown = CITIES;
  if(dexFilter) shown = shown.filter(c=>c.con===dexFilter);
  if(rxFilter)  shown = shown.filter(c=>unlocked.has(c.id) && reacts[c.id]===rxFilter);
  const order = [...shown].sort((a,b)=>(unlocked.has(b.id)?1:0)-(unlocked.has(a.id)?1:0));

  const tags=[dexFilter, rxFilter && REACTS.find(r=>r.k===rxFilter).t].filter(Boolean).join(" · ");
  let head = tags ? `${tags} — ${shown.length}곳` : `도시 ${shown.length}곳`;
  if(tags) head += ` <button class="clr" id="clrF">전체 보기</button>`;

  grid.innerHTML=`<p class="clist-h">${head}</p>`
    + (order.length ? `<div class="clist">`+order.map(c=>unlocked.has(c.id)
      ? `<div class="crow" data-city="${c.id}">
           <div class="th">${c.art}</div>
           <div class="tx"><div class="en">${esc(c.en)}</div>
             <div class="ko">${esc(c.ko)} · ${esc(c.cko)}</div>
             <div class="mo">${esc(c.mko)}</div></div>
           <div class="rb">${reactEmoji(c.id)}</div></div>`
      : `<div class="crow lock"><div class="th">?</div>
           <div class="tx"><div class="en">? ? ?</div>
             <div class="ko">${esc(c.con)}</div>
             <div class="mo">아직 열지 않은 카드</div></div></div>`
    ).join("")+`</div>`
    : `<div class="dex-msg" style="margin-top:10px">여기에 해당하는 도시가 아직 없어요.</div>`);
}

function packArea(n,leftCount){
  const done=!leftCount, canGo=n>0 && !done;
  const globe=`<svg class="globe" viewBox="0 0 100 100" fill="none" stroke="#9FC0DC" stroke-width="3">
    <circle cx="50" cy="50" r="36"/><ellipse cx="50" cy="50" rx="15" ry="36"/>
    <path d="M15 38h70M15 62h70M50 14v72"/></svg>`;
  const sc=CITIES[sampleIdx % CITIES.length];
  const sampleFace=`${sc.art}<div class="cm-t"><div class="en">${esc(sc.en)}</div>
     <div class="ko">${esc(sc.ko)} · ${esc(sc.cko)}</div>
     <div class="mo"><b>${esc(sc.mo)}</b></div></div>`;

  return `<div class="pack-wrap">
    <div class="chance">
      <i class="ci">${ICON_TICKET}</i>
      <span class="cl">나의 여행 티켓</span>
      <b class="cv">${n}<em>장</em></b>
    </div>
    <div class="pack-sub">${done
      ? "도시를 모두 모았어요! 새로운 도시가 곧 추가돼요."
      : `단어 ${NEED}개를 외울 때마다 티켓이 한 장 생겨요.`}</div>

    <button class="go" id="packGo" ${canGo?"":"disabled"}>
      ${ICON_PLANE}<span>출발하기</span>
    </button>

    <div class="pack${canGo?"":" sample open"}" id="pack"><div class="pack-in">
      <div class="face front">${globe}<div class="txt">READY</div></div>
      <div class="face back" id="packBack">${canGo?"":sampleFace}</div>
    </div></div>

    ${canGo
      ? `<button class="pack-ok" id="packOk" hidden>확인</button>`
      : `<div class="pack-note">샘플 카드예요 · 눌러서 다른 도시 그림 보기 (${(sampleIdx%CITIES.length)+1}/${CITIES.length})</div>`}
  </div>`;
}

function openPack(){
  const left=CITIES.filter(c=>!unlocked.has(c.id));
  if(!left.length) return;
  const c=left[Math.floor(Math.random()*left.length)];
  packCity=c;
  document.getElementById("packBack").innerHTML=
    `${c.art}<div class="cm-t"><div class="en">${esc(c.en)}</div>
     <div class="ko">${esc(c.ko)} · ${esc(c.cko)}</div>
     <div class="mo"><b>${esc(c.mo)}</b></div></div>`;
  document.getElementById("pack").classList.add("open");
  unlocked.add(c.id); saveCities(); syncPush();     // 뒤집는 순간 바로 수집
  setTimeout(()=>say(c.en), 620);
  setTimeout(()=>{ const b=document.getElementById("packOk"); if(b) b.hidden=false; }, 900);
}

document.getElementById("dexTop").addEventListener("click", e=>{
  if(e.target.closest("#packOk")){ renderDex(); return; }
  if(e.target.closest("#packGo")){ openPack(); return; }
  const pk=e.target.closest("#pack");
  if(pk){
    if(pk.classList.contains("sample")){          // 샘플 카드는 눌러서 다음 도시로
      sampleIdx=(sampleIdx+1)%CITIES.length; renderDex();
    }else if(!pk.classList.contains("open")){
      openPack();
    }
    return;
  }
  const pin=e.target.closest(".pin");
  if(pin){ openCity(pin.dataset.city); return; }
  const rf=e.target.closest("[data-rx-f]");
  if(rf){ rxFilter = rxFilter===rf.dataset.rxF ? null : rf.dataset.rxF; renderDex(); return; }
  const c=e.target.closest("[data-con]");
  if(c){ dexFilter = dexFilter===c.dataset.con ? null : c.dataset.con; renderDex(); }
});
document.getElementById("dexGrid").addEventListener("click", e=>{
  if(e.target.closest("#clrF")){ dexFilter=null; rxFilter=null; renderDex(); }
});


/* ---------- 기기 간 동기화 ----------
   동기화를 켠 기기끼리만 합쳐진다. 끈 기기는 그 안에만 기록한다.
   서버가 준비되지 않았으면 조용히 기기 저장만 쓴다. */
let syncOn = store.get("syncOn")==="1";
let pendingDel = new Set(JSON.parse(store.get("pendingDel")||"[]"));
let syncState = "";                     // 화면에 보여줄 상태 문구
const savePendingDel = ()=> store.set("pendingDel", JSON.stringify([...pendingDel]));

function applyRemote(o){
  let changed=false;
  (o.l||[]).forEach(x=>{ if(!pendingDel.has(x) && !learned.has(x)){ learned.add(x); changed=true; } });
  (o.c||[]).forEach(x=>{ if(!unlocked.has(x)){ unlocked.add(x); changed=true; } });
  Object.entries(o.r||{}).forEach(([k,v])=>{ if(!reacts[k]){ reacts[k]=v; changed=true; } });
  if(changed){ saveLearned(); saveCities(); saveReacts(); }
  return changed;
}

async function syncPull(){
  if(!syncOn) return;
  try{
    const r=await fetch("/api/sync",{cache:"no-store"});
    if(r.status===503){ syncState="서버 연결 전"; renderIfDex(); return; }
    if(!r.ok) throw 0;
    const changed=applyRemote(await r.json());
    syncState="맞춤"; if(changed) render(); else renderIfDex();
  }catch(e){ syncState="연결 안 됨"; renderIfDex(); }
}

let pushTimer=null;
function syncPush(){
  if(!syncOn) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(async ()=>{
    try{
      const r=await fetch("/api/sync",{method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({l:[...learned], c:[...unlocked], r:reacts, del:[...pendingDel]})});
      if(r.status===503){ syncState="서버 연결 전"; renderIfDex(); return; }
      if(!r.ok) throw 0;
      pendingDel.clear(); savePendingDel();
      applyRemote(await r.json());
      syncState="맞춤"; renderIfDex();
    }catch(e){ syncState="연결 안 됨"; renderIfDex(); }
  }, 1200);
}
function renderIfDex(){ if(mode==="dex") renderDex(); else if(mode==="set") renderSettings(); }

document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncPull(); });
if(syncOn) syncPull();

/* ---------- 기록 옮기기 ----------
   아이폰은 사파리와 홈 화면 앱의 저장 공간을 따로 쓴다.
   한쪽에서 코드를 내보내 다른 쪽에서 불러오면 기록이 합쳐진다. */
const UPDATED="2026-09-07";
let booksOpen=false;
function bookList(){
  const m={};
  WORDS.forEach(d=>{ if(d.b) m[d.b]=(m[d.b]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function renderSettings(){
  document.getElementById("settings").innerHTML=`
    <div class="info">
      <div><span>최종 업데이트</span><b>${UPDATED}</b></div>
      <div><span>단어</span><b>${WORDS.length}개</b></div>
      <div><span>외운 단어</span><b>${learned.size}개</b></div>
      <div><span>모은 도시</span><b>${unlocked.size} / ${CITIES.length}</b></div>
      <div class="fold" id="bookRow"><span>교재</span><b>${bookList().length}권 <i class="ar">${booksOpen?"▾":"▸"}</i></b></div>
      ${booksOpen ? bookList().map(([b,n])=>
        `<div class="sub"><span>${esc(b)}</span><b>${n}개</b></div>`).join("") : ""}
    </div>

    <div class="backup">
      <h4>기기 간 동기화</h4>
      <p>동기화를 켠 기기끼리 외운 단어·모은 도시·이모티콘이 자동으로 합쳐집니다.
         꺼 두면 그 기기 안에만 기록됩니다.</p>
      <div class="bt">
        <button id="syncBtn" aria-pressed="${syncOn}">${syncOn?"동기화 켜짐":"동기화 꺼짐"}</button>
      </div>
      ${syncOn&&syncState?`<p style="margin:8px 0 0">상태: ${esc(syncState)}</p>`:""}
    </div>

    <div class="backup">
      <h4>기록 옮기기 · 백업</h4>
      <p>동기화를 쓰지 않고 기록만 옮길 때 사용합니다.
         기록이 있는 쪽에서 <b>내보내기</b>로 코드를 복사하고, 받을 쪽에서 <b>불러오기</b>에 붙여넣으면 합쳐집니다.</p>
      <div class="bt">
        <button id="bkOut">내보내기</button>
        <button id="bkIn">불러오기</button>
      </div>
      <textarea id="bkArea" readonly hidden placeholder="코드가 여기에 나옵니다"></textarea>
    </div>`;
}

function makeCode(){
  return btoa(JSON.stringify({v:1, l:[...learned], c:[...unlocked], r:reacts}));
}
function applyCode(code){
  const o=JSON.parse(atob(code.trim()));
  (o.l||[]).forEach(x=>learned.add(x));
  (o.c||[]).forEach(x=>unlocked.add(x));
  Object.entries(o.r||{}).forEach(([k,v])=>{ if(!reacts[k]) reacts[k]=v; });
  saveLearned(); saveCities(); saveReacts();
}
document.getElementById("settings").addEventListener("click", e=>{
  if(e.target.closest("#bookRow")){ booksOpen=!booksOpen; renderSettings(); return; }
  if(e.target.closest("#syncBtn")){
    syncOn=!syncOn; store.set("syncOn", syncOn?"1":"0");
    syncState=""; renderSettings();
    if(syncOn){ syncPull(); syncPush(); }
    return;
  }
  if(e.target.closest("#bkOut")){
    const t=document.getElementById("bkArea");
    t.hidden=false; t.value=makeCode(); t.removeAttribute("readonly");
    t.focus(); t.setSelectionRange(0, t.value.length); t.setAttribute("readonly","");
    return;
  }
  if(e.target.closest("#bkIn")){
    const v=prompt("다른 기기나 사파리에서 내보낸 코드를 붙여넣으세요.");
    if(!v) return;
    try{ applyCode(v); renderSettings(); alert("기록을 불러왔어요."); }
    catch(err){ alert("코드를 알아볼 수 없어요. 다시 복사해 보세요."); }
    return;
  }
});
document.getElementById("dexGrid").addEventListener("click", e=>{
  const t=e.target.closest("[data-city]"); if(t) openCity(t.dataset.city);
});

/* ---------- 도시 카드에 남기는 반응 ---------- */
const REACTS=[{k:"like",e:"👍",t:"좋아요"},{k:"nope",e:"👎",t:"싫어요"},
              {k:"love",e:"❤️",t:"사랑해"},{k:"visit",e:"✈️",t:"가보고 싶어"}];
let reacts = (()=>{ try{ return JSON.parse(store.get("reacts")||"{}"); }catch(e){ return {}; } })();
const saveReacts = ()=> store.set("reacts", JSON.stringify(reacts));
const reactEmoji = id => (REACTS.find(r=>r.k===reacts[id])||{}).e || "";

let modalCity=null;

function openCity(id){
  const c=CITIES.find(x=>x.id===id); if(!c) return;
  modalCity=id;
  document.getElementById("cmBox").innerHTML=
    `${c.art}
     <div class="cm-t">
       <div class="en" data-say="${esc(c.en)}">${esc(c.en)}<i class="spk">${ICON_SOUND}</i></div>
       <div class="ko">${esc(c.ko)} · ${esc(c.cen)} (${esc(c.cko)})</div>
       <div class="mo"><b>${esc(c.mo)}</b> · ${esc(c.mko)}</div>
     </div>
     <div class="rx">${REACTS.map(r=>
       `<button data-rx="${r.k}" aria-pressed="${reacts[id]===r.k}" aria-label="${r.t}">
          <span class="e">${r.e}</span><span class="t">${r.t}</span></button>`).join("")}</div>
     <button class="cm-close">닫기</button>`;
  document.getElementById("cityModal").hidden=false;
}

document.getElementById("cityModal").addEventListener("click", e=>{
  const rx=e.target.closest("[data-rx]");
  if(rx){
    const k=rx.dataset.rx;
    if(reacts[modalCity]===k) delete reacts[modalCity]; else reacts[modalCity]=k;
    saveReacts(); syncPush(); openCity(modalCity); renderDex(); return;
  }
  if(e.target.closest(".cm-close") || e.target.id==="cityModal"){
    document.getElementById("cityModal").hidden=true; return;
  }
  const sp=e.target.closest("[data-say]"); if(sp) say(sp.dataset.say);
});

document.getElementById("printBtn").addEventListener("click", ()=>{ renderPrint(); window.print(); });
window.addEventListener("beforeprint", renderPrint);

render();
</script>
